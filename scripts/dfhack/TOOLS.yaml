# Tool manifest for df-overseer's DFHack scripts.
#
# Built 2026-09-12 per the take-stock/architecture pass's recommendation
# (decisions/DECISIONS.md 2026-09-12, "Opus-authored take-stock/architecture
# pass"): a small manifest instead of splitting the Lua tools into
# perception/ and action/ directories, since every action tool here is
# deliberately fused with its perception counterpart (build_open_area with
# find_open_area, dig_diggable_area with find_diggable_area, build_at_landmark
# with get_landmark_centroid) rather than kept separate. Doubles as a first
# draft of the still-missing MCP tool schema (docs/PURPOSE.md design
# commitment #5: "the brain lives outside this repo... this repo exposes DF
# over MCP") -- when that server gets built, each command block below is
# close to the shape one MCP tool definition needs (name, args, whether it
# mutates, what it returns).
#
# This is metadata ABOUT scripts/dfhack/*.lua, not a substitute for reading
# them -- each file's own header comment carries the full design rationale,
# live-verification detail, and honest caveats. Keep this file to one entry
# per CLI subcommand; if a subcommand's story needs more than a line or two,
# that belongs in the .lua file's own comment or a decisions/DECISIONS.md row,
# linked from here, not duplicated.
#
# Field meanings:
#   effect
#     read    -- queries fort state, never mutates it
#     mutate  -- causes a real, persistent change (a designation, a labor
#                flip, a UI-driven state change) -- gate live use the same
#                way any fort-mutating action is gated (quicksave discipline,
#                peer/user heads-up), not like a read command
#   coordinate_bearing
#     false           -- design commitment #1 (docs/PURPOSE.md): no raw x/y/z
#                        ever appears in this command's output. Landmark
#                        name/direction/distance_tiles instead.
#     internal-only   -- a real coordinate IS resolved and used internally
#                        (usually to drive `quickfort run -c x,y,z`), but
#                        never printed, returned, or assigned outside the
#                        function's own local scope.
#     true            -- a raw coordinate DOES appear in this command's
#                        output. Each true below is annotated with why: a
#                        documented, spec-sanctioned exception; a known,
#                        not-yet-fixed gap; or out-of-scope tooling (embark-
#                        site-selection UI automation, which predates any
#                        founded fort and isn't itself perception-layer code).
#   live_deployed
#     Whether the FILE is on VM 103's script-paths (per install_df.py
#     ui-install / script-install). All 10 files are, confirmed
#     2026-09-12 (Working.md handover) -- this field exists per-command
#     anyway since a file being deployed doesn't mean every subcommand in it
#     has been exercised for real. "STALE" (see notes) marks a command
#     whose code was fixed in the repo but where VM 103 is still running an
#     older version of the file -- distinct from a clean true/false, since
#     the file IS present, just not the current code.
#   verified
#     Last date this SPECIFIC command was confirmed against a real, running
#     fort (not just "the file loads without error"). "unverified" is an
#     honest label, not a bug -- per this repo's "mark verified vs proposed"
#     rule (CLAUDE.md, memory/dfhack-environment.md).
#   notes
#     A pointer, not a re-narration. Long rationale lives in the .lua file's
#     own header or a decisions/DECISIONS.md row.

