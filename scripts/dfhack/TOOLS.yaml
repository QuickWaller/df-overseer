              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
              resolved to its real footprint server-side. An id that is not an activity zone (a
              workshop id, for example) is a named error, not a guess.
          - name: "UNIT_ID"
            required: true
            default: null
            meaning: >-
              The unit id to assign as owner, or a position code as zone.OWNER describes.
          - name: "DRY_RUN"
            required: false
            default: "true"
