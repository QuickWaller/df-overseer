    "audit [ZONE_ID] [DRY_RUN]":
      lua_function: audit_constructions
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, lupa-tested against a fake world only, 2026-10-01, handoffs/2026-10-01-entrances-get-doors.md -- the office's own real geometry as a fixture). bld:getBuildStage()==bld:getMaxBuildStage() and dfhack.job.getHolder/job.flags.suspend are each already a live-verified call site elsewhere in this codebase (df-overseer-building.lua's kind_previously_built, df-overseer-zone.lua's content_row, df-overseer-stuckjobs.lua's get_stuck_jobs/job.flags.suspend) -- this file only recombines them, nothing here has run against a live fort. DRY_RUN defaults to true: a bare read never suspends anything."
      knowledge_scope: player_derivable
      notes: >
        The backstop for walls designated BEFORE the entrance guard above
        existed (exactly the 2026-09-28 office walls that caused the
        incident this handoff is named for). For one zone (ZONE_ID) or
        every activity zone the game knows (ZONE_ID omitted), classifies
        every ring tile as `built` (shape already a wall), `planned` (a
        Construction building sits here, not yet at its own max build
        stage -- the job has not finished, the tile has not become a wall
        yet) or `open` (neither), then asks the same find_entrances whether
        an entrance would still exist among the OPEN tiles once every
