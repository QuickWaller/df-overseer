df-overseer-blueprint.lua:
  build_order_item: "the Architect's hands; handoffs/2026-09-24-blueprint-hands.md. Research: research/2026-09-24-quickfort-hands.md"
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name.
  arg_defaults: {DRY_RUN: "true"}
  commands:
    "plan TEMPLATE":
      lua_function: plan_template
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24; no Lua could be run, no live call made). Reads only a .csv on the guest, never the map."
      knowledge_scope: player_visible
      notes: >
        What a blueprint declares, from its own .csv (dfhack-config/blueprints/
        templates/TEMPLATE.csv, else dfhack-config/blueprints/TEMPLATE.csv; a
        bare identifier, never a path): its footprint, the room rectangle (the
        bounding box of its zone section, or null), how many cells ask for a
        smooth finish, and every phase (a quickfort section label) with its
        mode, cell count, and for a #meta the sections it applies. Each phase
        says whether it needs a finished dug shell first (any build, zone or
        place section). Read this first: PHASE in preview and apply is one of
        the labels it lists. Generic: any template or blueprint, no per-room
        branches.
      summary: "Reports what a named blueprint template declares: its footprint, room rectangle, and each phase it is built from."
      guide:
        arguments:
          - name: "TEMPLATE"
            required: true
            default: null
            meaning: >-
              The blueprint's bare name, as blueprint.plan takes it: a template id with its revision
              (bedroom-cell-v1) or a starter blueprint name (starter-room-5x5). Letters, digits,
              underscore and hyphen only; never a path and never a coordinate. It must already be
              deployed on the game host, else the error says so.
        returns: >-
          Read this first: the phase names it lists are what blueprint.preview and blueprint.apply
          expect as PHASE. Generic over any template, no per-room special casing.
        before_a_real_run: []
        traps: []
    "preview TEMPLATE PHASE SITE [LEVEL] [RANK] [RADIUS_TILES]":
      lua_function: preview_phase
      effect: read
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24). Read by source only: quickfort -d writes nothing in dig, build or zone modes (research/2026-09-24-quickfort-hands.md section 5); never observed live."
      knowledge_scope: player_derivable
      notes: >
        A dry run of one phase against a site: what quickfort would designate
        (`designated`, `would_designate`, its raw `stats`, any `problems`), the
        soil rule (`finish_plan`, `finish_required_met`, `remedy`), and for a
        build, zone or place phase whether the order guard would refuse it
        (`blocked`). SITE is a landmark name (find a new site near it for a
        phase that starts by digging; LEVEL, RANK and RADIUS_TILES then apply,
        RANK N being the same candidate diggable.find lists at rank N) or a
        site-N handle from a real apply or blueprint.sites (LEVEL, RANK and
        RADIUS_TILES are then an error). No coordinate is ever asked for or
        returned. Read-only: the sole effect is asking quickfort with -d.
      summary: "Dry-runs one phase of a blueprint template against a site, without designating anything."
      guide:
        arguments:
          - name: "TEMPLATE"
            required: true
            default: null
            meaning: >-
              The blueprint's bare name, as blueprint.plan takes it: a template id with its revision
              (bedroom-cell-v1) or a starter blueprint name (starter-room-5x5). Letters, digits,
              underscore and hyphen only; never a path and never a coordinate. It must already be
              deployed on the game host, else the error says so.
          - name: "PHASE"
            required: true
            default: null
            meaning: >-
              One quickfort section label from blueprint.plan's `phases` list (a shell's dig phase,
              a zone phase, a #meta bundle). Apply phases in the order plan shows: a phase that
              needs a dug shell is refused while the shell's dig and smooth designations are still
              outstanding.
          - name: "SITE"
            required: true
            default: null
            meaning: >-
              Where. Either a site handle (site-3, from blueprint.sites or a real blueprint.apply),
              which every phase after the first uses, or, for the first phase of a new room (one
              that starts by digging), the name of an existing landmark to find the site near (see
              landmarks.list); LEVEL, RANK and RADIUS_TILES then apply, RANK N being the same
              candidate diggable.find lists at rank N. Never a raw coordinate; giving LEVEL, RANK or
              RADIUS_TILES with a handle is an error.
          - name: "LEVEL"
            required: false
            default: null
            meaning: >-
              An offset relative to SITE's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "RANK"
            required: false
            default: null
            meaning: >-
              Which ranked candidate to act on: 1 is the candidate closest to SITE.
              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: null
            meaning: >-
              How far from SITE to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
        returns: >-
          Reports what would be designated, any problems, and whether a soil-finish requirement
          would be met. A build, zone or place phase also reports whether phase ordering would block
          it (it needs a finished dug shell first); `plan` says which phases need one.
        before_a_real_run: []
        traps:
          - >-
            A build, zone or place phase also reports whether phase ordering would block it (for
            example a zone phase run before its shell is dug); read that alongside the designation
            result, not just whether tiles were accepted.
    "apply TEMPLATE PHASE SITE [DRY_RUN] [LEVEL] [RANK] [RADIUS_TILES] [ALLOW_STRANDED]":
      lua_function: apply_phase
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24). The real path has never run anywhere."
      knowledge_scope: player_derivable
      notes: >
        Applies one phase of a blueprint to a site through quickfort. DRY_RUN
        defaults to true (same result as preview); only an explicit "false"
        writes. Same SITE rules as preview; DRY_RUN comes before LEVEL, RANK
        and RADIUS_TILES so a real apply against a handle is just `... site-3
        false`. A real run of a dig phase on a new site registers a site-N
        handle (returned as site.handle; its real tile stays in DFHack's own
        per-site persistent state) so every later phase names the site by it.
        A real run returns `read_back`: the count of outstanding dig/smooth
        designations in the site (`designations_landed` is false when quickfort
        said it designated tiles and the game shows none), the finish state of
        every cell the blueprint asks to be smoothed, and the surface layer's
        own enclosure, finish and material reads of the room rectangle
        (`surface`). Those reads describe the site as it stands right after
        the call, before dwarves have worked; run status later. `ok` is true
        only when quickfort ran, designated something, every non-progress
        counter was zero and (for a #meta) every named section was applied.
        Granted to the overseer only (the roster's sole writer); the Architect
        proposes and previews.
        ACCESS GATE (handoffs/2026-09-24-blueprint-access.md): for a new site
        the verb tries the four rotations and picks the first whose entrance
        (a carve cell on the footprint edge) touches revealed walkable ground,
        with every carve cell connected to it; the choice and every candidate
        are returned (`site.orientation`, `site.orientations_tried`,
        `entrance_reachable`, `dig_can_start`). A real dig whose entrance
        cannot be reached in ANY orientation is REFUSED (`blocked`,
        `blocked_reason`, nothing designated, no handle issued), and a preview
        of it returns `ok: false` with `would_strand`. The only way past is
        ALLOW_STRANDED set to the word true; the result then says
        `stranded_override_used: true`. Never the default.
      summary: "Applies one phase of a blueprint template to a site for real."
      execution:
        verdict: {ok: ok, refused_if_true: [blocked], reason: blocked_reason}
        dry_run_echo: dry_run
        issues_handle: site.handle
        preview_fields: [designated, finish_plan, access]
        nothing_applied: {all_zero: [designated.dig_tiles, designated.zones, designated.buildings]}
        override_args: [allow_stranded]
        handle_args: [site]
        phases:
          arg: phase
          site_arg: site
          carry: [template]
          source: {tool: blueprint.plan, args: [template], rows: phases, label_field: label, applies_field: applies}
        progress:
          read: {tool: blueprint.status, args: {site_id: "$handle", phase: "$phase"}}
          done_field: phase.done
          not_done_if: {path: dig.state, equals: in_progress}
          stalled_if: {path: dig.state, equals: stalled}
          blocked_if: {path: finish_state.blocked_total, greater_than: 0}
        landed:
          - when: {arg: site, matches: '^res-[0-9]+$'}
            kind: field_set
            read: {tool: blueprint.reservations, rows: result}
            find: {field: handle, equals: "$site"}
            field: site_handle
          - when: {arg: site, matches: '^site-[0-9]+$'}
            kind: list_gains
            read: {tool: blueprint.sites, rows: result}
            find: {field: handle, equals: "$site"}
            field: phases_applied
            value: "$phase"
            handle: "$site"
      guide:
        arguments:
          - name: "TEMPLATE"
            required: true
            default: null
            meaning: >-
              The blueprint's bare name, as blueprint.plan takes it: a template id with its revision
              (bedroom-cell-v1) or a starter blueprint name (starter-room-5x5). Letters, digits,
              underscore and hyphen only; never a path and never a coordinate. It must already be
              deployed on the game host, else the error says so.
          - name: "PHASE"
            required: true
            default: null
            meaning: >-
              One quickfort section label from blueprint.plan's `phases` list (a shell's dig phase,
              a zone phase, a #meta bundle). Apply phases in the order plan shows: a phase that
              needs a dug shell is refused while the shell's dig and smooth designations are still
              outstanding.
          - name: "SITE"
            required: true
            default: null
            meaning: >-
              Where. Either a site handle (site-3, from blueprint.sites or a real blueprint.apply),
              which every phase after the first uses, or, for the first phase of a new room (one
              that starts by digging), the name of an existing landmark to find the site near (see
              landmarks.list); LEVEL, RANK and RADIUS_TILES then apply, RANK N being the same
              candidate diggable.find lists at rank N. Never a raw coordinate; giving LEVEL, RANK or
              RADIUS_TILES with a handle is an error.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              Optional. true (the default when omitted) asks quickfort what it would do and writes
              nothing; only the word false performs the real apply. Give it before LEVEL, RANK and
              RADIUS_TILES.
          - name: "LEVEL"
            required: false
            default: null
            meaning: >-
              An offset relative to SITE's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "RANK"
            required: false
            default: null
            meaning: >-
              Which ranked candidate to act on: 1 is the candidate closest to SITE.
              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: null
            meaning: >-
              How far from SITE to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "ALLOW_STRANDED"
            required: false
            default: null
            meaning: >-
              Optional, give it last. Almost never. The word true overrides the access gate: a real
              dig whose entrance touches no revealed walkable ground in any orientation is refused
              by default, because DF would never make a dig job for it. Anything but the word true,
              or omitting it, keeps the gate. When used, the result says stranded_override_used.
        returns: >-
          Applying a dig phase at a new landmark site registers a site-N handle that every later
          phase should then reference. A real run reads the result back (outstanding designations,
          finish state, surface reads of the room) rather than trusting the game's own success
          report alone, since quickfort can report success while designating nothing.
        before_a_real_run:
          - >-
            Before a real dig, this tries every rotation of the template looking for one whose
            entrance reaches revealed walkable ground; if none works, the call is refused outright
            and nothing is designated, unless ALLOW_STRANDED is explicitly set to true.
        traps:
          - >-
            A seam wall shared between two tiled templates is allowed to overlap by design, not
            refused as a collision; only a genuine conflict outside a declared seam is refused.
    sites:
      lua_function: list_sites
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24)"
      knowledge_scope: player_visible
      notes: >
        Every site handle a real apply has issued: its blueprint, the phases
        applied so far, footprint size and nearest landmark with direction
        and distance. Never a tile position. Each site also carries
        `ore_exposed` (handoffs/2026-10-05-ore-exposed-signal.md): the ore or
        gem tiles still walled in on the faces ringing its room rectangle,
        read through the same rectangle shim as status; null when the
        blueprint cannot be read, `skipped` when it declares no room. The
        conductor polls this one field to wake the Architect.
      summary: "Lists every site handle a real blueprint.apply has issued, with any ore exposed on its room's walls."
      guide:
        arguments: []
        returns: >-
          Reports each site's template, phases applied so far, footprint size and nearest landmark,
          never a tile position, plus ore_exposed: total_tiles and a list of materials (mineral name,
          ore or gem, tile count) visible on the room's walls, still unmined. Mine it with
          construction.mine-vein-site and the site handle.
        before_a_real_run: []
        traps: []
    "status SITE_ID [PHASE]":
      lua_function: site_status
      effect: read
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24)"
      knowledge_scope: player_derivable
      notes: >
        Is the carved room done, and is it finished? For a site handle: the
        shell (outstanding dig/smooth designations, carve cells still solid),
        the finish state of every cell the blueprint asks to be smoothed
        (`finish_state`, with anything that cannot be smoothed listed by
        material and a `remedy`), and the surface layer's enclosure, finish
        and material reads of the room rectangle. `finish_required_met` is
        true only when nothing is left to smooth and nothing is blocked. The
        surface reads use a rectangle-anchored shim over df-overseer-surface's
        zone-anchored functions (see the .lua header); if the shim cannot be
        applied `surface.error` says so.
        `dig` is the post-apply proof (handoffs/2026-09-24-blueprint-access.md):
        pending dig designations against dig jobs that actually exist in the
        game (a bounded job census), each counted as having a job, blind (no
        revealed walkable neighbour, so DF will never make a job) or
        startable. `dig.state` is one of none_pending, in_progress, stalled,
        unknown, never a bare default; `stalled` (also a top-level boolean,
        with a `stall_remedy`) means no designation has a job and either every
        one is blind or startable ones have sat jobless for 600 ticks since the
        apply. Designations landing is not success: run this after some ticks
        have passed.
      summary: "Checks whether a carved site's dig is finished and its walls are finished smoothing."
      guide:
        arguments:
          - name: "SITE_ID"
            required: true
            default: null
            meaning: >-
              A site handle such as site-3, as blueprint.sites lists it. Never a coordinate.
          - name: "PHASE"
            required: false
            default: null
            meaning: >-
              Optional. A phase label from blueprint.plan. Adds a `phase` block: whether that phase's own
              cells are dug and smoothed, its buildings fully constructed (not merely planned) and its
              zone present; `phase.done` is true only when all of them hold.
        returns: >-
          Reports outstanding designations, the finish state of anything the template asks to be
          smoothed, and whether digging has stalled (no job exists for a startable designation after
          enough time has passed). Designations landing is not the same as the dig being done; run
          this again after some time has passed rather than checking immediately.
        before_a_real_run: []
        traps: []
    "release SITE_ID [DRY_RUN] [ANY_PENDING]":
      lua_function: release_site
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-24). Source-read only: quickfort undo (command.lua:23-27, dig.lua:139-141, 917-921). Never run."
      knowledge_scope: player_derivable
      notes: >
        Withdraws the dig designations of a STALLED site (status reports
        dig.state stalled) by running quickfort's own undo on each dig phase
        applied to it, in the site's own orientation, so it clears exactly the
        tiles the apply set; an existing dig job at a tile is removed too. It
        CANNOT undo a tile already dug, a wall already smoothed, or a zone or
        building: it refuses a site that is not stalled and a site with any
        non-dig phase. DRY_RUN defaults to true. On a real run that leaves no
        designation, the site handle is forgotten. Granted to the overseer
        only.
      summary: "Withdraws the dig designations of a stalled site."
      execution:
        verdict: {real_ok: released, refused_if_present: [refused], reason: refused}
        dry_run_echo: dry_run
        cleanup:
          handle_prefix: "site-"
          report_as: released
          args: {site_id: "$handle", dry_run: "false", any_pending: "true"}
          already_done_if_error_contains: ["no site"]
      guide:
        arguments:
          - name: "SITE_ID"
            required: true
            default: null
            meaning: >-
              A site handle such as site-3, as blueprint.sites lists it. Never a coordinate.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              Optional. true (the default when omitted) asks quickfort what it would undo and
              writes nothing; only the word false actually withdraws the designations.
          - name: "ANY_PENDING"
            required: false
            default: "false"
            meaning: >-
              Optional, give it last. The word true withdraws every outstanding dig and smooth designation
              of the site, not only a stalled one's, and never touches a tile already dug. Planned buildings
              and zones are not withdrawn and come back as skipped_phases. Used by the conductor's abandon
              cleanup.
        returns: >-
          Only works on a site blueprint.status reports as stalled, and only undoes dig phases; it
          cannot undo a tile already dug, a wall already smoothed, or a built zone or building.
        before_a_real_run:
          - >-
            Refuses a site that is not stalled and a site with any non-dig phase already applied.
        traps: []
    "reserve TEMPLATE PURPOSE SITE [DRY_RUN] [LEVEL] [RANK] [RADIUS_TILES]":
      lua_function: reserve_site
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-30, lupa-tested against a fake world only). Never run live."
      knowledge_scope: player_derivable
      notes: >
        handoffs/2026-09-30-room-reservations.md. Holds a specific planned
        room's footprint so no other designating tool can take it: not a
        district or a region (that is the still-owed zoning design session,
        memory/zoning-design-session-owed.md). Resolves TEMPLATE's whole
        footprint the identical way a new dig phase would (same orientation
        search, same access gate as apply/preview), classifies its cells wall
        vs carve, and refuses on any overlap with an existing reservation or
        an already-carved site UNLESS every overlapping tile is marked wall
        on both sides (a shared wall between adjacent tiled rooms, matching a
        template's own declared seam edges) -- any carve/interior overlap is
        refused, naming the conflict. DRY_RUN defaults to true. Never a tile
        position in the result, only a footprint size and nearest landmark.
        Granted to overseer for a real reserve; architect and overseer may
        dry-run.
      summary: "Holds a template's whole footprint so no other designating tool can take it, without digging anything yet."
      # Per-tool execution data (docs/CONDUCTOR-EXECUTION.md 2.3, handoffs/2026-10-06-stage-2c.md).
      # Read by dfmcp/action_data.py; every path below must exist in a real output, which
      # dfmcp/tests/test_action_data.py checks against dfmcp/tests/fixtures/blueprint/.
      execution:
        verdict: {dry_ok: would_reserve, refused_if_true: [refused], reason: blocked_reason}
        dry_run_echo: dry_run
        issues_handle: handle
        append_to_arg: {arg: purpose, text: "$proposal_id"}
        resolution_fields: [near_landmark, direction, distance_tiles, orientation, level]
        preview_fields: [finish_plan, footprint, allowed_kinds]
        nothing_applied: {refusal: true}
        landed:
          - kind: new_row
            read: {tool: blueprint.reservations, rows: result}
            handle_field: handle
            match: {field: purpose, ends_with: "$proposal_id"}
      guide:
        arguments:
          - name: "TEMPLATE"
            required: true
            default: null
            meaning: >-
              The blueprint's bare name, as blueprint.plan takes it: a template id with its revision
              (bedroom-cell-v1) or a starter blueprint name (starter-room-5x5). Letters, digits,
              underscore and hyphen only; never a path and never a coordinate. It must already be
              deployed on the game host, else the error says so.
          - name: "PURPOSE"
            required: true
            default: null
            meaning: >-
              A short free-text note on what this reservation is for (e.g. 'planned bedroom row 3'),
              reported back by reservations. Not validated against any vocabulary, but never a
              coordinate.
          - name: "SITE"
            required: true
            default: null
            meaning: >-
              Where. Either a site handle (site-3, from blueprint.sites or a real blueprint.apply),
              which every phase after the first uses, or, for the first phase of a new room (one
              that starts by digging), the name of an existing landmark to find the site near (see
              landmarks.list); LEVEL, RANK and RADIUS_TILES then apply, RANK N being the same
              candidate diggable.find lists at rank N. Never a raw coordinate; giving LEVEL, RANK or
              RADIUS_TILES with a handle is an error.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              Optional. true (the default when omitted) asks quickfort what it would do and writes
              nothing; only the word false performs the real apply. Give it before LEVEL, RANK and
              RADIUS_TILES.
          - name: "LEVEL"
            required: false
            default: null
            meaning: >-
              An offset relative to SITE's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "RANK"
            required: false
            default: null
            meaning: >-
              Which ranked candidate to act on: 1 is the candidate closest to SITE.
              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: null
            meaning: >-
              How far from SITE to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
        returns: >-
          This is a reservation of one room's footprint, not a district or zoning tool. Never
          reports a tile position, only a footprint size and nearest landmark.
        before_a_real_run:
          - >-
            Refuses on overlap with another reservation or an already-carved site, unless the
            overlap is a shared wall both templates declare as a seam.
          - >-
            A real reserve needs the overseer; architect and overseer may both dry-run.
        traps: []
    reservations:
      lua_function: list_reservations
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: "unverified (offline build, 2026-09-30)"
      knowledge_scope: player_derivable
      notes: >
        Same handoff. Every open reservation: handle, purpose, footprint
        size, nearest landmark, age in ticks, and whether a site-N has been
        carved from it (`in_use`). No automatic expiry -- a stale-looking
        reservation is the overseer's call, not this tool's. Never a
        coordinate.
      summary: "Lists every open footprint reservation."
      guide:
        arguments: []
        returns: >-
          Reports each reservation's handle, purpose, footprint size, nearest landmark, age, and
          whether a site has already been carved from it. There is no automatic expiry; judging a
          reservation stale is a human or overseer call, not something this tool decides on its own.
        before_a_real_run: []
        traps: []
    "unreserve RES_ID [DRY_RUN]":
      lua_function: unreserve_site
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, 2026-09-30). Never run live."
      knowledge_scope: player_derivable
      notes: >
        Same handoff. Releases a reservation outright, whether or not a site
        was ever carved from it -- there is no other way to end one. A shared
        wall tile stays held by any OTHER reservation still covering it
        (`still_held_by`); nothing else is freed or undone. DRY_RUN defaults
        to true. Granted to the overseer only.
      summary: "Releases a footprint reservation outright."
      execution:
        verdict: {dry_ok: would_release, real_ok: released}
        dry_run_echo: dry_run
        cleanup:
          handle_prefix: "res-"
          report_as: unreserved
          args: {res_id: "$handle", dry_run: "false"}
          already_done_if_error_contains: ["no reservation"]
      guide:
        arguments:
          - name: "RES_ID"
            required: true
            default: null
            meaning: >-
              A reservation handle such as res-3, as blueprint.reservations lists it. Never a
              coordinate.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              Optional. true (the default when omitted) only reports what would be released; only
              the word false actually releases it.
        returns: >-
          The only way to end a reservation, whether or not a site was ever carved from it. A shared
          wall tile still held by another reservation is not freed.
        before_a_real_run: []
        traps: []
df-overseer-clock.lua:
  build_order_item: "agent loop MVP items 1-2 (docs/AGENT-LOOP.md); handoffs/2026-09-22-loop-clock-conductor-role.md"
  commands:
    "set-speed FPS":
      lua_function: clock_set_speed
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22 (evals/live/2026-09-22-loop-mvp-deploy/README.md): set to 10 then back to 100, independently confirmed both times via df.global.enabler.fps, pause/tick unchanged throughout"
      knowledge_scope: player_visible
      notes: >
        Writes df.global.enabler.fps directly, mirroring setfps.lua's own
        write (confirmed present at this install's version) plus its
        fps_per_gfps update. Refuses outside [1, 1000], a sanity ceiling
        this stream picked, not a researched engine limit. Returns old and
        new value. Granted only to a role of kind system
        (dfmcp/roles.py's SYSTEM_CLASS_TOOL_IDS exception) -- see the .lua
        file's own header for why this is a narrow exception, not a
        loosening, of "only the sole writer may mutate".
      summary: "Sets the game's target frames-per-second."
      guide:
        arguments:
          - name: "FPS"
            required: true
            default: null
            meaning: >-
              The target frames-per-second cap to set, from 1 to 1000.
        returns: >-
          Returns the old and new value.
        before_a_real_run:
          - >-
            Refuses a value outside 1 to 1000.
        traps: []
    pause:
      lua_function: clock_pause
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22 (evals/live/2026-09-22-loop-mvp-deploy/README.md): called on an already-paused fort, ok:true paused:true. Only the trivial already-paused case is exercised; a real pause-from-running call is not on record"
      knowledge_scope: player_visible
      notes: >
        dfhack.world.SetPauseState(true). Always allowed (pausing is the
        safe direction, docs/AGENT-ARCHITECTURE.md ss6). System-kind only.
      summary: "Pauses the game."
      guide:
        arguments: []
        returns: >-
          Always allowed, since pausing is the safe direction.
        before_a_real_run: []
        traps: []
    resume:
      lua_function: clock_resume
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        dfhack.world.SetPauseState(false), refused with the latch detail
        while a tripwire is latched (call clear first). System-kind only,
        and NOT granted to the Overseer even though it is the roster's
        sole_writer: dfmcp/roles.py's exception is gated on role kind, with
        no sole-writer carve-out, specifically so "never unpause without
        being asked to" is a structural guarantee, not just a charter line.
      summary: "Unpauses the game; names any open panel that will keep it paused."
      guide:
        arguments: []
        returns: >-
          Unpauses the game. When an open panel blocks resume (an Info panel such as Work Orders),
          the result carries `blocking_panel` ({name, focus}) and a `warning`; the game may stay
          paused. It never closes the panel.
        before_a_real_run:
          - >-
            Refused outright while a tripwire is latched (clear it first with clock.clear).
        traps: []
    status:
      lua_function: clock_status
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22/23 (evals/live/2026-09-22-loop-mvp-deploy/, 2026-09-23-office-and-first-real-build/, 2026-09-23-attention-deploy/, 2026-09-23-chair-completion-run/): called repeatedly across four separate live runs, paused/armed/tick fields all read consistently; `advisory` was seen populated live for the first time in the Chair completion run (a slow-tier kea, unchanging across three windows -- the bug this stream fixes). The new `base_fps` field is unverified live as of this stream (offline-only)."
      knowledge_scope: player_derivable
      notes: >
        paused, fps, cur_year/cur_year_tick/abs_tick, whether the tripwire
        watcher is armed (repeat-util.isScheduled), and the latched
        tripwire (reason/tick/detail) if any. player_derivable because the
        latch detail for a hunger/thirst trip carries a status CATEGORY
        derived from the raw timer, never the raw timer itself (see the
        .lua file's header).
        ADDED 2026-09-23 (handoffs/2026-09-23-attention-tiers-ingame.md):
        `advisory` -- the most recent SLOW-tier trip (reason "hostile_slow",
        tick, detail), or nil once cleared. Purely informational; never
        blocks clock_resume, which only ever checks the latch.
        ADDED 2026-09-23 (handoffs/2026-09-23-slow-tier-clearing.md):
        `base_fps` -- the fps a cleared slow-tier advisory restores the
        fort to (what this arm configured, DEFAULT_BASE_FPS 100 if never
        armed on a fresh install). Exposed so "what does the fort go back
        to" is answerable from status alone.
        ADDED 2026-10-08: `blocking_panel` ({name, focus}, or nil) -- the open
        in-game panel that blocks resume, read through df-overseer-screen's
        data table. Lets the conductor name why a resume did not move the tick.
      summary: "Reports the clock's current state: paused or not, current tick, whether the tripwire watcher is armed, and any latched tripwire or slow-tier advisory."
      guide:
        arguments: []
        returns: >-
          `advisory` is the most recent slow-tier (non-pausing) trip, if any; it never blocks
          clock.resume. `base_fps` is the speed a cleared slow-tier advisory restores the fort to.
        before_a_real_run: []
        traps: []
    "arm [HUNGER_CRITICAL THIRST_CRITICAL CHECK_INTERVAL_TICKS THREAT_CHECK_EVERY_N THINK_FPS BASE_FPS]":
      lua_function: clock_arm
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22 (evals/live/2026-09-22-loop-mvp-deploy/README.md): armed with the stated defaults, confirmed via clock.status, then disarmed. The 2026-09-23 tier/announcement additions to this command's own tripwire logic are deployed (evals/live/2026-09-23-attention-deploy/) and the slow tier itself fired live for the first time in the Chair completion run (evals/live/2026-09-23-chair-completion-run/), which exposed the clearing bug this stream fixes. The new BASE_FPS argument and the clearing behaviour it enables are unverified live as of this stream (offline-only, handoffs/2026-09-23-slow-tier-clearing.md) -- a live re-arm and a live clear (both a natural clear on a receding threat and an explicit clock.clear call) are owed."
      knowledge_scope: player_derivable
      notes: >
        Registers the in-game tripwire watcher via repeat-util (the same
        registration mechanism as overseer-autosave/overseer-sampler, per
        onMapLoad.init), an all-or-nothing optional group of numeric args.
        Defaults: hunger/thirst critical 75000/50000, sourced from
        hack/scripts/full-heal.lua's is_in_dire_need(), cross-validated
        against the wiki (research/2026-09-16-food-clock-and-farm-lead-time.md);
        check interval 100 ticks and threat-scan-every 10 checks are this
        stream's own reasoned defaults, not sourced. think_fps defaults to
        10 and BASE_FPS defaults to 100, both sourced from docs/AGENT-LOOP.md
        ss2's own "Three levels" table. Clears any existing latch AND
        advisory (a fresh arm is a clean start), and persists BASE_FPS to
        its own state file so a slow-tier clear (see step 3 below and
        `clear`) always restores to what THIS arm configured, never a
        value read off the fort at the moment of the drop.
        Tripwires, UPDATED 2026-09-23 (handoffs/2026-09-23-attention-tiers-
        ingame.md; DEPLOYED 2026-09-23, evals/live/2026-09-23-attention-deploy/):
        (1) a citizen death since
        the last check (a getCitizens() roster diff, not the omniscient
        UNIT_DEATH event -- see the .lua file's own step-1 comment), (2)
        hunger/thirst past critical, (3) a hostile df-overseer-threat.lua's
        find_threats admits by reachability, now branched on that
        candidate's own TIER (pause latches and stops; slow sets FPS to
        think_fps and writes a non-blocking advisory instead of pausing;
        record_only only feeds df-overseer-ledger.lua) rather than pausing
        on any candidate at all -- UPDATED 2026-09-23
        (handoffs/2026-09-23-slow-tier-clearing.md): the same step now also
        CLEARS a slow-tier advisory, at the same cadence it was set, the
        moment a scan finds nothing at slow tier or worse (no candidates at
        all, or the worst candidate present has downgraded to
        record_only), restoring fps to BASE_FPS -- immediate, no
        hysteresis, docs/AGENT-LOOP.md ss3 has the rule written up, (4) a
        newly-arrived report whose type is one of
        df-overseer-announcement-levels.lua's 25 generated
        PAUSE_REPORT_IDS -- a separate mechanism from (3), bounded to
        reports newer than the last check. On a pause: latches and writes
        {reason, tick, detail} to a state file (see header for why a file,
        not a Lua global). System-kind only.
      summary: "Arms the in-game tripwire watcher: automatic checks for citizen death, hunger/thirst, nearby threats, and specific game announcements."
      guide:
        arguments:
          - name: "HUNGER_CRITICAL"
            required: false
            default: null
            meaning: >-
              Optional. The hunger timer value treated as critical (default from the clock's own
              built-in table).
          - name: "THIRST_CRITICAL"
            required: false
            default: null
            meaning: >-
              Optional. The thirst timer value treated as critical.
          - name: "CHECK_INTERVAL_TICKS"
            required: false
            default: null
            meaning: >-
              Optional. How many ticks between the clock's own checks.
          - name: "THREAT_CHECK_EVERY_N"
            required: false
            default: null
            meaning: >-
              Optional. Run a threat scan every N checks rather than every one.
          - name: "THINK_FPS"
            required: false
            default: null
            meaning: >-
              Optional. The FPS cap to drop to while an agent is thinking.
          - name: "BASE_FPS"
            required: false
            default: null
            meaning: >-
              Optional. The normal FPS cap to return to once the clock disarms.
        returns: >-
          A citizen death or a pause-tier threat/announcement pauses the game and latches a reason;
          a slow-tier threat instead drops the game to think_fps and records a non-blocking
          advisory, clearing itself automatically once the threat passes. Arming clears any existing
          latch or advisory first, as a clean start.
        before_a_real_run: []
        traps: []
    disarm:
      lua_function: clock_disarm
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22 (evals/live/2026-09-22-loop-mvp-deploy/README.md): called after clock.arm, armed flipped true to false, confirmed via clock.status, no game time passed"
      knowledge_scope: player_visible
      notes: >
        Cancels the repeat-util schedule. Does not touch an existing latch
        or advisory (clear is the dedicated op for those). System-kind only.
      summary: "Cancels the tripwire watcher's schedule."
      guide:
        arguments: []
        returns: >-
          Does not touch an existing latch or advisory; use clock.clear for those.
        before_a_real_run: []
        traps: []
    clear:
      lua_function: clock_clear
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        Clears a latched tripwire so resume is no longer refused. UPDATED
        2026-09-23 (handoffs/2026-09-23-slow-tier-clearing.md, judgement
        call 5): also clears a slow-tier advisory if one is latched,
        restoring fps to the BASE_FPS the current arm configured -- clear
        is this project's one "I have seen this, carry on" verb, so it now
        answers for both kinds of latch this file can set, not just the
        pause one. Returns {ok, had_latch, had_advisory} so a caller can
        tell what was actually cleared. Does not itself resume the fort.
        System-kind only.
      summary: "Clears a latched tripwire or slow-tier advisory so the fort may be resumed or returns to full speed."
      guide:
        arguments: []
        returns: >-
          Reports what was actually cleared. Does not itself resume the fort; call clock.resume
          separately.
        before_a_real_run: []
        traps: []
df-overseer-fort.lua:
  build_order_item: "agent loop MVP item 2 (docs/AGENT-LOOP.md); handoffs/2026-09-22-loop-clock-conductor-role.md"
  commands:
    "quicksave [PRIOR_SAVE_DIR]":
      lua_function: fort_quicksave
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-22/23: fired and confirmed via cur_savegame.save_dir in every one of the 2026-09-22/23 deploy and run evals (rotating through autosave 1/2/3 as expected). One live miss on record too, correctly flagged rather than hidden: the 2026-09-22-loop-game-text-encoding run's own slot-prediction heuristic named the wrong slot once (predicted autosave 1, landed autosave 2), worked around by using cur_savegame.save_dir directly rather than trusting the prediction; that heuristic bug is unfixed and not this file's own read path"
      knowledge_scope: player_visible
      notes: >
        No args: fires quicksave and returns
        df.global.world.cur_savegame.save_dir ("autosave 1"/2/3) as it stood
        immediately before firing -- REWRITTEN TWICE 2026-09-22
        (handoffs/2026-09-22-loop-diff-reregister-quicksave-slot.md), live,
        deploying to VM 103. First: dropped the original oldest-mtime
        PREDICTION (wrong on a real fort -- predicted "autosave 1", landed in
        "autosave 2", evals/live/2026-09-22-loop-game-text-encoding/README.md)
        for a per-slot dfhack.filesystem.mtime read. Second, found live
        deploying that: dfhack.filesystem.mtime is ITSELF broken on this
        install (its doc promises real epoch seconds; live-verified against
        `stat`, it returns huge nonsensical negative numbers for every real
        file), and io.popen/os.execute are sandboxed out of this DFHack Lua
        environment (no shell-out fallback available). Final fix: drop file
        mtimes entirely, use "DF's own record of the save"
        (cur_savegame.save_dir) instead -- live-verified this stream to
        change to the real just-written slot after a real quicksave.
        Deliberately does NOT block waiting for the save to land: the .lua
        file's own header argues from two already-established project facts
        (quicksave.lua's render-gated asynchrony, up to ~90s observed,
        research/2026-09-11-quicksave-silent-noop.md; and a script call
        holding DFHack's suspend lock for its own duration,
        docs/AGENT-ARCHITECTURE.md ss6) that blocking inline risks a
        self-deadlock, not just a slow poll. A deliberate deviation from
        the handoff's literal "confirmed by the slot's mtime changing"
        phrasing -- flagged in this stream's report. One arg given (the
        prior_save_dir the issue call returned): does not re-fire quicksave,
        just reports whether cur_savegame.save_dir now differs -- the slot
        DF itself just wrote, never a guess -- meant to be called again
        later, spaced out, not in a tight loop.
        System-kind only.
      summary: "Fires a quicksave and reports which save slot the game is using."
      guide:
        arguments:
          - name: "PRIOR_SAVE_DIR"
            required: false
            default: null
            meaning: >-
              Optional. A prior save directory name to compare against, to confirm a new save was
              actually written.
        returns: >-
          With no argument, fires a save and returns the slot name as it stood immediately before
          firing. Does not wait for the save to actually land; a real save can take up to roughly a
          minute, and blocking here risks a self-deadlock. With PRIOR_SAVE_DIR given, does not fire
          another save, only reports whether the game's own save-slot record has changed since; call
          this again later, spaced out, rather than in a tight loop.
        before_a_real_run: []
        traps: []
