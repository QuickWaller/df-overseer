          reassign the zone again on its own next cycle.
        before_a_real_run:
          - >-
            Refuses on the same cases as zone.assign-owner where they apply to a bare zone id (a
            kind that cannot have an owner), plus a zone that has no owner to clear.
        traps: []
    "contents ZONE_ID":
      lua_function: zone_contents
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-24 (handoffs/2026-09-24-room-proxy-fix.md). Which
        buildings sit inside one zone: per building its kind (the game's
        building_type name), id, `exists` (flags.exists), `build_stage` of
        `build_stage_max`, `holds_items` (any contained item), `tiles_inside`,
        and `matches_zone_kind` (the kind is one of the zone kind's
        ZONE_POLICY `furniture_kinds`: Chair for Office, Bed for Bedroom,
        Table for DiningHall, Coffin for Tomb; no per-kind branch, the kind is
        read from the zone's own civzone_type). Also matching_count and
        complete_matching_count. It exists because getRoomDescription
        returned empty on a working office, so nothing else could say whether
        the zone holds its defining furniture; nobles.requirements calls the
        same helper (zone_furniture_report) for its independent evidence.
        TILE TEST, reused: the zone's rectangular footprint (the set
        df-overseer-surface.lua walks) and dfhack.buildings.findAtTile (the
        lookup zone_tile uses). It cannot see a non-rectangular zone extents
        bitmap (the rectangle over-reads it) or anything findAtTile does not
        return (civzones). Bounded: a zone over 625 tiles is refused. Output
        carries ids and dimensions, never a coordinate. Failed reads are
        NULL fields plus read_failures. Read only. Offline build, not
        deployed.
      summary: "Lists the buildings sitting inside one zone's footprint, and whether any of them is the furniture that defines the zone's kind."
      guide:
        arguments:
          - name: "ZONE_ID"
            required: true
            default: null
            meaning: >-
              An existing zone's own id, as zone.list gives it in its id field (used by zone.assign-
              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
              resolved to its real footprint server-side. An id that is not an activity zone (a
              workshop id, for example) is a named error, not a guess.
        returns: >-
          For each building inside: its kind, id, whether construction is finished, and whether it
          matches the zone's own furniture requirement (a Chair for an Office, a Bed for a Bedroom,
          and so on). Useful when the game's own room-value read comes back empty even though the
          room is genuinely furnished.
        before_a_real_run:
          - >-
            Bounded to a zone of 900 footprint tiles or fewer; refuses a larger one.
        traps: []
df-overseer-trees.lua:
  build_order_item: "gap named 2026-09-17, handoffs/2026-09-17-water-and-industry-tools.md item 2"
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name.
  arg_defaults: {LEVEL: "0", RANK: "1", RADIUS_TILES: "30", DRY_RUN: "true"}
  commands:
    "find [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_trees
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-17 (live, via a /tmp shadow load, fresh module name). Deployed to VM 103 2026-09-17 (handoffs/2026-09-17-water-industry-tools-deploy.md, hash-verified) and run there: 154 reachable trees near the embark site"
      knowledge_scope: player_derivable
      notes: >
        Revealed TREE-material tiles only (do_chop, the quickfort action
        this tool's own fell command mirrors, refuses a hidden tile
        outright with no blind-designate case -- unlike mining, so no
        act/sense asymmetry applies here). Returns fixed 10-tile distance
        bands (count/reachable_count per band), not a per-tree list --
        ~1,593 visible trees exist on this map, and a per-tree entry would
        both be unwieldy and (per design commitment #1) have nowhere
        coordinate-free to put a "which tree" identity anyway.
        `reachable` is a single tile's own 4-orthogonal-neighbour
        walkability check (mining-a-wall style, not landmark-group-scoped
        the way df-overseer-diggable.lua's ring check is, since a lone
        tree far from the fort can still be validly reachable via a
        different part of the walkable network). LIVE-VERIFIED near
        "Embark Site", radius 30: 154 trees found (12/34/108 across the
        three 10-tile bands), all 154 reachable, CUTWOOD labor held by 1
        citizen, 2 fort-owned axe-family weapons (this install's itemdefs
        contain only ITEM_WEAPON_AXE_BATTLE/_GREAT/_TRAINING, no plain
        "AXE" -- reported as an "any id containing AXE" count, not a
        single canonical subtype, flagged rather than assumed).
      summary: "Finds trees near a landmark and reports how many are reachable."
      guide:
        arguments:
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
              The name of an existing landmark to search or act near (see landmarks.list /
              landmarks.get for real names). Never a raw coordinate.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
        returns: >-
          Returns counts grouped into 10-tile distance bands, not a per-tree list, since a map can
          hold thousands of trees. Only revealed trees are counted; a hidden tile is never offered
          (unlike digging, there is no blind-chop case).
        before_a_real_run: []
        traps: []
    "fell N [LEVEL] NEAR_LANDMARK [RADIUS_TILES] [DRY_RUN]":
