      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12"
      notes: >
        FIXED 2026-09-12: used to print raw `pos=x,y,z` for every
        citizen/threat row -- a documented placeholder from before the
        landmark system was merged to main. Now resolves near_landmark/
        direction/distance_tiles via nearest_landmark, same as every other
        perception tool. Deployed and re-verified live same day against
        Uniboslan's real 15 citizens: every row shows near_landmark, zero
        raw pos= anywhere. Separately, unaffected by this fix: the
        `hostile` filter (dfhack.units.isDanger/isInvader) is proven
