df-overseer-diff.lua:
  build_order_item: 5
  commands:
    "since CURSOR":
      lua_function: drain_since
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12 (REPORT only)"
      knowledge_scope: player_visible
      notes: >
        JOB_COMPLETED/UNIT_DEATH: registration confirmed not erroring, and
        the listener hand-called directly -- NOT a real trigger firing
        (honest gap, carried forward from this file's original version).
        REPORT: real eventful delivery genuinely confirmed live 2026-09-12
        (registered listener fired for real newly-created reports while
        unpaused, matched against world.status.reports' own new entries).
        UNIT_ATTACK: registration/persistence mechanism confirmed via the
        same proven _G-survival technique, but no real attack occurred
        during a live test window -- verified only by mechanism, not by a
        real trigger. decisions/DECISIONS.md 2026-09-12 ("Folded
        df-overseer-combat.lua..."). KNOWLEDGE-SCOPE FIX 2026-09-16: UNIT_DEATH
        (was omniscient) and UNIT_ATTACK (was leaning omniscient) are now
        gated on dfhack.units.isHidden of the unit(s) involved -- see the
        .lua file's own header. Not live-fired against a real death/attack
        this session (fort stays paused); verified by source reading only.
        UPDATED 2026-09-23 (handoffs/2026-09-23-attention-tiers-ingame.md
        item 3, offline, not deployed): REPORT_CATEGORY gained "theft"
        (CREATURE_STEALS_OBJECT), "mischief" (MISCHIEF_LEVER/PLATE/CAGE/
        CHAIN), "snatched" (CITIZEN_SNATCHED) and "crime_witness"
        (CRIME_WITNESS_*) -- theft was previously invisible to this tool
        entirely. A "theft" REPORT also writes a "theft" outcome into
        df-overseer-ledger.lua, race "unknown" (report text carries no
        structured race field; see the .lua file's own comment).
        ALSO ADDED 2026-09-23, reconciling with the already-merged sibling
        conductor stream: a newly-arrived report whose type is one of
        df-overseer-announcement-levels.lua's SLOW_REPORT_IDS now logs a
        SEPARATE {"type": "announcement_slow", "announcement_type", "tick",
        "wake", "detail"} event into this same diff.since stream -- the
        exact shape conductor/cycle.py's _classify_slow_announcements
        already assumed and coded against. Never gated on REPORT_CATEGORY
        (a slow id may carry no REPORT_CATEGORY tag at all); never pauses
        or changes FPS -- purely a log entry, same as every other event
        type here.
        REGISTRATION_VERSION bumped so the live re-registration guard
        replaces the pre-2026-09-23 listener closure on next load.
      summary: "Drains fort events (completed jobs, deaths, attacks, game announcements) that happened after a given cursor."
      guide:
        arguments:
          - name: "CURSOR"
            required: true
            default: null
            meaning: >-
              An opaque position returned by a previous call. Pass 0 to start from the beginning of
              what is retained.
        returns: >-
          Event types: JOB_COMPLETED, UNIT_DEATH, UNIT_ATTACK (both limited to units a player could
          see), REPORT (a game announcement, which may carry a REPORT_CATEGORY such as theft,
          mischief, snatched or crime_witness), and announcement_slow (a slow-tier announcement the
          conductor's clock also watches for). Call repeatedly, always advancing the cursor from the
          previous response, rather than re-reading from 0 each time.
        before_a_real_run: []
        traps: []
    "recent-combat [N]":
      lua_function: recent_combat
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12"
      knowledge_scope: player_visible
      notes: >
        FIXED 2026-09-12 (found building this manifest's coordinate-bearing
        audit): report_line() used to print a raw `pos=%d,%d,%d` for every
        combat/threat report. Now resolves near_landmark/direction/
        distance_tiles via nearest_landmark, same as every other perception
        tool. Deployed and re-verified live against Uniboslan same day: 5
        real reports (the kea fight, 99 total in memory), every row shows
        near_landmark with zero raw pos= anywhere.
      summary: "Lists the N most recent combat and threat reports."
      guide:
        arguments:
          - name: "N"
            required: false
            default: null
            meaning: >-
              Optional. How many of the most recent combat and threat reports to return.
        returns: >-
          Every report is resolved to a nearby landmark, never a raw coordinate.
        before_a_real_run: []
        traps: []
    "since-report REPORT_ID":
      lua_function: since_report
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12"
      knowledge_scope: player_visible
      notes: "Same fix and function (report_line) as recent-combat above. Deployed and re-verified live same day: cursor=99, 85 reports, all clean."
      summary: "Lists every game report newer than a given report id."
      guide:
        arguments:
          - name: "REPORT_ID"
            required: true
            default: null
            meaning: >-
              Only reports newer than this report id are returned.
        returns: >-
          Use diff.since for the full mixed event stream (jobs, deaths, attacks and reports
          together); use this when only reports are wanted.
        before_a_real_run: []
        traps: []
df-overseer-openarea.lua:
  build_order_item: 6
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name.
  arg_defaults: {LEVEL: "0", RANK: "1", RADIUS_TILES: "30", DRY_RUN: "true"}
  commands:
    "find W H [LEVEL] NEAR_LANDMARK [RADIUS_TILES] [RES_ID]":
      lua_function: find_open_area
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-11"
      knowledge_scope: player_derivable
      notes: >
        Ranked candidates correctly judged by the first autonomous-play
        experiment. decisions/DECISIONS.md 2026-09-11. KNOWLEDGE-SCOPE FIX
        2026-09-16: is_free now also requires dfhack.maps.isTileVisible --
        see the .lua file's own header. Measured live: no change to this
        fort's current results. STALE 2026-09-16 (handoffs/2026-09-16-
        farm-and-still-tools.md Part 3): `is_free` made global (exported
        via reqscript) so df-overseer-workshop.lua can reuse it -- pure
        naming change, no behavior change, but VM 103 is still running the
        pre-export file. Not deployed this stream (no deploy).
        CORRECTION 2026-09-22: not stale. A hash sweep of every deployed
        df-overseer-*.lua against the committed bytes (read-only, VM 103) found
        this file identical to main apart from one trailing blank line, the
        known 2026-09-17 artifact, so the export change is deployed.
      summary: "Finds open, usable floor space of a given size near a landmark."
      guide:
        arguments:
          - name: "W"
            required: true
            default: null
            meaning: >-
              Width, in tiles, of the region to search or build.
          - name: "H"
            required: true
            default: null
            meaning: >-
              Height, in tiles, of the region to search or build.
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
              The name of an existing landmark to search or act near (see landmarks.list /
              landmarks.get for real names). Never a raw coordinate.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "RES_ID"
            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
        returns: >-
          Returns several ranked candidates, closest first; only tiles that are revealed and visible
          are offered. Pair with openarea.build to actually designate one.
        before_a_real_run: []
        traps: []
    "build W H [LEVEL] NEAR_LANDMARK BLUEPRINT_FILE [RANK] [RADIUS_TILES] [RES_ID] [OVERRIDE]":
      lua_function: build_open_area
