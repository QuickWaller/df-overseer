              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
