        live-verified 2026-09-23 through the tool itself, over a real MCP
        client (see `verified` above); the fourth order (id 3,
        ConstructThrone, created 2026-09-23) read `validated: false`
        throughout a 900-tick run and did not change state
        (evals/live/2026-09-23-office-and-first-real-build/).
        UPDATE 2026-10-07 (handoffs/2026-10-07-valid-manager-orders.md): rows
        also carry `material` and `invalid_material`/`invalid_material_reason`,
        from the tool's ORDER_MATERIAL_POLICY table (DFHack's own order
        library reduced to one policy per job). Offline-tested only.
        UPDATE 2026-10-01 (handoffs/2026-10-01-orders-conditions.md): row
        building now goes through describe_order, the same helper
        orders.create's post-write readback uses, adding workshop_id,
        material_category (live bitfield flag names, reflected rather than
        hardcoded), item_conditions and order_conditions to every row.
        Purely additive (no existing field removed or renamed) but these
        four new fields are OFFLINE, not yet live-verified: this fort's
        three known orders have no conditions/material_category/workshop_id
        set, so a live rerun would only confirm they come back
        empty/absent, not that a real condition round-trips correctly.
      summary: "Lists the fort's manager work orders."
      guide:
        arguments: []
        returns: >-
          Reports whether a Manager is currently appointed alongside the order list, since an order
          with no Manager will never be worked. Each order reports whether it has been validated by
          the game, whether it is active, and its frequency, material category, workshop pin and
          item/order conditions when set. Each order also reports its material when set, and
          `invalid_material` (true with `invalid_material_reason`) when an item job has no material
          or material category: the game shows such an order as "Make unknown material" and never
          works it, so cancel and recreate it with a material.
        before_a_real_run: []
        traps: []
    ? "create JOB AMOUNT [FREQUENCY] [MATERIAL] [MATERIAL_CATEGORY] [WORKSHOP_ID] [MAX_WORKSHOPS] [ITEM_CONDITIONS] [ORDER_CONDITIONS] [DRY_RUN]"
    : lua_function: create_order
      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        GENERALISED 2026-10-01 (handoffs/2026-10-01-orders-conditions.md),
        replacing the prior twelve-entry JOB_INFO table (blocks/mechanisms/
        barrels/brew_drink/bucket/bed/door/table/chair/splint/crutch/soap),
        already flagged as a generalisability violation
        (research/2026-09-30-policy-audit.md §1 row 2). BREAKING CHANGE:
        JOB is no longer a short alias -- it is resolved generically, first
        as a live `df.job_type` name (e.g. ConstructBlocks, MakeBucket), then
        as a reaction code from world.raws.reactions.reactions (e.g.
        BREW_DRINK_FROM_PLANT, MAKE_SOAP_FROM_TALLOW), matching
        create_orders' own `it["reaction"]` handling
        (research/2026-10-01-quartermaster-levers.md §1, wo.lua:205-210).
        A caller that used to pass "blocks"/"brew_drink" must now pass
        "ConstructBlocks"/"BREW_DRINK_FROM_PLANT". The old `workshop_exists`
        informational count is REMOVED: it depended entirely on the same
        hardcoded per-job table this stream removes, and df.job_type carries
        no live-queryable workshop-subtype attribute to generalise it from
        (checked against df.job.xml's own job_type enum-attr list at the
        pinned tag). New optional arguments, all validated live and refused
        by name when malformed (on the dry-run path too, not only on a real
        write): FREQUENCY (a `df.workquota_frequency_type` name), MATERIAL
        (anything dfhack.matinfo.find accepts), MATERIAL_CATEGORY (a
        comma-separated class filter, e.g. "stone,wood" -- validated
        against a throwaway df.manager_order's own live bitfield keys, since
        job_material_category's flag names are not shipped as DFHack source
        at the pinned tag, only referenced), WORKSHOP_ID/MAX_WORKSHOPS
        (order pin/cap), ITEM_CONDITIONS ("COND:VALUE[:ITEM_TYPE[:MATERIAL]]"
        entries separated by ";"), ORDER_CONDITIONS ("ORDER_ID:STATE"
        entries separated by ";", STATE being Activated or Completed --
        ORDER_ID must already exist in the live queue, since this tool
        creates one order per call, not workorder.lua's own batch). See the
        .lua file's own header for the exact syntax and every source
        citation. Still wraps workorder.lua's own create_orders/
        preprocess_orders/fillin_defaults, reproducing its CLI
        default_action's own exact call sequence rather than hand-building
        a df.manager_order struct. MANAGER PREREQUISITE unchanged from the
        prior build (see the .lua file's own header) -- create_orders itself
        has no code-level Manager check; whether DF's own engine then
        dispatches a validated order with none appointed is a live-engine
        question the register (2026-09-30/2026-10-01) reports as now
        working on the live fort, not something this offline stream
        re-confirmed. Reports `manager_appointed` on every call. On a real
        (non-dry-run) write, the result's `order` field is read back live
        from `world.manager_orders.all` (task 4: never an echo of the
        request) via the same `describe_order` helper `orders.list` now
        uses, identified by the manager_order_next_id counter read just
        before the create call (exact under this project's existing
        single-caller, paused-fort assumption). Offline build and
        structural review only this stream (no live access, per the
        handoff); the live test this needs is in this handoff's own Result
        section.
      summary: "Creates a new manager work order for a job or reaction."
      guide:
        arguments:
          - name: "JOB"
            required: true
            default: null
            meaning: >-
              The manager job type or reaction code to order, as orders.list-jobs or the game's own
              raws name it.
          - name: "AMOUNT"
            required: true
            default: null
            meaning: >-
              How many of the job to order.
          - name: "FREQUENCY"
            required: false
            default: ""
            meaning: >-
              Optional. The order's repeat frequency (for example OneTime, Daily, Weekly), as the
              manager's own order screen offers.
          - name: "MATERIAL"
            required: false
            default: ""
            meaning: >-
              Optional for most item jobs, required for a few. The order's material (INORGANIC for
              any stone, INORGANIC:IRON for one). Left out, the tool fills in the default DFHack's
              own order library uses for that job (stone for blocks, mechanisms and furniture); for
              a job with no honest default (weapons, armour, tools, windows, cloth) the call is
              refused until a material or material category is given. An order with no material is
              shown by the game as "Make unknown material" and is never worked.
          - name: "MATERIAL_CATEGORY"
            required: false
            default: ""
            meaning: >-
              Optional. A material category (for example wood or leather) instead of one exact
              material. Left out on a job with a category default (beds, bins, barrels, buckets
              are wood), the tool fills it in.
          - name: "WORKSHOP_ID"
            required: false
            default: ""
            meaning: >-
              Optional. Restricts the order to one named workshop rather than any workshop that can
              do the job.
          - name: "MAX_WORKSHOPS"
            required: false
            default: ""
