df-overseer-diggable.lua:
  build_order_item: "gap found 2026-09-11, not in the original 0-9 order"
  commands:
    "find W H [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_diggable_area
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-11"
      knowledge_scope: player_derivable
      notes: >
        Correct negative near the surface embark (TREE-material walls
        excluded) and a correct positive underground (5 ranked SOIL
        candidates). decisions/DECISIONS.md 2026-09-11. KNOWLEDGE-SCOPE FIX
        2026-09-16: was OMNISCIENT before this fix -- no revealed/hidden
        check at all, and `material` could name an undiscovered vein. Fixed
        by requiring dfhack.maps.isTileVisible on every tile is_diggable
        checks (so the whole candidate interior, not just the ring). That
        over-corrected: zeroed every candidate near this fort's small
        revealed footprint. ACT/SENSE FIX 2026-09-16
        (handoffs/2026-09-16-farm-and-still-tools.md): a hidden tile is now
        admitted unconditionally (no material/shape/walkable read used to
        decide it), matching DFHack's own quickfort dig.lua, which designates
        blind exactly this way; a revealed tile keeps the original checks.
        `material` stays nil/omitted for a hidden top-left tile; a new
        `interior_fully_revealed` flag is an aggregate, not a per-tile leak.
        Measured live on Uniboslan: `find 5 5 LEVEL "Embark Site"` returned
        `[]` at LEVEL 0/-1/-2/-3 with the over-corrected code; after this
        fix, LEVEL -1 (z168, one level below the surface) returns 5 ranked
        candidates, LEVEL 0/-2/-3 still `[]`. See the .lua file's own header
        for the full before/after and the grass-tile-stair investigation
        (source-read, not live-designated; unresolved against the recorded
        trap, documented rather than guessed at).
    "dig W H [LEVEL] NEAR_LANDMARK BLUEPRINT_FILE [RANK] [RADIUS_TILES]":
      lua_function: dig_diggable_area
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-11"
      knowledge_scope: player_derivable
      notes: >
        Second fully closed coordinate-free decision-to-mutation loop. Had
        the identical top-left-vs-center quickfort bug as build_open_area,
        found here first (an unreachable real dig, zero walkable neighbors,
        no dwarf ever claimed it) -- fixed in both files. Re-tested after the
        fix: all 41 designated tiles fully dug. decisions/DECISIONS.md
        2026-09-11. Shares ranked_candidates/is_diggable with find above, so
        the same 2026-09-16 knowledge-scope fix (was omniscient) and its
        follow-up act/sense fix (same day) both apply here too. Not
        re-exercised live this session (mutation forbidden); the shared
        `is_diggable`/`ranked_candidates` code path is what find above
        verified.
    "find-stair [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_stair_down
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-17; occupancy fix verified 2026-09-17. Deployed to VM 103 2026-09-18 by the well-unblock stream's ui-install and run live there for real use: rank 1 was an unoccupied candidate, confirming the occupancy fix (handoffs/2026-09-18-well-unblock.md, section 2)"
      knowledge_scope: player_derivable
      notes: >
        Added handoffs/2026-09-17-dig-down-to-stone.md, the "vertical,
        stair-down candidate kind" the handoff asked for: `find` above can
        never return a candidate at a level with no walkable tile yet
        (v1's own borders_walkable_network scope limit), which is exactly
        Uniboslan's z167 (stone) under z168 (walkable farm room). Returns
        single-tile candidates -- a WALKABLE column on the network whose
        directly-below tile is diggable -- not WxH rectangles. Reuses
        is_diggable unchanged, so the same 2026-09-16 knowledge-scope/
        act-sense fixes apply. Reports `upper_tile_material` (informational,
        the grass-tile question is left unresolved, see the .lua file's own
        header) and `lower_tile_material`/`lower_tile_hidden`. Measured live
        on Uniboslan (paused, read-only): see this handoff's own report for
        the exact command and candidate count.

        OCCUPANCY FIX, handoffs/2026-09-17-dig-stair-fix.md (root cause and
        recommendation in research/2026-09-17-stairs.md, "dig-mode-occupied-
        tile-silently-skipped" and the Recommendation section): the live
        test (handoffs/2026-09-17-farm-stair-live-test.md) found rank 1 sat
        exactly on this fort's own Stockpile, a tile `#dig` mode silently
        skips while still reporting success. `ranked_stair_candidates` now
        rejects any candidate whose upper (and, defensively, lower) tile
        carries a building (`occupancy.building ~= 0`) before ranking, so a
        caller never sees a candidate that would silently fail for real.
        Each result now reports `tiles_unoccupied: true` (selection
        requires it, same convention as `borders_walkable_network`).
        Re-verified live 2026-09-17 from a uniquely named script-path copy
        (docs/TRAPS.md's addScriptPath method, fort left paused throughout):
        the old deployed script's rank 1 was still the occupied tile
        (distance_tiles:0, direction:S, matching the live test exactly);
        the fixed copy's rank 1 became a different, unoccupied tile
        (distance_tiles:1, direction:NW) with the occupied tile absent from
        all 5 results. A direct read confirmed why: `occupancy.building == 2`
        at the old rank-1 tile.
    "dig-stair [LEVEL] NEAR_LANDMARK [RANK] [RADIUS_TILES] [DRY_RUN]":
      lua_function: dig_stair_down
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-17 (dry-run path, including the occupancy fix, live-verified; the real dry_run=false path -- both the honest-success and the rollback-on-partial-failure branches -- is UNTESTED live, real mutation forbidden every session so far). CORRECTION 2026-09-22: the real dry_run=false path was run for real on 2026-09-18 and designated both halves, each read back from the tile's own dig flag (handoffs/2026-09-18-well-unblock.md, section 2 step 3), so only the rollback-on-partial-failure branch is still untested. The stair was not watched to completion in that session (see the report there)"
      knowledge_scope: player_derivable
      notes: >
        Added handoffs/2026-09-17-dig-down-to-stone.md. Designates BOTH
        halves of one stair pair in a single call -- a downstair at the
        candidate's own walkable level and the matching upstair directly
        beneath it, reusing this fort's own already-working
        starter-entrance-1x1.csv/starter-connector-1x1.csv blueprints
        rather than a caller-supplied BLUEPRINT_FILE (a stair connector is
        always exactly this one pair). DRY_RUN defaults to true, matching
        the farm/workshop/zone/trees/well precedent -- a dry run resolves
        and ranks the same candidate the real path would and returns
        exactly what it would designate, without calling quickfort.

        HONESTY FIX, handoffs/2026-09-17-dig-stair-fix.md (root cause and
        Recommendation in research/2026-09-17-stairs.md): the live test
        found `dig-stair` reported `downstair_ok:true` with the upper tile
        actually left undesignated (the Stockpile-occupancy skip above),
        leaving an orphan upstair on z167 with no matching downstair --
        "never designates one half without the other" was false in
        practice, quickfort's own CR_OK says nothing about whether a tile
        actually got designated. Now: candidates whose upper tile is
        occupied are ranked out entirely (see find-stair above); the real
        path designates the upper half first and judges it by reading the
        tile's own `dig` designation flag back directly (the one thing a
        quickfort-side accounting bug can't fool), not by `*_ok`/CR_OK
        alone; the lower half is only ever attempted once the upper half is
        confirmed real; and if the lower half then fails, the upper half is
        rolled back via `quickfort undo` (read back and confirmed, not just
        assumed to have worked) rather than left standing alone. Any
        failure now returns `nil, message` (the same convention every other
        tool in this file uses on failure) instead of an ok-looking result
        with a buried `*_ok:false` -- dfmcp/server.py's exact-shape
        `{"error": ...}` rule surfaces it to the caller as `isError`.
        Live-verified 2026-09-17: the dry-run path (including the new
        `tiles_unoccupied` field and the new rank-1 candidate) from a
        uniquely named script-path copy, fort left paused throughout
        (year 30, tick 227160, unchanged before and after); the orphan
        z167 upstair designation was read, not touched. The real
        (dry_run=false) path -- both the honest-success shape and the
        undo-on-partial-failure branch -- remains UNTESTED live; see this
        handoff's Report for the exact test plan a real designation would
        still need to run.

