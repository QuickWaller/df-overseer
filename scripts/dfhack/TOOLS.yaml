        unreachable check) was exercised live against Uniboslan via a
        throwaway /tmp script over dfhack-run lua, matching every ad hoc probe
        this stream ran independently -- but the FILE itself has never been
        placed on VM 103 or invoked as `df-overseer-stocks food-drink`, per
        this stream's no-deploy constraint. Treat as verified-by-mechanism,
        not verified-by-the-actual-shipped-command, until the next deploy pass
        re-confirms it as this file, not a copy of its logic.

        SECOND FIX, same day: the first version of this tool counted item
        ENTITIES, not stack units -- "5 raw edible items" on Uniboslan was
        really 24 units of food (the user reading the screen caught it:
        "~20 food and 5 meat" visible; a fisherdwarf's or hunter's catch
        commonly stacks 4-5 units per item entity). Each bucket now returns
        `units` (the `item.stack_size` sum -- the PRIMARY field, what "how
        much food" means) alongside `item_count` (the distinct-entity
        count, still real and useful for hauling/container reasoning, never
        silently dropped), plus `foreign_units`/`foreign_item_count` on the
        caravan's side and unit-summed `rotten_units`/`unreachable_units`.
        Re-verified live via the same throwaway-script method: drink
        units=0/foreign_units=50, raw_edibles units=24/foreign_units=245,
        matching the user's on-screen count exactly.
