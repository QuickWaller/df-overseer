        exposed vector, per research/2026-09-12-dfhack-capability-checks.md
        §4). Reports `manager_appointed` (see the neighboring `create`
        entry) alongside the order list so a caller can see the
        precondition rather than assume it. LIVE-VERIFIED: 0 orders
        queued, manager_appointed false, on this fort today.
        UPDATE 2026-09-23: each order now also reports `validated`, `active`
        (from `order.status`), `finished_year`, `finished_year_tick`,
        `frequency`/`frequency_raw` and `max_workshops`. Live-read on this
        fort's three stuck orders found `validated=true, active=false`,
        `finished_year=finished_year_tick=-1` -- SUPERSEDED 2026-10-08: not
        "a missing announcement"; the causes were a bad appointment, orders
        with no material, and a manager with no office of their own
        (evals/live/2026-10-08-manager-appointment/README.md). `frequency`'s enum type name is
