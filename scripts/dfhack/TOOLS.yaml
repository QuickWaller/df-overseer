        tree far from the fort can still be validly reachable via a
        different part of the walkable network). LIVE-VERIFIED near
        "Embark Site", radius 30: 154 trees found (12/34/108 across the
        three 10-tile bands), all 154 reachable, CUTWOOD labor held by 1
        citizen, 2 fort-owned axe-family weapons (this install's itemdefs
        contain only ITEM_WEAPON_AXE_BATTLE/_GREAT/_TRAINING, no plain
        "AXE" -- reported as an "any id containing AXE" count, not a
        single canonical subtype, flagged rather than assumed).
