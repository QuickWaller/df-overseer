        farm.list) directly. Name-based lookup was removed 2026-09-17:
        setName does not exist on this install and getName's type-default
        fallback ("Farm Plot") is not unique across plots. Refuses a plot
        whose flags.exists is false (construction not finished) before
        touching plant_id, since a pre-construction write was lost live.
        Refuses anything not building_type.FarmPlot, then validates season and
