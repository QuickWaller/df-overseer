        on the fort's own unclaimed embark barrels/seeds/wood, which would have
        zeroed out the fort's own supply if used naively. flags.trader was
        confirmed, live, to be a strict subset of flags.foreign (0 of 1344
        in-play items were trader-without-foreign) and to track a real
        merchant's current holding (checked via each item's own UNIT_HOLDER ref
        resolving to a unit for which dfhack.units.isMerchant() is true). Full
        reasoning and the exact live counts (e.g. 60 of 119 SEEDS items are
        actually trader-held) are in the .lua file's own header comment, not
        duplicated here. The mechanism (bucket counting over DRINK/FOOD/
        ANY_EDIBLE_RAW, reusing connectivity.report's main_group_id for the
        unreachable check) was exercised live against Uniboslan via a
        throwaway /tmp script over dfhack-run lua, matching every ad hoc probe
        this stream ran independently -- but the FILE itself has never been
        placed on VM 103 or invoked as `df-overseer-stocks food-drink`, per
        this stream's no-deploy constraint. Treat as verified-by-mechanism,
        not verified-by-the-actual-shipped-command, until the next deploy pass
        re-confirms it as this file, not a copy of its logic.

        SECOND FIX, same day: the first version of this tool counted item
        ENTITIES, not stack units -- "5 raw edible items" on Uniboslan was
        really 24 units of food (the user reading the screen caught it:
        "~20 food and 5 meat" visible; a fisherdwarf's or hunter's catch
        commonly stacks 4-5 units per item entity). Each bucket now returns
        `units` (the `item.stack_size` sum -- the PRIMARY field, what "how
        much food" means) alongside `item_count` (the distinct-entity
        count, still real and useful for hauling/container reasoning, never
        silently dropped), plus `foreign_units`/`foreign_item_count` on the
        caravan's side and unit-summed `rotten_units`/`unreachable_units`.
        Re-verified live via the same throwaway-script method: drink
        units=0/foreign_units=50, raw_edibles units=24/foreign_units=245,
        matching the user's on-screen count exactly.
    seeds:
      lua_function: get_seeds
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-16 (deployed to VM 103 and run as the shipped command: 59 fort-owned, 34 plump helmet; hidden-tile guard added after, measured no change, redeploy owed)"
      knowledge_scope: player_visible
      notes: >
        Per-plant fort-owned seed counts, same ownership test as food-drink.
        Live-verified this session (same throwaway-script method): of 119
        SEEDS items on Uniboslan, only 59 are fort-owned (the other 60 are the
        current caravan offering seed varieties for sale) -- so even reading
        the raw SEEDS vector count without this filter already overstates
        fort-owned seed stock by roughly half on this exact fort today.

        Returns `total_units`/`total_item_count` and `by_plant_units`/
        `by_plant_item_count`, same units-vs-item_count split as food-drink
        above (see that entry's SECOND FIX and the .lua file's own header).
        SEEDS items on this fort happen to always carry stack_size == 1
        (confirmed live: sum of stack_size == item count, both 59), so the
        two numbers are equal here -- an observed fact about this fort
        today, not a property of the SEEDS item type in general, which is
        exactly why this tool reports both rather than assuming the
        equality holds.
    "availability TYPE":
      lua_function: get_availability
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-20 (live on VM 103 after the batch deploy: `availability BOULDER` read 7 total, 3 in buildings, 4 available; handoffs/2026-09-19-deploy-batch.md, register 2026-09-20)"
      # Deployed to VM 103 and run live 2026-09-19 (handoffs/2026-09-19-deploy-and-live-verify.md: BUCKET, an unknown type, both UNIT_HOLDER
      # branches), yet still tagged unverified here because dfmcp/tests/test_registry.py pins it; see handoffs/2026-09-21-doc-drift-pass-2.md.
      knowledge_scope: player_derivable
      # player_derivable, not player_visible, same reasoning as food-drink/
      # seeds above: each per-item fact this aggregates (forbidden tag,
      # in-job/claimed status, an ownership tag) is individually visible on
      # the vanilla stocks/item-viewer screens, but the netted aggregate is
      # a computation over them, not itself one screen.
      notes: >
        UPDATE 2026-09-22: the paragraphs below are the offline build's own words
        and are kept as history. Since then the tool was deployed and hash-verified
        on VM 103 (2026-09-19), run live against BUCKET, an unknown type gave an
        error object and both UNIT_HOLDER branches were exercised, and
        owned_ref_check.verified_offline was flipped to true
        (handoffs/2026-09-19-deploy-and-live-verify.md). `verified` stays
        unverified above only because a registry test pins it. The six-deduction
        form (in_building and construction added) is what is deployed and was
        run live against BOULDER (handoffs/2026-09-19-deploy-batch.md).
        ADDED handoffs/2026-09-19-per-item-flags-tool.md, an OFFLINE build
        stream: no VM, no DFHack process, no deploy, so this command is
        UNVERIFIED BY EXECUTION, not merely "not yet redeployed" like
        food-drink/seeds above -- it has never been run at all. Everything
        below is static reasoning plus reuse of already-verified
        primitives from this same file, stated as such, not as a live
        result.

        Closes the gap handoffs/2026-09-19-snapshot-assembler.md's
        write-up named: `count_bucket`/`count_fort_owned` (this file,
        `df-overseer-well.lua`, `df-overseer-workshop.lua`) all fold
        straight to `units`/`item_count` sums, so no per-item record ever
        reaches a caller for `production/snapshot.py`'s already-built
        `stock_from_items`/`items_for_cover` path to net further, even in
        principle -- of docs/PRODUCTION-MODEL.md sec7's four deductions AT
        THE TIME (`in_job`, `owned`+`UNIT_HOLDER`, `forbid`, `trader`), only
        `trader` was reachable from any shipped tool. Motivating case: the
        fort held 3 empty, unforbidden, unclaimed BUCKET items and still
        logged "Give water: Need empty bucket" (tick 214135) -- a
        totals-only read (well.lua's `fort_owned.BUCKET: 3`) cannot
        distinguish that from "0 exist," "3 exist but all job-claimed," or
        "3 exist but all forbidden," which are four different fixes (wait,
        make one, raise priority, unforbid).

        SUPERSEDED handoffs/2026-09-19-in-building-deduction.md, still
        offline (no VM this stream either). The four-flag gate above still
        missed a real case the same day: three fort-owned, unforbidden,
        unclaimed shale boulders, and `availability BOULDER` reported 3
        available while all three were `flags.in_building=true` (built into
        the still, the mason's workshop and the mechanic's workshop --
        decisions/DECISIONS.md 2026-09-19, "Solved: there were no free
        boulders at all"). `in_building` ("Part of a building, including
        mechanisms and bodies in coffins") and `construction` ("Material
        used in construction") are now netted the same way as in_job/
        forbid/owned, both confirmed as real `item_flags` bitfield members
        in DFHack's own df-structures `df.item.xml`, fetched from upstream
        for this stream. `in_building` is live-confirmed on this install;
        `construction` is added on the strength of the same structure
        definition and sec7's own analogy, unverified live (no construction
        has ever existed on Uniboslan). The gate is now five marginal flags
        (`in_job`, `forbid`, `owned`, `in_building`, `construction`) plus
        `trader` via `is_fort_owned`, six total, matching
        `production/blocker.py`'s `DEDUCTION_FLAGS`.

        TYPE is any `df.global.world.items.other` key -- BUCKET (the
        motivating case), DRINK/FOOD/ANY_EDIBLE_RAW/SEEDS (this file's own
        other buckets, now netted one flag further), CHAIN/BLOCKS/
        TRAPPARTS (well.lua's other three well materials). An unresolved
        TYPE returns `{error: ...}` (dfmcp/server.py's exact-shape rule
        surfaces this as `isError`), never a silently-empty result --
        matching `production/snapshot.py`'s own `UnknownNodeError`
        convention, per this stream's own handoff ("Unknown node ids are
        an error, not a silent skip").

        `trader` reuses `is_fort_owned`, THIS FILE'S OWN ALREADY-VERIFIED
        predicate (food-drink verified 2026-09-16, mechanism-level;
        untouched by this addition, so that verification is not
        invalidated). `in_job`/`forbid`/`owned` are the three new
        deductions, each read through a new `checked_flag` helper that
        treats a raised read (docs/TRAPS.md: `item.flags.forbidden`
        "errors outright" live on this install -- `forbid` is the real
        name) AND a non-boolean silent return AS THE SAME HONEST FAILURE,
        never as `false` -- the exact "0 of 15 for a token that does not
        exist" failure mode this project has shipped once before, this
        time asserted against rather than trusted. An item whose flag
        can't be checked is tallied under `unnetted_units`/
        `unnetted_item_count`, never folded into `available_units`, and
        the flag's name is added to the result's own `flag_read_errors`
        list once.

        `owned` IS SHIPPED HALF-CHECKED, AND SAYS SO IN ITS OWN OUTPUT.
        docs/PRODUCTION-MODEL.md sec7 requires `item.flags.owned` PLUS the
        item's own `UNIT_HOLDER` general_ref as confirmation, not the flag
        alone. `checked_unit_holder_ref` calls
        `dfhack.items.getGeneralRef(item, df.general_ref_type.UNIT_HOLDER)`
        -- the same class of call this file's own header already
        describes using, live, to confirm `flags.trader` against a real
        merchant unit -- but that exact call, for UNIT_HOLDER, has never
        run from any COMMITTED code in this repo; the only precedent is an
        uncommitted ad hoc `dfhack-run lua` probe in a chat session
        (`df-overseer-orders.lua`'s own header, tick 227160: "3 fort-owned
        ... unclaimed, no holder"). Every result this command returns
        therefore carries `owned_ref_check.verified_offline: false`
        unconditionally, per this stream's own handoff ("if you cannot
        confirm the ref lookup offline, say so and leave it flagged rather
        than shipping a half-check that reads as authoritative") -- read
        `owned_units` as "flagged owned," not as an independently
        confirmed live dwarf claim, until a live run flips that flag from
        outside this file.

        Output per call: `type`, `total_units`/`total_item_count`
        (fort-owned, i.e. today's existing food-drink/seeds/well/workshop
        base -- trader/garbage_collect/removed/hidden-tile already netted
        out), `available_units`/`available_item_count` (fully netted, all
        six deductions), `unnetted_units`/`unnetted_item_count` (a flag
        read failed, availability genuinely unknown), `in_job_units`/
        `forbid_units`/`owned_units` (+`_item_count` each) as the per-flag
        breakdown the handoff asked for, `owned_ref_check` (see above),
        `in_building_units`/`construction_units` (+`_item_count` each,
        ADDED handoffs/2026-09-19-in-building-deduction.md -- the fifth and
        sixth per-flag breakdown, same shape as in_job/forbid/owned, so a
        caller sees e.g. "3 total, 3 in_building, 0 available" instead of a
        bare wrong 3), `trader_units`/`trader_item_count` (mirrors
        food-drink's `foreign_units` but scoped to this one type),
        `rotten_units`/`unreachable_units` (reused unchanged from
        count_bucket), and `flag_read_errors` (a list of flag names, empty
        when every read succeeded -- now can also name `in_building` or
        `construction`).

        NOT DONE EITHER STREAM, and deliberately: no live run (offline both
        times; VM 103 was owned by a parallel stream on 2026-09-19's first
        pass, and this second pass is offline by its own handoff's design),
        no attempt to make `owned_ref_check.verified_offline` true from
        inside this file (only a live-run write-up can do that honestly),
        and no attempt to verify `construction` live (Uniboslan has never
        had a construction). `production/snapshot.py`'s `DEDUCTION_FLAGS`/
        `UNNETTABLE_TODAY` were updated by the second stream (in scope for
        it, unlike the first).

df-overseer-labor.lua:
  build_order_item: "not in the 0-9 spatial build order -- a separate gap, decisions/DECISIONS.md 2026-09-11"
  commands:
    "unit-status [idle|injured|military|hostile]":
      lua_function: unit_status
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12"
      knowledge_scope: player_derivable
      notes: >
        FIXED 2026-09-12: used to print raw `pos=x,y,z` for every
        citizen/threat row -- a documented placeholder from before the
        landmark system was merged to main. Now resolves near_landmark/
        direction/distance_tiles via nearest_landmark, same as every other
        perception tool. Deployed and re-verified live same day against
        Uniboslan's real 15 citizens: every row shows near_landmark, zero
        raw pos= anywhere. Separately, unaffected by this fix: the
        `hostile` filter (dfhack.units.isDanger/isInvader) is proven
        UNRELIABLE as a fort-defense signal -- missed a real kea attack
        entirely, flagged harmless demons instead. Treat its output as
        "worth a second look," never "confirmed safe/hostile" on its own.
        KNOWLEDGE-SCOPE FIX 2026-09-16: the `hostile` filter was OMNISCIENT
        before this fix -- no reachability, no isHidden check at all,
        already empirically shown to surface 4 demons 40 z-levels down
        behind solid rock (decisions/DECISIONS.md 2026-09-11). Now excludes
        any dfhack.units.isHidden unit -- see the .lua file's own header for
        the measured live before/after. idle/injured/military (unaffected
        by this fix, always the player's own citizens) stay player_visible
        in effect; this one id covers both, tagged at the id's own worst
        case per the audit's own granularity rule.
    "labors UNIT_ID":
      lua_function: list_labors
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-11"
      knowledge_scope: player_visible
      notes: "df.unit_labor confirmed as an enum wrapper needing numeric iteration, not pairs()."
    "set-labor UNIT_ID LABOR_NAME on|off":
      lua_function: set_labor
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        No longer STALE as of 2026-09-21: the deploy of that day
        (handoffs/2026-09-21-deploy-building-batch.md) overwrote
        df-overseer-labor.lua on VM 103 with main's copy, hash-verified 48 of
        48 and again at the installed path, so the fix below is now the
        deployed code. Still `unverified` as a command: no set-labor call was
        made after the deploy.
        unit.status.labors as a genuine
        indexable/settable bitfield is confirmed live 2026-09-11.
        FIXED 2026-09-16 (handoffs/2026-09-16-stocks-read-and-labor-race.md
        item 3, closing decisions/DECISIONS.md 2026-09-12's "set_labor
        already races autolabor" finding): set_labor now checks
        plugins.autolabor.isEnabled() (confirmed live: a real, present Lua
        API, returns true on this fort today) and, for any non-military
        unit while autolabor is enabled, calls `autolabor LABOR disable`
        BEFORE writing the bitfield -- taking that one labor out of
        autolabor's management FORT-WIDE (not per-unit; no per-unit
        exemption exists short of military duty or a burrow restriction,
        neither used here for this purpose) rather than racing it. The
        return message says this side effect plainly every time it fires.
        If autolabor's enabled state cannot be determined at all, set_labor
        now REFUSES with a clear reason instead of guessing. See the .lua
        file's own header comment for the full reasoning and the exact
        verification boundary: isEnabled()/CR_OK/the FISH-code-name mapping
        were each confirmed live (read-only) this session; the actual
        `autolabor LABOR disable` command was deliberately NOT executed
        live this session (a real, persistent change to the running fort's
        automation config, out of scope for a read-only, no-deploy stream)
        -- verified-by-mechanism, not verified-by-execution, until a future
        session with go-ahead re-confirms it.

    "enabled-counts LABOR...":
      lua_function: enabled_counts
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a /tmp script under a throwaway name: real labors, an unknown name, NONE, an enum internal, lowercase and a number all behaved; MASON, STONECUTTER, MECHANIC and CARPENTER counts cross-checked against an independent per-unit read. After the deploy the same day, over a real MCP client: MASON 3, STONECUTTER 2 and NOTALABOR null with an error, cross-checked against an independent per-unit read of 22 citizens)"
      knowledge_scope: player_visible
      notes: >
        How many citizens have a labor enabled, as {"counts": {LABOR: n or
        null}, "errors": {LABOR: message}}. A name that is not a real
        df.unit_labor entry is null plus an error, NEVER 0 (the
        FEED_WATER_WOUNDED silent zero). Names are checked by round trip
        through df.unit_labor, so NONE, enum internals, numbers and lowercase
        are all errors. Takes one or more LABOR names in a single call
        (contract C1); the MCP argument `labor` is an array with one item
        per name, expanded into one command-line word each. Enabled means the labor bit is set, not that anyone is skilled or
        idle.

