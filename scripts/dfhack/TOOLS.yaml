        report holds identically on a dry or a real call. MATERIAL_CHOICE
        (same contract as df-overseer-building.lua's build: omitted
        excludes economic material by default, "allow_economic" opts in, a
        material name picks it explicitly) is resolved through that same
        file's exported `building_filters_and_gaps`, keyed by this
        construction kind's numeric (building_type, subtype) --
        `material_report` is its output, `material_gaps` what is short. As
        of 2026-10-01 this is ENFORCED on a real (non-dry) call, not just
        reported: `building.lua`'s exported `apply_material_filters` writes
        every eligible material name into buildingplan's own filter for
        this (type, subtype) once, before any of this step's ring tiles are
        designated, and restores the prior filter once every tile in the
        step has been attempted (`material_filter`, with `applied` and
        `restored`) -- one bracket per call, not per tile, since every ring
        tile of one call shares the same kind. Never written on a dry run,
        and never written when nothing is eligible (an empty write would
        tell buildingplan "no restriction", the opposite of an empty
        class). The eligible names come from buildingplan's OWN vocabulary
        (never stock, fixed the same day after a live silent-no-op on
        building.build -- see `verified` above), and every write is read
        back and verified before being trusted: a mismatch restores the
        prior filter and reports that rec failed
        (`material_filter.applied[i].ok: false`), never silently treated as
        applied. DRY_RUN defaults to true. Granted to the overseer only
        (mutates fort state, dfmcp/roles.py rule 2).

        2026-10-01 (handoffs/2026-10-01-entrances-get-doors.md), live
        incident evals/live/2026-10-01-queue-and-material-deploy/README.md
        ("Month window, a sealed office"): `build` now computes this zone's
        entrance(s) before designating anything, through `find_entrances`
        (a ring tile whose outside neighbour belongs to the fort's main
        walkable group -- connectivity.report's own main_group_id, never
        re-derived -- and whose inside neighbour is the zone's own
        footprint). A zone with NO detectable entrance among its open ring
        tiles is refused outright, by name, before anything is designated
        (never proceeds and seals the room). Any ring tile that IS the
        entrance is pulled out of the candidate set before item_present/
        keeps_access/reservation ever see it, reported in `held` with guard
        "entrance" -- for every KIND, not just Wall (CLAUDE.md's
        generalisability rule: this does not try to know per-subtype which
        constructions block walking). `entrances_found` is new on the
        response. Offline/lupa-tested only (tests/test_construction_lua_logic.py,
        the office's own real 3x3-interior/16-tile-ring geometry from the
        eval); never run against a live fort.
      summary: "Designates a construction of a given kind (for example a wall) over every open ground tile on a zone's boundary ring."
      guide:
        arguments:
          - name: "ZONE_ID"
            required: true
            default: null
            meaning: >-
              An existing zone's own id, as zone.list gives it in its id field (used by zone.assign-
              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
              resolved to its real footprint server-side. An id that is not an activity zone (a
              workshop id, for example) is a named error, not a guess.
          - name: "KIND"
            required: true
            default: null
            meaning: >-
              The construction kind, exactly as construction.list-kinds gives it in its token field
              (Wall, Floor, Fortification, Ramp).
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
          - name: "MATERIAL_CHOICE"
            required: false
            default: ""
            meaning: >-
              Optional. Same contract as building.build's own MATERIAL_CHOICE: leave it out to
              exclude economic materials (ore and gem) by default, pass the word allow_economic to
              allow them, or name a material directly (for example SHALE) to pick it even if it is
              economic, unless the kind's own requirements demand a non-economic material, which
              always wins.
          - name: "RES_ID"
            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
          - name: "OVERRIDE"
            required: false
            default: null
            meaning: >-
              A free-text reason string for a one-off exception to RES_ID's own allowed-kinds gate
              (building.build, zone.place, workshop.build, farm.build, well.build, openarea.build,
              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
              unreserve plus a new reserve, never this. Leave it out otherwise; the refusal names
              the handle, its purpose and the kinds it does allow.
        returns: >-
          On a real (non-dry) call the chosen material class is actively enforced through the game's
          own material filter for the duration of the call, then restored.
        before_a_real_run:
          - >-
            A ring tile still shaped as a wall (not yet mined) is refused by name, never silently
            skipped.
          - >-
            Before designating, every candidate target is checked against two guards: it will not
            seal off the last remaining approach to an unmined ore or gem tile, and it will not bury
            an unhauled item; targets the guards hold back are reported separately from ones simply
            refused for bad input.
          - >-
            The zone's own entrance tile(s) are always kept clear and never targeted, for every
            kind, not only walls; a zone with no detectable entrance is refused outright rather than
            risking a sealed room.
        traps:
          - >-
            The material filter is enforced only for the duration of this one call, then restored;
            it is not a permanent change to buildingplan's own settings.
