            for an owner does not mean the owner is actually set yet.
    "list KIND_FILTER OWNER_FILTER VALID_FILTER NEAR_LANDMARK_FILTER [RADIUS_TILES]":
      lua_function: list_zones
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md),
        answering the gap the Architect's first real run found: nothing
        could enumerate this fort's zones at all, so a real run reached
        "there is no Office zone anywhere" when there were two (ids 10 and
        11). One bounded pass over the fortress's own civzone vector, never
        a tile scan. Four composable filters, each "" for "no filter" (same
        convention check-owner's OWNER already uses): KIND_FILTER (a token
        from list-kinds), OWNER_FILTER ("", owned, unowned, or a unit id),
        VALID_FILTER ("", not_applicable, met, not_met, cannot_tell) and
        NEAR_LANDMARK_FILTER (a landmark name, with RADIUS_TILES). Designed
        for fifty bedrooms, not two offices: every filter "" summarises
        (`summary: true`, `counts_by_kind` over the whole inventory, plus
        `needs_attention`: the zones whose room_value_status reads
        not_met/cannot_tell or whose owner_status reads unowned/cannot_tell)
        rather than listing every zone; any filter given returns matching
        zones' detail rows instead (capped at 500, `truncated` says so).
        ADDED 2026-10-07 (handoffs/2026-10-07-planner-p1b.md): the unfiltered
        summary also carries `furnished_by_kind` (zones of each kind holding
        every defining furniture kind of ZONE_POLICY, complete buildings only;
        null for a kind with no defining furniture) and
        `furniture_counts_by_kind` (kind -> building type -> complete
        buildings inside zones of that kind; no key for a kind with no zone).
        A zone whose contents could not be read (over the 625-tile contents
        bound, a failed tile lookup) makes its kind's entries null plus a
        `read_failures` line, never a low count. Read from the game, generic
        per kind (the per-kind data is ZONE_POLICY), coordinate-free, and only
        in the summary: a filtered list does not pay for it. The fort plan's
        `zones."KIND".furnished` and `.furniture."F"` signals read these.
        Offline (lupa) only: the live check is a zone.list on the fort.
        IDENTITY is the zone's own id (already this project's precedent:
        place_zone's own read_back.id, order."ID".exists, landmark."NAME"),
        never a coordinate. VALIDITY reuses nobles.requirements' own
        met/not_met/cannot_tell discipline, per zone: `room_value_status`
        (not_applicable for a kind with no room-value concept at all, met
        for a non-empty getRoomDescription, not_met for a real read that
        came back empty -- the exact condition that went unnoticed on this
        fort for two days -- cannot_tell for a failed read, logged to
        `read_failures` and dfhack.printerr) and a SEPARATE `owner_status`
        (not_applicable/owned/unowned/cannot_tell), so an owner-capable
        kind's unowned state is its own fact rather than folded into
        "invalid" -- an owned zone can still read empty and a bare unowned
        zone can still read a real quality word. Fleet-wide "which of my
        rooms are not really rooms" is `KIND_FILTER="" OWNER_FILTER=""
        VALID_FILTER="not_met" NEAR_LANDMARK_FILTER=""` in one call. Offline
        build and structural review only; the first live check this needs is
        named in this handoff's own Result section, starting with this
        fort's two known zones (id 10 unowned, id 11 owned by the Manager,
        both expected `room_value_status: not_met` per the same-day room
        research, `research/2026-09-23-room-and-zone-requirements.md`).
      summary: "Lists or summarises the fort's existing zones, filterable by kind, owner, validity and location."
      guide:
        arguments:
          - name: "KIND_FILTER"
            required: true
            default: null
            meaning: >-
              Optional, for zone.list. '' means any kind; otherwise a token from zone.list-kinds
              (Office, Bedroom, ...). An unknown kind is an error.
          - name: "OWNER_FILTER"
            required: true
            default: null
            meaning: >-
              Optional, for zone.list. '' means no owner filter; 'owned' or 'unowned' filters by
              whether an owner-capable zone has one; a digit string filters to zones owned by that
              exact unit id.
          - name: "VALID_FILTER"
            required: true
            default: null
            meaning: >-
              Optional, for zone.list. '' means no filter; otherwise one of not_applicable (the kind
              carries no room-value concept at all), met (a real, non-empty room quality reading),
              not_met (the read succeeded and came back empty, a rectangle, not a room) or
              cannot_tell (the read itself failed).
