        subtype, min and max footprint, and whether the size is fixed.
        FILTER is an optional case-insensitive substring of token, label or
        type (Workshop, Furnace, Bed, Bridge). An unmatched FILTER gives an
        empty list; a table that cannot be read gives an error object, never
        an empty list.
      summary: "Lists every building kind that can be placed, with its footprint size and the token to pass as KIND to building.find/build."
      guide:
        arguments:
          - name: "FILTER"
            required: false
            default: null
            meaning: >-
              Optional. A case-insensitive substring of a kind's token, label or type (Workshop,
              Furnace, Bed, Bridge) to narrow the list. A filter that matches nothing gives an empty
              list, not an error.
        returns: >-
          An unmatched filter returns an empty list, not an error. Use the token column, never the
          display label, when calling building.find or building.build.
        before_a_real_run: []
        traps: []
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES] [MATERIAL_CHOICE]":
      lua_function: find_kind
      skippable: ["[W H]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused, read only: workshop, furnace, 1x1 and 5x5 kinds, furniture, variable-size kinds and error cases. After the deploy the same day, over a real MCP client as the overseer: Masons, Still, Smelter, Kiln, Bed, Well and FarmPlot each returned five sites, and the unknown kind, near-miss name, wrong footprint, missing W H and unknown landmark cases each errored with a named reason). Material choice and kind_previously_built (2026-09-28) are code/offline-tested only; NOT yet live-verified. The economic-material check was corrected the same day (handoffs/2026-09-28-building-economic-uses-fix.md) from a wrong field (inorganic.economic_uses, proved live to answer a different question in research/2026-09-28-ore-detection.md) to inorganic:isOre()/inorganic.material:isGem() -- see the register for those exact DFHack field names still needing live confirmation against a real install"
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one building kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (or
        quickfort's own key such as wl), never a display label. [W H] is an
        optional pair: give both or neither. Leave them out and the tool
        uses the kind's own footprint, read from the game (3x3 for every
        workshop, furnace and siege engine except Kennels, Siege and
        TradeDepot at 5x5 and Quern, Millstone and SCREW_PRESS at 1x1;
        list-kinds shows each), so a caller never needs to know a fixed-size
        kind's size. Pass W and H only for a variable-size kind (farm plots,
        roads, bridges), any size inside min..max; a size that is not the
        kind's own for a fixed-size kind is an error. The pair can be left
        out while LEVEL is given: the Lua CLI reads one leading number as
        LEVEL and two as W H (hence `skippable`). A site
        qualifies when every footprint tile is revealed, building-free and
        passes the kind's own quickfort tile rule (beds indoors, doors beside
        a wall, farm plots on soil), with a walkable tile in or beside it.
        Each result carries `requirements` (what the game says the kind needs
        to be built, from dfhack.buildings.getFiltersByType, with stock
        counts from the six-deduction availability read; a plain item-type
        filter is still counted by item type only, its own flags listed but
        not applied). A `building_material` filter (boulder/log/block) is
        instead broken down by decoded material name under
        `requirements.building_material.filters[i].materials`, each tagged
        `economic` when the game's own raws mark it ore or gem
        (inorganic:isOre() / inorganic.material:isGem(), corrected
        2026-09-28 from a wrong economic_uses-based check -- see
        handoffs/2026-09-28-building-economic-uses-fix.md); economic
        materials are excluded from `chosen_material`/`available` by
        default (`excluded_materials` says which and why). MATERIAL_CHOICE,
        the last argument, previews the override this filter would use if
        `build` were called the same way: "allow_economic" to allow economic
        materials, or a material name (e.g. SHALE) to name one directly.
        Also carries a plain `gaps` list of what is short (report only, it
        never refuses a build), a `search` block of how many tiles were
        checked, and `kind_previously_built` (true/false/null): whether a
        real building of this exact kind already exists at full build stage,
        read live from the game rather than a fixed note. No site gives an
        error object that says how many tiles were checked and eligible, so
        "nothing here" can be told apart from a broken check. Result shape is
        contract C1 of docs/BUILDING-TOOL.md. No labor names and no
        confidence level: the MCP layer adds those.
      summary: "Finds up to five non-overlapping sites for one building kind near a landmark, ranked by distance."
      guide:
        arguments:
          - name: "KIND"
            required: true
            default: null
            meaning: >-
              The building kind, exactly as building.list-kinds gives it in its `token` field
              (Still, Carpenters, Bed, FarmPlot), or quickfort's own key such as wl. Never the
              display label. An unknown kind is an error.
          - name: "W"
            required: false
            default: null
            meaning: >-
              Width, in tiles, of the footprint. Optional, and give W and H together or not at all.
              Leave both out and the tool uses the kind's own footprint, read from the game
              (building.list-kinds shows it). Pass them only for a variable-size kind such as a farm
              plot, road or bridge, within that kind's min..max. A size that is not the kind's own
              for a fixed-size kind is an error, and so is leaving both out for a variable-size kind
              (the error states its allowed range).
          - name: "H"
            required: false
            default: null
            meaning: >-
              Height, in tiles, of the footprint. Optional, and give W and H together or not at all.
              Leave both out for the kind's own footprint; pass them only for a variable-size kind.
              A wrong size for a fixed-size kind is an error.
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
              The name of an existing landmark to search or act near (see landmarks.list /
              landmarks.get for real names). Never a raw coordinate.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "MATERIAL_CHOICE"
            required: false
            default: ""
            meaning: >-
              Optional. Previews the material class a real build would use: leave it out to exclude
              economic materials (ore and gem) by default, pass the word allow_economic to allow
              them, or name a material directly (for example SHALE) to pick it even if it is
              economic, unless the kind's own requirements demand a non-economic material, which
              always wins. This only previews; it never writes anything.
        returns: >-
          Each result reports what the game actually requires to build that kind (labor, item and
          material counts), what is short, and `kind_previously_built` (whether one of this kind
          already exists, read live). An empty result still reports how many tiles were checked, so
          "nothing here" can be told apart from a broken search.
        before_a_real_run: []
        traps:
          - >-
            The gaps list only reports what the game says is short; a find call never refuses on
            its own, even when everything needed is missing.
    "build KIND [W H] [LEVEL] NEAR_LANDMARK [RANK] [RADIUS_TILES] [DRY_RUN] [MATERIAL_CHOICE] [RES_ID] [OVERRIDE]":
      lua_function: build_kind
      skippable: ["[W H]"]
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-21 (DRY_RUN path only, live on VM 103: quickfort's own --dry-run validated the generated blueprint for workshop, furnace, furniture and variable-size kinds, first through a /tmp script path and again after the deploy over a real MCP client as the overseer for Masons, Kiln, Craftsdwarfs, Smelter, Bed and FarmPlot 5x5). REAL PATH FIRST EXERCISED 2026-09-23 (evals/live/2026-09-23-office-and-first-real-build/README.md): `building.build Chair Well 1 20 false` against the same site the dry run validated -- quickfort_ok:true, quickfort_problems:[], read_back confirmed building_found:true and type_matches:true. This is the first real, non-dry-run build of any kind this tool has ever made. Not yet a complete loop: the Chair sits buildingplan-suspended (stocks CHAIR read 0 before and after; the job is stuckjobs-visible as waiting_on:\"suspended\"), since the fort owns no Chair item yet; a manager order (ConstructThrone) was created to try to supply one and had not gone active after 900 ticks. A second real kind, the Carpenter's Workshop, was built live 2026-09-25 (out of economic hematite blocks, the gap this stream's material-choice fix addresses -- evals/live/2026-09-25-first-real-conductor-cycle/README.md). Material choice and kind_previously_built (2026-09-28) are code/offline-tested only; NOT yet live-verified. The economic-material check itself was corrected the same day (handoffs/2026-09-28-building-economic-uses-fix.md) from inorganic.economic_uses (wrong field, live-proved in research/2026-09-28-ore-detection.md) to inorganic:isOre()/inorganic.material:isGem(). 2026-10-01 (handoffs/2026-10-01-buildingplan-material-filter.md, register 2026-09-30 ruling): the resolved material CLASS is now WRITTEN into buildingplan's own per-building-type filter (`plugins.buildingplan.setMaterialFilter`, DFHack `53.16-r1` `plugins/buildingplan/buildingplan.cpp` lines 900-1010ish) for the duration of a real build, then restored -- code/offline-tested only (tests/test_buildingplan_material_filter_lua_logic.py against the real building.lua), NOT yet live-verified: whether the written filter is actually honoured by a running fort's item search, and whether the write/restore window is wide enough relative to quickfort's own registration timing, are both open per research/2026-09-30-item-binding-design.md section 5 (T1-T3, T6). CORRECTED THE SAME DAY (still 2026-10-01): a live dfhack-run lua test on VM 103 (reversible, restored after) found the first cut was a SILENT NO-OP -- the class was built from this file's own stock-scan names (`.material.id`, empty for a boulder on this fort, falling back to `material_0_243`), which never matched buildingplan's own `mat_cache` (keyed by `MaterialInfo:toString()`, confirmed live: `dfhack.matinfo.decode(0,243):toString() == \"shale\"`), so every write left all 367 materials enabled. Fixed: the class is now built from `getMaterialFilter`'s own vocabulary (never stock), and every write is read back and compared before being trusted -- a mismatch restores the prior state and reports failure rather than pretending success. Still code/offline-tested only past that point (the readback logic itself, not the live write it protects)."
      knowledge_scope: player_derivable
      notes: >
        Places one building of KIND at the RANK-th site near a landmark.
        DRY_RUN defaults to true; only an explicit "false" builds. A dry run
        resolves the site, generates the blueprint in code (no per-kind
        files), and asks quickfort to validate it with --dry-run under
        `validation` (ok is true only when a building would be designated and
        no problem counter is above zero; quickfort itself reports success
        even when it designated nothing, verified by a negative control).
        Its only side effect is a scratch blueprint file on the guest,
        removed straight after. The real path runs the blueprint, reports
        quickfort_ok/quickfort_error/quickfort_stats, and reads the tile
        back (`read_back`) because quickfort can succeed without a building.
        MATERIAL_CHOICE (last argument) controls which material CLASS a
        `building_material` filter resolves to: omitted, it excludes economic
        materials by default (see find's notes); "allow_economic" opts back
        in; naming a material (e.g. SHALE) picks it explicitly even if it is
        economic, unless the game's own filter flags require non_economic, in
        which case that always wins. As of 2026-10-01, on a REAL (non-dry)
        build this class is ENFORCED, not just reported: every eligible
        material name is written into buildingplan's own filter for the
        building's (type, subtype, custom) for the duration of this call,
        then the prior filter is restored (`result.material_filter`, with
        `applied` and `restored` sub-records) -- the filter is fort-wide per
        building type, not per instance, which is why this is a
        set-for-the-call-and-restore, never a permanent change. The eligible
        names come from buildingplan's OWN vocabulary (`getMaterialFilter`),
        never from stock (fixed the same day after a live silent-no-op, see
        `verified` above); a mismatch on the post-write readback restores the
        prior filter and reports the rec failed (`applied[i].ok: false`,
        `error`), never silently treated as applied. `applied[i]` also
        reports `enabled_count` and `economic_enabled` (which of the enabled
        names are economic, for visibility). `find` only ever previews the
        class (`filter_material_names` on each
        `requirements.building_material.filters[i]`, now vocabulary-based
        too, plus a `filter_class_error` when the vocabulary or economic-
        material scan could not be read); it never writes anything.
        `kind_previously_built` (true/false/
        null, read live, not a fixed note) says whether this exact kind has a
        real building already at full build stage: ask the user before the
        real build of a kind that is not yet built for real; once it is true
        for a kind, proceed on your own judgement like any other accepted
        proposal. Same requirements, gaps, search and site fields as find.
        Footprint rules as in find.
      summary: "Builds one building of a given kind at a ranked site near a landmark."
      guide:
        arguments:
          - name: "KIND"
            required: true
            default: null
            meaning: >-
              The building kind, exactly as building.list-kinds gives it in its `token` field
              (Still, Carpenters, Bed, FarmPlot), or quickfort's own key such as wl. Never the
              display label. An unknown kind is an error.
          - name: "W"
            required: false
            default: null
            meaning: >-
              Width, in tiles, of the footprint. Optional, and give W and H together or not at all.
              Leave both out and the tool uses the kind's own footprint, read from the game
              (building.list-kinds shows it). Pass them only for a variable-size kind such as a farm
              plot, road or bridge, within that kind's min..max. A size that is not the kind's own
              for a fixed-size kind is an error, and so is leaving both out for a variable-size kind
              (the error states its allowed range).
          - name: "H"
            required: false
            default: null
            meaning: >-
              Height, in tiles, of the footprint. Optional, and give W and H together or not at all.
              Leave both out for the kind's own footprint; pass them only for a variable-size kind.
              A wrong size for a fixed-size kind is an error.
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
              The name of an existing landmark to search or act near (see landmarks.list /
              landmarks.get for real names). Never a raw coordinate.
          - name: "RANK"
            required: false
            default: "1"
            meaning: >-
              Which ranked candidate to act on: 1 is the candidate closest to NEAR_LANDMARK.
              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
          - name: "MATERIAL_CHOICE"
            required: false
            default: ""
            meaning: >-
              Optional. Controls the material class actually built: leave it out to exclude economic
              materials (ore and gem) by default, pass the word allow_economic to allow them, or name
              a material directly (for example SHALE) to pick it even if it is economic, unless the
              kind's own requirements demand a non-economic material, which always wins. On a real
              (non-dry) build this is actively enforced through the game's own material filter for
              the duration of the call, then restored afterward.
          - name: "RES_ID"
            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
          - name: "OVERRIDE"
            required: false
            default: null
            meaning: >-
              A free-text reason string for a one-off exception to RES_ID's own allowed-kinds gate
              (building.build, zone.place, workshop.build, farm.build, well.build, openarea.build,
              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
              unreserve plus a new reserve, never this. Leave it out otherwise; the refusal names
              the handle, its purpose and the kinds it does allow.
        returns: >-
          The real result reads the tile back afterward, since quickfort can report success without
          actually placing a building. Before a real build of a kind that has never been built on
          this fort before (`kind_previously_built` false), check with the user first; once a kind
          exists for real, further builds of it are routine.
        before_a_real_run:
          - >-
            A dry run validates with the game's own quickfort check and makes no lasting change;
            only an explicit DRY_RUN false builds.
        traps:
          - >-
            MATERIAL_CHOICE's enforcement lasts only for this one call; the material filter is
            restored to whatever it was right afterward, never left changed permanently. A mismatch
            on the post-write read-back restores the prior filter and reports that record as failed,
            never silently treated as applied.
df-overseer-zone.lua:
  build_order_item: "gap named 2026-09-17 (handoffs/2026-09-17-water-and-industry-tools.md item 1); generalised over every zone kind and given an optional owner by handoffs/2026-09-21-zone-tool-generalise.md; given an inventory, a per-zone validity check and furniture-aware siting by handoffs/2026-09-23-zone-inventory-and-validity.md"
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name. OWNER: "" is
  # exactly what place_zone's own resolve_owner treats as "no owner" (owner
  # == nil or owner == "" both return nil early) -- needed (2026-09-30) so a
  # caller can supply RES_ID/OVERRIDE, both added after OWNER/AROUND_FURNITURE
  # in place's own signature, while skipping OWNER itself.
  arg_defaults: {LEVEL: "0", RANK: "1", RADIUS_TILES: "30", DRY_RUN: "true", AROUND_FURNITURE: "false", OWNER: ""}
  commands:
    "list-kinds [FILTER]":
      lua_function: list_kinds
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a scratch script path, fort paused; deployed and called over a real MCP client the same day; 18 kinds listed, no token collisions, FILTER office gave one row, an unmatched FILTER gave [])"
      knowledge_scope: player_visible
      notes: >
        Lists every zone kind quickfort can place, read at run time from
        quickfort's own table (reached through Lua upvalues, see the .lua
        header; a DFHack update that renames a hop gives an error naming it,
        never an empty list). The install has 18 kinds, not the 17 the
        handoff counted. Each row: token (the game's civzone_type name, the
        name to pass as KIND), key (quickfort's own letter, also accepted),
        label (display only), finder (`rectangle`, or `shore` for
        WaterSource and FishingArea), min and max size (max is the string "unbounded" for
        every zone), default_dims, owner_capable, room_value_field (which
        position field asks this kind for a room value, or null),
        prefer_indoors, caveat and policy_source ("ZONE_POLICY entry" or
        "default (no entry)"). Scope: the zone menu a player already sees.
        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md):
        each row also carries `furniture_kinds` (the building.list-kinds
        tokens `find`'s AROUND_FURNITURE flag will accept for this kind, `[]`
        for a kind with none). Offline addition, not re-deployed or
        re-verified live this stream.
      summary: "Lists every zone kind that can be placed, with its default size, whether it can have an owner, and which furniture kind (if any) counts toward its room value."
      guide:
        arguments:
          - name: "FILTER"
            required: false
            default: null
            meaning: >-
              Optional substring of a kind's token or label.
        returns: >-
          Use the token column when calling zone.find/place, never the label.
        before_a_real_run: []
        traps: []
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES] [AROUND_FURNITURE]":
      lua_function: find_zone_area
      skippable: ["[W H]", "[RADIUS_TILES]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (deployed to VM 103 the same day, hash-verified; the checks below ran through a scratch script path before the deploy and were not repeated after it. Live on VM 103, fort paused, read only: Office, Bedroom, DiningHall with and without W H, level -1, and error cases; WaterSource returned the same five bodies as the deployed water-only tool, plus a `token` field). AROUND_FURNITURE offline build only 2026-09-23, not deployed and not live-verified (handoffs/2026-09-23-zone-inventory-and-validity.md)."
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one zone kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (the old
        `water_source` still works). [W H] is an optional pair: give both or
        neither; leave them out and the kind's default size is used
        (list-kinds shows it; the defaults are this project's choice, not game
        data). One bare number is read as LEVEL and two as W H, hence
        `skippable`. Rectangle kinds: every tile of the window must be
        revealed, pass quickfort's own tile rule for the kind, carry no
        building or liquid (unless AROUND_FURNITURE admits it, below), be
        walkable, sit in one walkable group and not already be zoned with the
        same type. Kinds marked prefer_indoors list fully indoor windows first
        (`indoors` on each result; the tile's `outside` flag). Each result
        carries `search` (tiles checked, eligible, and why others were
        rejected, so "nothing here" can be told apart from a broken check),
        and `requirements.room_value` for room kinds: the positions whose data
        asks for a value from this kind (`required_office`, `_bedroom`,
        `_dining`, `_tomb`), whether each is held and by whom, and a plain
        statement that what counts toward the value is not exposed by the
        game (an external, older-version wiki account is included and marked
        unverified). A `caveat` says when a kind needs terrain this tool does
        not check. WaterSource and FishingArea share ONE finder, `shore` (W H
        refused): dry, unbuilt, standable ground BESIDE water, never the water
        itself, because the game's Water Source and Fishing zones only count
        tiles adjacent to water (wiki Zone page and the user's own play,
        2026-10-07; research/2026-10-07-stockpile-logistics.md section 6).
        LEVEL is the level of the ground the zone goes on: a sunken pool is
        found from the level above it. A tile is offered when water is on an
        orthogonal neighbour at that level, or directly below it or below an
        orthogonal neighbour. Diagonals are NOT counted and water two levels
        down is not counted: UNVERIFIED LIVE, the sources do not settle
        either. Each result adds `water_same_level`, `water_one_level_below`
        and `adjacency_rule`; the old depth/stagnant/salt keys describe the
        adjacent water. A ramp or ramp top counts as standable on its shape
        (getWalkableGroup reads 0 for them on this build). `place` refuses
        outright when no ground beside water is in reach.
        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md
        item 3): AROUND_FURNITURE (default false, RADIUS_TILES now
        `skippable` too so it can be given without W H/LEVEL) admits a tile
        occupied by one of the kind's own ZONE_POLICY `furniture_kinds`
        (Office:Chair, Bedroom:Bed, DiningHall:Table, Tomb:Coffin) instead of
        rejecting it as occupied; every other occupied tile is still
        rejected. Each result then carries `contains_qualifying_furniture`
        and `furniture_building_ids` (never a coordinate), and
        `furniture_kinds_checked` names which kinds were looked for. A kind
        with no furniture_kinds entry refuses the flag by name rather than
        silently ignoring it. `place` is unchanged: no new argument, still
        rejects every occupied tile -- this is `find`'s own capability.
        Offline build only, not deployed or live-verified this stream.
        RANKING FIXED 2026-09-24 (handoffs/2026-09-24-furniture-aware-
        ranking.md): a live 3x3 Office search found every returned site
        furniture-free because the old distance-only sort let a merely
        closer, empty window get chosen first, and the overlap filter that
        enforces non-overlapping results then discarded the furniture-
        containing window as it overlapped that pick. A site containing the
        kind's qualifying furniture now sorts above one that does not
        (existing indoor/distance ranking is the tiebreak within each
        group), so it cannot be overlapped away. Only takes effect when
        AROUND_FURNITURE is true; a plain find's ranking is unchanged. When
        AROUND_FURNITURE is true the whole response is also now
        `{results: [...], any_contains_furniture: bool, furniture_note:
        "..." (present only when false)}` instead of a bare array, so a
        caller learns "no candidate has it" without scanning every row. A
        plain find (no AROUND_FURNITURE) still returns the bare array.
        Offline build only, not deployed or live-verified this stream.
