      knowledge_scope: player_visible
      notes: >
        Lists every zone kind quickfort can place, read at run time from
        quickfort's own table (reached through Lua upvalues, see the .lua
        header; a DFHack update that renames a hop gives an error naming it,
        never an empty list). The install has 18 kinds, not the 17 the
        handoff counted. Each row: token (the game's civzone_type name, the
        name to pass as KIND), key (quickfort's own letter, also accepted),
        label (display only), finder (`rectangle`, or `water_body` for
        WaterSource), min and max size (max is the string "unbounded" for
