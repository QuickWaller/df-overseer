        own outside-ness) before writing `plant_id[season]` directly, the
        same struct-write pattern as df-overseer-labor.lua's set_labor.
        `plant_id` (length-4 array) and df.season (Spring=0..Winter=3) are
        both confirmed live this session; the index convention (a
        plant-raw index, matching item.mat_index) is inferred by
        convention, not independently proven, though farm.list decoding
        plot 4's four seasons back to MUSHROOM_HELMET_PLUMP (2026-09-17)
        is consistent with it.

        HONESTY FIX, handoffs/2026-09-17-dig-stair-fix.md: after a real
        write it reads plant_id back, same as before, but a write that
        doesn't stick now returns `nil, message` instead of a normal-
        looking result with `write_ok=false` buried inside it -- a caller
        skimming the result for a top-level error field could miss that
        flag. Matches every other refusal in this file's own `nil, message`
        convention; dfmcp/server.py's exact-shape `{"error": ...}` rule
        surfaces it to the caller as `isError`. The success shape is
        unchanged (`write_ok=true`, `read_back_plant_index`); only the
        failure shape changed. Not re-exercised live this stream (a live
        write was already proven by the predecessor live-test handoff
        above, and this session was read-only/dry-run only) -- a real
        forced-failure write (e.g. destroying the plot mid-write) is the
        only thing that could exercise the new error-return path itself.

