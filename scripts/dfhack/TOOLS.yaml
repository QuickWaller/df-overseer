        see whether it was cancelling direct-route or order-route production.
        DRY_RUN defaults to true, same contract as every other write tool
        here. Write tool: sole_writer overseer only (agents/ROSTER.yaml),
        denied to every advisor -- confirmed live 2026-09-23
        (evals/live/2026-09-23-order-job-attribution/README.md): granted only
        to the overseer's tool listing (+1 delta), absent from architect and
        quartermaster's listings (the deny works at the listing layer, not
        merely a call-time refusal). DEPLOYED 2026-09-23; the write verb
        itself was explicitly NOT exercised that run, per its own hard
        lines -- the exact first-live-run command is still owed.
      summary: "Cancels a directly-queued workshop job by id."
      guide:
        arguments:
          - name: "JOB_ID"
            required: true
            default: null
            meaning: >-
              The queued job's own id, as workjob.list-jobs gives it.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
        returns: >-
          Cancels a directly-queued workshop job by id.
        before_a_real_run:
          - >-
            Refuses to cancel anything that is not a queued workshop job created this way (a haul,
            eat or sleep job, for example), rather than removing arbitrary jobs.
        traps: []
