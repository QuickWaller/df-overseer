        first-in-ring-order tie-break `keeps_access` already established,
        reported in `suspended`. DRY_RUN defaults to true, same as
        mine-vein/build above. Like both of those, this file grants by tool
        id, not by argument, so this is granted to the overseer only, the
        same as every other mutating command here (dfmcp/roles.py rule 2)
        -- even though a DRY_RUN=true call never mutates anything, nothing
        in the current allowlist model can hand out "this tool, but only
        with this argument" to a read-only role.
      summary: "Checks one zone, or every activity zone, for a wall under construction that would seal off its last remaining entrance once finished, and can suspend that job before it completes."
      guide:
        arguments:
          - name: "ZONE_ID"
            required: false
            default: null
            meaning: >-
              An existing zone's own id, as zone.list gives it in its id field (used by zone.assign-
              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
              resolved to its real footprint server-side. An id that is not an activity zone (a
              workshop id, for example) is a named error, not a guess.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
        returns: >-
          Classifies every boundary tile as built, planned (a construction job in progress) or open,
          then checks whether an entrance would still exist once every planned tile finishes. A real
          (non-dry) call suspends the first job that is actually at risk, reported under
          `suspended`, as a backstop for a wall designated before construction.build's own entrance
          guard existed.
        before_a_real_run: []
        traps:
          - >-
            The audit may suspend the first at-risk job it finds as a backstop; this is a real
