      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        dfhack.world.SetPauseState(true). Always allowed (pausing is the
        safe direction, docs/AGENT-ARCHITECTURE.md ss6). System-kind only.
    resume:
      lua_function: clock_resume
      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        dfhack.world.SetPauseState(false), refused with the latch detail
        while a tripwire is latched (call clear first). System-kind only,
        and NOT granted to the Overseer even though it is the roster's
        sole_writer: dfmcp/roles.py's exception is gated on role kind, with
