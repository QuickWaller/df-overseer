            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
          - name: "OVERRIDE"
            required: false
            default: null
