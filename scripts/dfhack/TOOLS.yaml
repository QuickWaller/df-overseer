              landmarks.get for real names). Never a raw coordinate.
          - name: "RANK"
            required: false
            default: "1"
            meaning: >-
              Which ranked candidate to act on: 1 is the candidate closest to NEAR_LANDMARK.
              Defaults to 1 when omitted.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
          - name: "OWNER"
            required: false
            default: ""
            meaning: >-
              Optional. A unit id (digits) or a position code (MANAGER, BOOKKEEPER, SHERIFF). A code
              reserves the room for whoever holds the role now or later; a vacant role leaves it
              suspended. Only Bedroom, DiningHall, Office and Tomb can have an owner. Check first
