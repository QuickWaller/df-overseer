df-overseer-construction.lua:
  build_order_item: "the missing 'construct' capability; handoffs/2026-09-28-ore-vein-recovery-and-construction-tool.md, decisions/DECISIONS.md 2026-09-24"
  # Documented defaults (the values each command's own truthy_dry_run/
  # resolve_material_choice treat as unset), needed so a caller can supply
  # RES_ID/OVERRIDE (both added after DRY_RUN in mine-vein's signature, and
  # after MATERIAL_CHOICE in build's, 2026-09-30/2026-10-01) while skipping
  # an earlier optional argument by name. MATERIAL_CHOICE: "" matches
  # df-overseer-building.lua's own arg_defaults entry exactly (the two
  # commands share resolve_material_choice via building_filters_and_gaps,
  # 2026-10-01).
  arg_defaults: {DRY_RUN: "true", MATERIAL_CHOICE: ""}
  commands:
    "mine-vein ZONE_ID [DRY_RUN] [RES_ID] [OVERRIDE]":
      lua_function: mine_vein
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, lupa-tested against a fake world only, 2026-09-28). Depends on surface.vein-material's own unverified tile-decode chain; never run against a real DFHack process. DRY_RUN defaults to true."
      knowledge_scope: player_derivable
      notes: >
        For a zone's own boundary-ring tiles, identifies which are ore/gem
        (via df-overseer-surface.lua's decode_vein_tile, reused not
        duplicated) and designates a real dig on each one still shaped
        WALL, one single-cell #dig blueprint per tile applied via quickfort
        `-c` (never a raw coordinate returned). Reports what it found
        (ore_tiles_found), what was already open (already_open, not
        re-designated), and refuses (refused, named why) any tile it could
        not classify confidently rather than guessing it is ore. DRY_RUN
        defaults to true; only the word false performs the real
        designation. Granted to the overseer only (mutates fort state,
        dfmcp/roles.py rule 2).
      summary: "Designates digging for every ore or gem vein tile found on a zone's boundary ring."
      # Per-tool execution data (docs/CONDUCTOR-EXECUTION.md 2.3, handoffs/2026-10-07-route-ore-mining.md).
      # The Lua return has no `ok`: `refused` and `held` are lists of strings, empty when clean, so a
      # non-empty one refuses (an unclassifiable ring tile, a failed designation, or a tile held by
      # another reservation would leave ore behind). blocked_reason joins them. nothing_applied reads
      # the count of tiles designated: a real run that designated nothing is a retryable failure, one
      # that designated some is Uncertain (a partial change cannot be called a clean refusal).
      execution:
        verdict: {refused_if_true: [refused, held], reason: blocked_reason}
        dry_run_echo: dry_run
        nothing_applied: {all_zero: [designated_tiles]}
        preview_fields: [ore_tiles_found, designated_tiles, already_open, refused, held]
      guide:
        arguments:
          - name: "ZONE_ID"
            required: true
            default: null
            meaning: >-
              An existing zone's own id, as zone.list gives it in its id field (used by zone.assign-
              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
              resolved to its real footprint server-side. An id that is not an activity zone (a
              workshop id, for example) is a named error, not a guess.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
          - name: "RES_ID"
            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
          - name: "OVERRIDE"
            required: false
            default: null
            meaning: >-
              A free-text reason string for a one-off exception to RES_ID's own allowed-kinds gate
              (building.build, zone.place, workshop.build, farm.build, well.build, openarea.build,
              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
              unreserve plus a new reserve, never this. Leave it out otherwise; the refusal names
              the handle, its purpose and the kinds it does allow.
        returns: >-
          Designates digging for every ore or gem vein tile found on a zone's boundary ring.
        before_a_real_run:
          - >-
            Only designates a tile that is confidently identified as ore or gem (via surface.vein-
            material's own decoding); anything it cannot classify confidently is refused by name
            rather than guessed.
        traps: []
    "mine-vein-site SITE_ID [DRY_RUN] [RES_ID] [OVERRIDE]":
