        had a construction). `production/snapshot.py`'s `DEDUCTION_FLAGS`/
        `UNNETTABLE_TODAY` were updated by the second stream (in scope for
        it, unlike the first).
      summary: "Reports how much of an item type the fort truly has available right now, after excluding what is claimed, forbidden, in a building, used in construction, or owned by a caravan trader."
      guide:
        arguments:
          - name: "TYPE"
            required: true
            default: null
            meaning: >-
              The item type token to check, for example BUCKET, DRINK, FOOD, SEEDS, CHAIN, BLOCKS or
              TRAPPARTS.
        returns: >-
          An unresolved TYPE is an error, never a silently empty result. Reports a `total` count, a
          fully netted `available` count, and a per-deduction breakdown (in a job, forbidden, owned
          by a unit, in a building, used in construction, caravan-owned) so a caller can see WHY
          something is unavailable, not just that it is. An item whose status could not be checked
          is reported separately as `unnetted`, never folded into `available`. The "owned by a unit"
          deduction is flagged in its own output as not fully independently confirmed; read it as a
          reasonable signal, not a certainty.
        before_a_real_run: []
        traps:
          - >-
            The owned-item deduction is only half-checked (it does not verify the owner can still
            reach the item), so available is a reasonable signal, not a certainty.
df-overseer-labor.lua:
  build_order_item: "not in the 0-9 spatial build order -- a separate gap, decisions/DECISIONS.md 2026-09-11"
  # Documented default (the value quota's own Lua uses when DRY_RUN is
  # omitted), used by dfmcp/tools.py to fill a slot an agent skipped while
  # naming a later optional argument by name. Same convention as the farm/
  # workshop/zone/trees/well/nobles files.
  arg_defaults: {DRY_RUN: "true"}
  commands:
    "unit-status [idle|injured|military|hostile]":
      lua_function: unit_status
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-12"
      knowledge_scope: player_derivable
      notes: >
        FIXED 2026-09-12: used to print raw `pos=x,y,z` for every
        citizen/threat row -- a documented placeholder from before the
        landmark system was merged to main. Now resolves near_landmark/
        direction/distance_tiles via nearest_landmark, same as every other
        perception tool. Deployed and re-verified live same day against
        Uniboslan's real 15 citizens: every row shows near_landmark, zero
        raw pos= anywhere. Separately, unaffected by this fix: the
        `hostile` filter (dfhack.units.isDanger/isInvader) is proven
        UNRELIABLE as a fort-defense signal -- missed a real kea attack
        entirely, flagged harmless demons instead. Treat its output as
        "worth a second look," never "confirmed safe/hostile" on its own.
        KNOWLEDGE-SCOPE FIX 2026-09-16: the `hostile` filter was OMNISCIENT
        before this fix -- no reachability, no isHidden check at all,
        already empirically shown to surface 4 demons 40 z-levels down
        behind solid rock (decisions/DECISIONS.md 2026-09-11). Now excludes
        any dfhack.units.isHidden unit -- see the .lua file's own header for
        the measured live before/after. idle/injured/military (unaffected
        by this fix, always the player's own citizens) stay player_visible
        in effect; this one id covers both, tagged at the id's own worst
        case per the audit's own granularity rule.
      summary: "Lists citizens by status (idle, injured, military) or nearby creatures flagged hostile."
      guide:
        arguments:
          - name: "idle|injured|military|hostile"
            required: false
            default: null
            meaning: >-
              Optional filter, one status word, to list only units in that state.
        returns: >-
          The hostile filter is proven unreliable as a fort-defense signal on its own: it has missed
          a real attack and flagged harmless creatures. Prefer threat.scan for anything safety-
          related; treat this filter's hostile output as worth a second look only.
        before_a_real_run: []
        traps: []
    "labors UNIT_ID":
      lua_function: list_labors
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-11"
      knowledge_scope: player_visible
      notes: "df.unit_labor confirmed as an enum wrapper needing numeric iteration, not pairs()."
      summary: "Lists which labors are enabled for one citizen."
      guide:
        arguments:
          - name: "UNIT_ID"
            required: true
            default: null
            meaning: >-
              The unit id to read labor assignments for.
        returns: >-
          Lists which labors are enabled for one citizen.
        before_a_real_run: []
        traps: []
    "set-labor UNIT_ID LABOR_NAME on|off":
      lua_function: set_labor
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        No longer STALE as of 2026-09-21: the deploy of that day
        (handoffs/2026-09-21-deploy-building-batch.md) overwrote
        df-overseer-labor.lua on VM 103 with main's copy, hash-verified 48 of
        48 and again at the installed path, so the fix below is now the
        deployed code. Still `unverified` as a command: no set-labor call was
        made after the deploy.
        unit.status.labors as a genuine
        indexable/settable bitfield is confirmed live 2026-09-11.
        FIXED 2026-09-16 (handoffs/2026-09-16-stocks-read-and-labor-race.md
        item 3, closing decisions/DECISIONS.md 2026-09-12's "set_labor
        already races autolabor" finding): set_labor now checks
        plugins.autolabor.isEnabled() (confirmed live: a real, present Lua
        API, returns true on this fort today) and, for any non-military
        unit while autolabor is enabled, calls `autolabor LABOR disable`
        BEFORE writing the bitfield -- taking that one labor out of
        autolabor's management FORT-WIDE (not per-unit; no per-unit
        exemption exists short of military duty or a burrow restriction,
        neither used here for this purpose) rather than racing it. The
        return message says this side effect plainly every time it fires.
        If autolabor's enabled state cannot be determined at all, set_labor
        now REFUSES with a clear reason instead of guessing. See the .lua
        file's own header comment for the full reasoning and the exact
        verification boundary: isEnabled()/CR_OK/the FISH-code-name mapping
        were each confirmed live (read-only) this session; the actual
        `autolabor LABOR disable` command was deliberately NOT executed
        live this session (a real, persistent change to the running fort's
        automation config, out of scope for a read-only, no-deploy stream)
        -- verified-by-mechanism, not verified-by-execution, until a future
        session with go-ahead re-confirms it.
      summary: "Turns one labor on or off for one citizen."
      guide:
        arguments:
          - name: "UNIT_ID"
            required: true
            default: null
            meaning: >-
              The unit id to change labor assignments for.
          - name: "LABOR_NAME"
            required: true
            default: null
            meaning: >-
              The labor name, exactly as df.unit_labor names it (MASON, CARPENTER, BREWER).
          - name: "on|off"
            required: true
            default: null
            meaning: >-
              Whether to turn the named labor on or off for this unit.
        returns: >-
          If autolabor is managing the fort's labor automatically, enabling or disabling a labor
          here takes that labor out of autolabor's management FORT-WIDE, not just for this one
          citizen, and the result says so plainly. Prefer labor.quota for an autolabor-managed fort
          when the goal is a target headcount rather than one citizen's assignment.
        before_a_real_run:
          - >-
            If autolabor's own state cannot be read, this refuses rather than guessing.
        traps: []
    "enabled-counts LABOR...":
      lua_function: enabled_counts
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a /tmp script under a throwaway name: real labors, an unknown name, NONE, an enum internal, lowercase and a number all behaved; MASON, STONECUTTER, MECHANIC and CARPENTER counts cross-checked against an independent per-unit read. After the deploy the same day, over a real MCP client: MASON 3, STONECUTTER 2 and NOTALABOR null with an error, cross-checked against an independent per-unit read of 22 citizens)"
      knowledge_scope: player_visible
      notes: >
        How many citizens have a labor enabled, as {"counts": {LABOR: n or
        null}, "errors": {LABOR: message}}. A name that is not a real
        df.unit_labor entry is null plus an error, NEVER 0 (the
        FEED_WATER_WOUNDED silent zero). Names are checked by round trip
        through df.unit_labor, so NONE, enum internals, numbers and lowercase
        are all errors. Takes one or more LABOR names in a single call
        (contract C1); the MCP argument `labor` is an array with one item
        per name, expanded into one command-line word each. Enabled means the labor bit is set, not that anyone is skilled or
        idle.
      summary: "Counts how many citizens currently have each of one or more labors enabled."
      guide:
        arguments:
          - name: "LABOR..."
            required: true
            default: null
            meaning: >-
              One or more labor names, exactly as df.unit_labor names them (MASON, CARPENTER,
              BREWER), upper case. Give them all in one call. A name that is not a real labor comes
              back as null with an error, never as 0.
        returns: >-
          An unrecognised name returns null plus a named error for that entry, never a silent zero.
          "Enabled" means the labor is turned on for that citizen, not that they are skilled at it
          or currently idle.
        before_a_real_run: []
        traps: []
    "quota LABOR MIN MAX [POOL] [DRY_RUN]":
      lua_function: labor_quota
      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        ADDED handoffs/2026-10-01-labor-quota.md
        (research/2026-10-01-quartermaster-levers.md §2, "set intent, let
        the game execute": autolabor is the labour engine on this fort,
        this repo's job is per-labour targets, not hand-assignment).
        Refuses exactly like set-labor when autolabor's enabled state
        can't be determined, or when it is confirmed off. DRY_RUN defaults
        to true: validates the labor name and MIN/MAX/POOL shape and
        reports what would be set, without calling autolabor at all. A
        real write (DRY_RUN false) shells to `autolabor LABOR MIN MAX
        [POOL]` (the only interface for these numbers -- no Lua accessor
        exists per the research) and its report is always a fresh
        read-back through quota-status's own parser, never an echo of the
        MIN/MAX/POOL the caller passed. player_derivable, not
        player_visible, because it writes autolabor's own per-labour
        policy rather than reading a screen a vanilla player has. Exercised
        against a fake autolabor CLI in
        tests/test_labor_quota_lua_logic.py (16 cases: validation, the
        refusal, the dry-run no-call path, the real write's read-back
        including a pool default the caller never passed, and a simulated
        CLI failure) -- NOT yet run against the real plugin; the research's
        own "Not verified" section flags a live call as the way to confirm
        `autolabor LABOR MIN MAX` and `autolabor list`'s real text format
        both work the way this file's parser assumes. Only the overseer
        holds this grant (it is the sole mutating labor tool, same as
        set-labor).
      summary: "Sets autolabor's own min/max citizen target for one labor."
      guide:
        arguments:
          - name: "LABOR"
            required: true
            default: null
            meaning: >-
              One or more labor names, exactly as df.unit_labor names them (MASON, CARPENTER,
              BREWER), upper case. Give them all in one call. A name that is not a real labor comes
              back as null with an error, never as 0.
          - name: "MIN"
            required: true
            default: null
            meaning: >-
              The low threshold autolabor should keep at least this many workers assigned above.
          - name: "MAX"
            required: true
            default: null
            meaning: >-
              The high threshold autolabor should not assign more workers above.
          - name: "POOL"
            required: false
            default: null
            meaning: >-
              Optional. Restricts the quota to a named labor pool rather than every eligible dwarf.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
        returns: >-
          A dry run validates the shape without calling autolabor; a real write always reports a
          fresh read-back of autolabor's own settings afterward, never an echo of the numbers passed
          in. This is the "set a target and let autolabor manage toward it" tool; use labor.set-
          labor only for a one-off, specific citizen.
        before_a_real_run:
          - >-
            Refuses if autolabor is off or its state cannot be read.
        traps: []
    "quota-status [LABOR]":
      lua_function: labor_quota_status
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        ADDED handoffs/2026-10-01-labor-quota.md. Parses `autolabor list`'s
        own text output (research §2's cited source format, the only query
        surface that exists -- a bare `autolabor LABOR` is flagged
        unverified by the research, so this deliberately parses the full
        `list` output rather than depending on that unverified single-labor
        form) for one LABOR or, with none given, every labor autolabor
        reports on. Each entry carries autolabor's own self-reported
        "currently N dwarfs" AND an independently-read per-citizen count
        (the same enabled-counts logic, never a guessed 0 for an unknown
        name). A labor autolabor's own `list` never mentions is an error,
        never a default. player_derivable: this is a computation over
        autolabor's own text output plus a player-visible per-citizen
        labor read, not itself a vanilla screen. Exercised in
        tests/test_labor_quota_lua_logic.py against a fake `autolabor
        list` output (automatic/disabled/haulers modes, unknown labor,
        labor-with-no-autolabor-entry, and the no-argument "everything
        autolabor has" shape) -- NOT yet run against the real plugin's own
        text format live.
      summary: "Reads autolabor's own current settings for one labor, or for every labor it manages."
      guide:
        arguments:
          - name: "LABOR"
            required: false
            default: null
            meaning: >-
              One or more labor names, exactly as df.unit_labor names them (MASON, CARPENTER,
              BREWER), upper case. Give them all in one call. A name that is not a real labor comes
              back as null with an error, never as 0.
        returns: >-
          Each entry carries autolabor's own self-reported count alongside an independently-read
          count of citizens with that labor enabled, so the two can be cross-checked. A labor
          autolabor has no entry for is reported as an error, never a default zero.
        before_a_real_run: []
        traps: []
