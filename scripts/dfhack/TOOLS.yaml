              (building.build, zone.place, workshop.build, farm.build, well.build, openarea.build,
              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
