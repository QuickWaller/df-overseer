    "build ZONE_ID KIND [DRY_RUN] [MATERIAL_CHOICE] [RES_ID] [OVERRIDE]":
      lua_function: build_construction
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: false
      verified: "unverified (offline build, lupa-tested against a fake world only, 2026-09-28; guards added and lupa-tested the same way, handoffs/2026-09-28-keeps-access-guard.md). The real quickfort `#build`/`Cw` path (research/2026-09-24-quickfort-hands.md section 3) has never been run by this tool. DRY_RUN defaults to true. 2026-10-01 (handoffs/2026-10-01-buildingplan-material-filter.md): MATERIAL_CHOICE and the buildingplan filter write/restore are new, code/offline-tested only against a fake building_filters_and_gaps/apply_material_filters (tests/test_construction_lua_logic.py) -- the real write/restore mechanism itself is offline-tested against the real building.lua by tests/test_buildingplan_material_filter_lua_logic.py, but nothing here has run against a live fort. CORRECTED alongside building.build's same-day fix (still 2026-10-01): the class is resolved from buildingplan's own vocabulary via building.lua's building_filters_and_gaps, and every write apply_material_filters makes is read back and verified before being trusted, restoring and reporting failure on a mismatch -- see building.build's verified note above for the live evidence that motivated this."
      knowledge_scope: player_derivable
      notes: >
        For a zone's own boundary-ring tiles, designates a construction of
        KIND (resolved to quickfort's own key through
        df-overseer-building.lua's exported list_kinds -- generic, any
        construction subtype the install knows, not hard-coded to Wall)
        wherever a tile is now open ground, one single-cell #build
        blueprint per tile applied via quickfort `-c`. A ring tile still
        shaped WALL is refused by name ("not yet mined"), never silently
        skipped or guessed open -- this verb re-reads live shape itself,
        it does not assume mine-vein already ran. Before designating,
        every candidate target also passes two tool-layer guards (added
        2026-09-28, handoffs/2026-09-28-keeps-access-guard.md, modelled on
        DFHack's own suspendmanager reasons): `item_present` holds a
        target with an unhauled fort-owned item on it (named by item type,
        never a coordinate), and `keeps_access` holds just enough targets,
        jointly over the whole call, to keep at least one live orthogonal
        approach open to any exposed, not-hidden, still-unmined ore/gem
        tile that would otherwise be sealed (a narrow, no-map-mutation
        live check, not a hypothetical reachability pathfind -- see that
        handoff's Result section for why). A held target is reported in a
        new `held` list, distinct from `refused` (bad input) and `results`
        (designated); the rest of the call's targets proceed normally.
