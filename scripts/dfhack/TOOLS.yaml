# Tool manifest for df-overseer's DFHack scripts.
#
# Built 2026-09-12 per the take-stock/architecture pass's recommendation
# (decisions/DECISIONS.md 2026-09-12, "Opus-authored take-stock/architecture
# pass"): a small manifest instead of splitting the Lua tools into
# perception/ and action/ directories, since every action tool here is
# deliberately fused with its perception counterpart (build_open_area with
# find_open_area, dig_diggable_area with find_diggable_area, build_at_landmark
# with get_landmark_centroid) rather than kept separate. Doubles as a first
# draft of the still-missing MCP tool schema (docs/PURPOSE.md design
# commitment #5: "the brain lives outside this repo... this repo exposes DF
# over MCP") -- when that server gets built, each command block below is
# close to the shape one MCP tool definition needs (name, args, whether it
# mutates, what it returns).
#
# This is metadata ABOUT scripts/dfhack/*.lua, not a substitute for reading
# them -- each file's own header comment carries the full design rationale,
# live-verification detail, and honest caveats. Keep this file to one entry
# per CLI subcommand; if a subcommand's story needs more than a line or two,
# that belongs in the .lua file's own comment or a decisions/DECISIONS.md row,
# linked from here, not duplicated.
#
# Field meanings:
#   effect
#     read    -- queries fort state, never mutates it
#     mutate  -- causes a real, persistent change (a designation, a labor
#                flip, a UI-driven state change) -- gate live use the same
#                way any fort-mutating action is gated (quicksave discipline,
#                peer/user heads-up), not like a read command
#   coordinate_bearing
#     false           -- design commitment #1 (docs/PURPOSE.md): no raw x/y/z
#                        ever appears in this command's output. Landmark
#                        name/direction/distance_tiles instead.
#     internal-only   -- a real coordinate IS resolved and used internally
#                        (usually to drive `quickfort run -c x,y,z`), but
#                        never printed, returned, or assigned outside the
#                        function's own local scope.
#     true            -- a raw coordinate DOES appear in this command's
#                        output. Each true below is annotated with why: a
#                        documented, spec-sanctioned exception; a known,
#                        not-yet-fixed gap; or out-of-scope tooling (embark-
#                        site-selection UI automation, which predates any
#                        founded fort and isn't itself perception-layer code).
#   live_deployed
#     Whether the FILE is on VM 103's script-paths (per install_df.py
#     ui-install / script-install). All 10 files were, confirmed
#     2026-09-12 (Working.md handover); the later files were deployed
#     2026-09-17, 2026-09-19 and 2026-09-21 (each deploy handoff's report
#     is the evidence, and 2026-09-21 also redeployed the labor and zone
#     scripts and added the building script) -- this field exists per-command
#     anyway since a file being deployed doesn't mean every subcommand in it
#     has been exercised for real. "STALE" (see notes) marks a command
#     whose code was fixed in the repo but where VM 103 is still running an
#     older version of the file -- distinct from a clean true/false, since
#     the file IS present, just not the current code.
#   execution
#     Optional, per command. How the conductor (code) runs this tool as a proposed step and
#     judges its output (docs/CONDUCTOR-EXECUTION.md 2.3), as DATA so the next tool is one entry
#     and no code: verdict (ok / dry_ok / real_ok positive fields, refused_if_true,
#     refused_if_present, reason), dry_run_echo, issues_handle, resolution_fields,
#     nothing_applied, append_to_arg, handle_args, phases, progress, landed, cleanup.
#     Parsed and validated by dfmcp/action_data.py; a tool with none cannot be proposed.
#   verified
#     Last date this SPECIFIC command was confirmed against a real, running
#     fort (not just "the file loads without error"). "unverified" is an
#     honest label, not a bug -- per this repo's "mark verified vs proposed"
#     rule (CLAUDE.md, memory/dfhack-environment.md).
#   knowledge_scope
#     Added 2026-09-16 (handoffs/2026-09-16-knowledge-scope-audit.md, per
#     decisions/DECISIONS.md 2026-09-16 "Agents may only know what a vanilla
#     player could know"): dfmcp/registry.py REQUIRES this field on every
#     command and refuses to load without it. Values, from
#     research/2026-09-16-player-visibility.md:
#       player_visible   -- reads only things a vanilla player already sees
#                            on some real game screen (own citizens, own
#                            gamelog/announcements, own job list).
#       player_derivable -- a safe computation over player-visible facts
#                            (a candidate search, a reachability graph), not
#                            itself a screen, structurally guarded against
#                            reading anything designation.hidden/isHidden
#                            would say a vanilla player cannot know.
#       omniscient        -- reads something no vanilla player has any way
#                            to know. dfmcp/roles.py refuses at LOAD TIME to
#                            let ANY role's allowlist -- including the sole
#                            writer's -- grant a tool tagged omniscient. A
#                            tool this manifest cannot honestly tag anything
#                            but omniscient belongs in no allowlist at all;
#                            fix the tool, don't grant it.
#     The tag describes each command AFTER its own fix, where one was made
#     this session -- see the .lua file's own KNOWLEDGE-SCOPE FIX header
#     comment for what changed and why, never re-narrated here.
#   notes
#     A pointer, not a re-narration. Long rationale lives in the .lua file's
#     own header or a decisions/DECISIONS.md row.
#   signature tokens (the quoted command key), read by dfmcp/tools.py
#     NAME  required        [NAME]  optional        NAME...  one or more
#     [NAME...]  zero or more (must be last)    [A B]  optional pair or
#     group, all or nothing    a|b  a literal choice
#     Optional tokens are positional, so a skipped optional that precedes a
#     supplied one must be filled. `arg_defaults:` (script level) and
#     `defaults:` (per command, overriding) map an optional placeholder to its
#     documented default word, e.g. {LEVEL: "0", DRY_RUN: "true"}, quoted; the
#     server fills a skipped slot with it. It must equal what the Lua does when
#     the argument is omitted. A skipped optional with no declared default is
#     still refused. Only a command whose Lua CLI works out which
#     optionals were given some other way may say so with
#       skippable: ["[W H]"]
#     (a list of optional tokens exactly as written in the signature, checked
#     against it at load). Read the CLI's own parser before claiming it.

df-overseer-connectivity.lua:
  build_order_item: 2
  commands:
    report:
      lua_function: get_connectivity_report
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-10"
      knowledge_scope: player_derivable
      notes: "Reuses warn-stranded.lua's getStrandedGroups() via reqscript. decisions/DECISIONS.md 2026-09-10."
      summary: "Reports how the fort's walkable area is split into connected groups."
      guide:
        arguments: []
        returns: >-
          Shows whether the fort is one connected space or split into isolated pockets.
        before_a_real_run: []
        traps: []
    "check FROM TO":
      lua_function: check_reachable
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-23 (evals/live/2026-09-23-attention-deploy/README.md): called live as the overseer role for {from: Well, to: Still}, returned {status: reachable, from_group: 3478, to_group: 3478, from_via: adjacent, to_via: at} -- the tri-state shape confirmed live, matching the landmark-reachability handoff's own design exactly"
      knowledge_scope: player_derivable
      notes: >
        Landmark-name form, added once the landmark system existed
        (2026-09-10). The underlying dfhack.maps.canWalkBetween/
        getWalkableGroup mechanism is verified via check-units below.
        FIXED 2026-09-23 (handoffs/2026-09-23-landmark-reachability.md): result
        shape changed from {reachable: bool, from_group, to_group} to a
        tri-state {status: "reachable"|"unreachable"|"unknown", reason?,
        from_via?, to_via?, from_group?, to_group?} via the new shared
        df-overseer-reachability.lua. DEPLOYED and live-verified 2026-09-23
        (evals/live/2026-09-23-attention-deploy/), see verified above.
      summary: "Checks whether two named landmarks can be walked between."
      guide:
        arguments:
          - name: "FROM"
            required: true
            default: null
            meaning: >-
              The landmark name to start from, from landmarks.list.
          - name: "TO"
            required: true
            default: null
            meaning: >-
              The landmark name to check reachability to, from landmarks.list.
        returns: >-
          Returns a tri-state result: reachable, unreachable, or unknown (with a reason), never a
          bare true/false. A ramp or ramp-top landmark can be genuinely reachable from beside it
          even if its own tile reads as unwalkable; the result's from_via/to_via fields say whether
          the match was "at" the landmark or from an adjacent tile.
        before_a_real_run: []
        traps:
          - >-
            A ramp or ramp-top landmark can be genuinely reachable from beside it even if its own
            tile reads as unwalkable; from_via/to_via say whether the match was at the landmark or
            from an adjacent tile.
    "check-units UNIT_ID UNIT_ID":
      lua_function: check_reachable_units
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        Original stopgap, kept for low-level debugging. decisions/DECISIONS.md
        2026-09-10. Same tri-state result shape as check FROM TO above, and
        the same underlying df-overseer-reachability.lua is deployed and
        live-verified (see check FROM TO's verified line), but this specific
        unit-id wrapper has no separate live-call on record as of 2026-09-23.
      summary: "Checks whether two specific units can reach each other, by unit id."
      guide:
        arguments:
          - name: "UNIT_ID (1)"
            required: true
            default: null
            meaning: >-
              The first unit's id.
          - name: "UNIT_ID (2)"
            required: true
            default: null
            meaning: >-
              The second unit's id.
        returns: >-
          Low-level fallback kept for debugging; prefer connectivity.check with landmark names for
          normal use. Same tri-state result shape as connectivity.check.
        before_a_real_run: []
        traps: []
df-overseer-landmarks.lua:
  build_order_item: 3
  commands:
    list:
      lua_function: list_landmarks
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-23 (evals/live/2026-09-23-attention-deploy/README.md): called live as the overseer role. The Well's three exits (Activity Zone #1, Activity Zone #2, its own exit list) all now read reachability: reachable, with to_via/from_via: adjacent on the Well side -- confirms the fix. No landmark in the fort's current list reported unreachable or unknown"
      knowledge_scope: player_visible
      notes: >
        Seed + live buildings + live burrows, sorted by name for
        prefix-cache determinism. decisions/DECISIONS.md 2026-09-10/11.
        FIXED 2026-09-23 (handoffs/2026-09-23-landmark-reachability.md): each
        exit's `walkable` bool (from canWalkBetween on the two CENTROID
        tiles) replaced with `reachability` ("reachable"|"unreachable"|
        "unknown", `reachability_reason` on the last two, `from_via`/`to_via`
        reporting "at" vs "adjacent") via the new shared
        df-overseer-reachability.lua. Fixes a live-found false negative: the
        fort's own Well (centre tile a RampTop, standable by nobody) read
        walkable:false to every neighbour despite being genuinely reachable
        from beside it. DEPLOYED and live-verified 2026-09-23
        (evals/live/2026-09-23-attention-deploy/), see verified above.
      summary: "Lists every known landmark (fixed waypoints, buildings and burrows) with name and reachability to its neighbours."
      guide:
        arguments: []
        returns: >-
          Read-only, sorted by name. Each landmark's exits report a tri-state reachability
          (reachable / unreachable / unknown), not a bare walkable flag.
        before_a_real_run: []
        traps:
          - >-
            A landmark's own centre tile can read unwalkable (for example a ramp top) while still
            being genuinely reachable from beside it; trust the tri-state reachability field, not a
            raw walkable flag.
    "get NAME":
      lua_function: get_landmark
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        Thin filter over list_landmarks. The underlying list_landmarks call
        and shape are deployed and live-verified (see list above); this
        single-name filter itself has no separate live-call on record as of
        2026-09-23.
      summary: "Looks up one landmark by exact name."
      guide:
        arguments:
          - name: "NAME"
            required: true
            default: null
            meaning: >-
              The landmark's exact name, as landmarks.list gives it.
        returns: >-
          Looks up one landmark by exact name.
        before_a_real_run: []
        traps: []
    "build NAME BLUEPRINT_FILE [RES_ID] [OVERRIDE]":
      lua_function: build_at_landmark
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        Added 2026-09-11, merged into main 2026-09-12. Same fused
        resolve-and-act shape as build_open_area/dig_diggable_area (see
        those for the mechanism and the top-left-vs-center quickfort bug
        both of them had). No live-test claim on record for this one
        specifically -- treat as needing verification before relying on it,
        not as broken. FIXED handoffs/2026-09-30-reservation-gaps.md item 3:
        the reservation check used to cover only the anchor tile, since this
        tool never learned BLUEPRINT_FILE's own footprint size. Now reads
        the footprint via the extracted df-overseer-blueprint-parse.lua leaf
        (the same quickfort-CSV parser df-overseer-blueprint.lua itself now
        delegates to, moved out so this file can reuse it without a
        reqscript cycle -- that file already reqscripts this one) and checks
        every tile the blueprint will cover; a footprint that cannot be read
        refuses outright rather than falling back to anchor-only.
      summary: "Builds a blueprint anchored at a named landmark."
      guide:
        arguments:
          - name: "NAME"
            required: true
            default: null
            meaning: >-
              The landmark to build at, as landmarks.list gives it.
          - name: "BLUEPRINT_FILE"
            required: true
            default: null
            meaning: >-
              A quickfort blueprint filename already deployed under dfhack-config/blueprints/ on the
              DF host, e.g. "starter-room-5x5.csv", not a path on this repo's own filesystem, and
              not a coordinate.
          - name: "RES_ID"
            required: false
            default: null
            meaning: >-
              Optional. A reservation handle such as res-3, as blueprint.reservations lists it.
              Without it, a tile inside any reservation is refused outright. With it, a tile inside
              THAT reservation is allowed if this call's own kind is one the reservation lists as
              belonging there (blueprint.reservations shows the list, derived from the room's own
              template); a tile inside any OTHER reservation is still refused. Pair with OVERRIDE
              for a one-off exception when the kind is not on the list. Never a coordinate.
          - name: "OVERRIDE"
            required: false
            default: null
            meaning: >-
              A free-text reason string for a one-off exception to RES_ID's own allowed-kinds gate
              (building.build, zone.place, workshop.build, farm.build, well.build, openarea.build,
              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
              unreserve plus a new reserve, never this. Leave it out otherwise; the refusal names
              the handle, its purpose and the kinds it does allow.
        returns: >-
          Builds a blueprint anchored at a named landmark.
        before_a_real_run:
          - >-
            Checks every tile the blueprint's footprint will cover against existing reservations,
            not just the anchor tile; refuses outright if the footprint cannot be read.
          - >-
            Treat as needing verification before relying on it in a real run: unlike most builders
            in this project it has no separate dry-run step.
        traps: []
