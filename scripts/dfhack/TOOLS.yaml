      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-21 (deployed to VM 103, hash-verified. DRY_RUN run live on VM 103: Office with owner MANAGER gave quickfort validation ok with 1 zone and 9 tiles designated; Bedroom, Dining Hall and Water Source dry runs returned well-formed results). REAL PLACEMENT FIRST RUN 2026-09-23 (evals/live/2026-09-23-office-and-first-real-build/README.md): two real Office zones placed. Zone id 10, no owner (room_description read back null both times). Zone id 11, owner unit 345 (the Manager): owner_result.read_back confirmed get_owner_unit_id:345 immediately after placement, and a later check-owner call after the run window still reported unit_id:345 -- the ownership held. Both zones report indoors:false (no fully indoor 3x3 site existed near any workshop or the Well within a 20-tile radius; prefer_indoors:true is a preference, not a filter). Whether an outdoor, no-furniture office carries enough room value for required_office:1 is unsettled: order id 3 (the new furniture order) stayed validated:false through 900 ticks, which cannot yet distinguish 'needs more time' from 'needs more room value'"
      knowledge_scope: player_derivable
      notes: >
        Places one zone of KIND at the RANK-th site near a landmark. DRY_RUN
        defaults to true; only an explicit "false" places. Rectangle kinds: a
        dry run resolves the site, generates a `#zone` blueprint in code (no
        per-kind files), and asks quickfort to validate it with --dry-run
        under `validation` (ok only when a zone would be designated and no
        problem counter is above zero), removing the scratch file after. A
        real run reads the zone back (`read_back`: found, type, id and the
        game's room description) and reports quickfort's own statistics.
        ADDED 2026-09-23 (handoffs/2026-09-23-position-requirements-check.md):
        for a room-value kind (ZONE_POLICY's position_field set), a real
        placement whose own getRoomDescription read came back empty or
        failed now carries `read_back.room_value_warning` naming what that
        means, instead of leaving a bare null for a human to misread as
        "the tool can't see room value" rather than "the room reads no
        value yet" (exactly what happened reading this fort's first two real
        Office zones). Data-driven off position_field, no per-kind branch.
        This is a placement-time observation only, not a per-position
        verdict: nobles.requirements is the tool that says whether any
        specific position's requirement is met.
        WaterSource keeps its old behaviour exactly (a dry run reports the
        body and `would_zone_tiles`, no quickfort). OWNER (last argument, so
        RANK RADIUS_TILES and DRY_RUN must be given before it) assigns the
        new zone: a unit id or a position code, validated as in check-owner
        before anything is touched. quickfort's own dry run stops before it
        assigns, so a dry run proves the owner checks but not the
        assignment; a real run reads assigned_unit_id and the game's getOwner
        back under `owner_result`. Real placement first run 2026-09-23; see
        `verified` above.
        ADDED 2026-09-24 (live-blocking bug found placing a Tomb over a
        built Coffin, evals/live/2026-09-24-ghost-slab/README.md): AROUND_FURNITURE
        (last argument, so OWNER must be given before it, "" if none), the
        same opt-in flag `find` already had. Without it place shared
        ranked_rects with find but was never given find's furniture
        exemption, so it could never choose a site whose tile already held
        the qualifying furniture (a Tomb over an already-built Coffin is
        the same room-over-furniture pattern this fort's Office/Chair case
        already showed; an occupied tile like that was rejected exactly
        like any other occupied tile). Default false: an ordinary place
        keeps ranking bare sites exactly as before. When true, the result
        carries furniture_kinds, contains_qualifying_furniture and
        furniture_building_ids, the same fields `find`'s AROUND_FURNITURE
        result carries per site. Offline fix, not yet deployed or
        live-verified.
    "list KIND_FILTER OWNER_FILTER VALID_FILTER NEAR_LANDMARK_FILTER [RADIUS_TILES]":
      lua_function: list_zones
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md),
        answering the gap the Architect's first real run found: nothing
        could enumerate this fort's zones at all, so a real run reached
        "there is no Office zone anywhere" when there were two (ids 10 and
        11). One bounded pass over the fortress's own civzone vector, never
        a tile scan. Four composable filters, each "" for "no filter" (same
        convention check-owner's OWNER already uses): KIND_FILTER (a token
        from list-kinds), OWNER_FILTER ("", owned, unowned, or a unit id),
        VALID_FILTER ("", not_applicable, met, not_met, cannot_tell) and
        NEAR_LANDMARK_FILTER (a landmark name, with RADIUS_TILES). Designed
        for fifty bedrooms, not two offices: every filter "" summarises
        (`summary: true`, `counts_by_kind` over the whole inventory, plus
        `needs_attention`: the zones whose room_value_status reads
        not_met/cannot_tell or whose owner_status reads unowned/cannot_tell)
        rather than listing every zone; any filter given returns matching
        zones' detail rows instead (capped at 500, `truncated` says so).
        IDENTITY is the zone's own id (already this project's precedent:
        place_zone's own read_back.id, order."ID".exists, landmark."NAME"),
        never a coordinate. VALIDITY reuses nobles.requirements' own
        met/not_met/cannot_tell discipline, per zone: `room_value_status`
        (not_applicable for a kind with no room-value concept at all, met
        for a non-empty getRoomDescription, not_met for a real read that
        came back empty -- the exact condition that went unnoticed on this
        fort for two days -- cannot_tell for a failed read, logged to
        `read_failures` and dfhack.printerr) and a SEPARATE `owner_status`
        (not_applicable/owned/unowned/cannot_tell), so an owner-capable
        kind's unowned state is its own fact rather than folded into
        "invalid" -- an owned zone can still read empty and a bare unowned
        zone can still read a real quality word. Fleet-wide "which of my
        rooms are not really rooms" is `KIND_FILTER="" OWNER_FILTER=""
        VALID_FILTER="not_met" NEAR_LANDMARK_FILTER=""` in one call. Offline
        build and structural review only; the first live check this needs is
        named in this handoff's own Result section, starting with this
        fort's two known zones (id 10 unowned, id 11 owned by the Manager,
        both expected `room_value_status: not_met` per the same-day room
        research, `research/2026-09-23-room-and-zone-requirements.md`).
    "assign-owner ZONE_ID UNIT_ID [DRY_RUN] [OVERRIDE]":
      lua_function: assign_owner
      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-24 (handoffs/2026-09-24-zone-owner-assign.md). Gives
        an EXISTING zone an owner: `place ... OWNER` could only set one at
        creation, so a zone made another way (the blueprint verb makes zone
        13 with none) had no route to one, and nobles.requirements counts
        only zones the holder owns. Generic over every owner-capable kind
        (ZONE_POLICY's owner flag, no per-kind branch). DRY_RUN defaults to
        true; only the exact word false writes. Named refusals, each a
        result and never a write: zone_not_found, not_a_civzone,
        kind_has_no_owner, unit_not_found, unit_not_alive,
        unit_not_citizen, already_owner, zone_has_other_owner (an existing
        different owner is never replaced implicitly), unit_already_owns_
        kind_zone, zone_owner_unreadable, duplicate_check_unreadable. OVERRIDE
        (the word true) unlocks exactly two of those: zone_has_other_owner (the
        old owner is released first, as the read-back confirms) and unit_already_owns_kind_zone. It
        calls dfhack.buildings.setOwner only and never writes a field, then
        READS BACK both directions of the link (zone.assigned_unit_id and
        getOwner on the zone side, unit.owned_buildings on the unit side,
        and the previous owner's release) under links_confirmed, and
        `holder`: whether the zone now names the unit (the test
        nobles.requirements applies), whether the unit holds a position
        asking this kind's room value, and room_value_status (met / not_met /
        cannot_tell). A failed read is cannot_tell with read_failures and
        dfhack.printerr, never a default. If only one direction reads back
        the result says one_direction_only and applied false. Lives in
        `zone` because the zone is the thing it changes and its owner
        policy and read helpers are this file's; mutating, so Overseer only
        (dfmcp/roles.py rule 2). Offline build, not deployed.
    "clear-owner ZONE_ID [DRY_RUN]":
      lua_function: clear_owner
      effect: mutate
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-24 (handoffs/2026-09-24-zone-owner-assign.md). Removes
        an existing zone's owner through dfhack.buildings.setOwner(zone,
        nil), then reads both directions back (zone owner gone, previous
        owner's owned_buildings no longer holds the zone). Same refusals as
        assign-owner where they apply, plus zone_has_no_owner. Returns
        previous_owner_unit_id so assign-owner can restore it. WHAT IT
        CANNOT UNDO: the unit's lost-room reaction, and any preserve-rooms
        role reservation (that plugin's state is not readable from Lua, and
        it may re-apply its own choice on its next cycle). DRY_RUN defaults
        to true. Offline build, not deployed.
    "contents ZONE_ID":
      lua_function: zone_contents
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        ADDED 2026-09-24 (handoffs/2026-09-24-room-proxy-fix.md). Which
        buildings sit inside one zone: per building its kind (the game's
        building_type name), id, `exists` (flags.exists), `build_stage` of
        `build_stage_max`, `holds_items` (any contained item), `tiles_inside`,
        and `matches_zone_kind` (the kind is one of the zone kind's
        ZONE_POLICY `furniture_kinds`: Chair for Office, Bed for Bedroom,
        Table for DiningHall, Coffin for Tomb; no per-kind branch, the kind is
        read from the zone's own civzone_type). Also matching_count and
        complete_matching_count. It exists because getRoomDescription
        returned empty on a working office, so nothing else could say whether
        the zone holds its defining furniture; nobles.requirements calls the
        same helper (zone_furniture_report) for its independent evidence.
        TILE TEST, reused: the zone's rectangular footprint (the set
        df-overseer-surface.lua walks) and dfhack.buildings.findAtTile (the
        lookup zone_tile uses). It cannot see a non-rectangular zone extents
        bitmap (the rectangle over-reads it) or anything findAtTile does not
        return (civzones). Bounded: a zone over 625 tiles is refused. Output
        carries ids and dimensions, never a coordinate. Failed reads are
        NULL fields plus read_failures. Read only. Offline build, not
        deployed.

