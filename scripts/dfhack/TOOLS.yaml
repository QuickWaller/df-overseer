              diggable.dig/dig-stair, construction.mine-vein/build, landmarks.build), valid only
              together with RES_ID, recorded on the reservation (see blueprint.reservations); it
              never changes the reservation's own purpose or allowed kinds, re-purposing a room is
              unreserve plus a new reserve, never this. Leave it out otherwise; the refusal names
              the handle, its purpose and the kinds it does allow.
        returns: >-
          A real placement reads the built pile back (accepts and tile counts); a smaller-than-
          requested pile is possible and will show up there rather than being silently wrong.
