      knowledge_scope: player_derivable
      notes: >
        Closes the gap decisions/DECISIONS.md 2026-09-24 found (an ore vein
        smoothed into a wall reads as plain MINERAL-class stone to every
        other tool). Per boundary-ring tile: the tiletype_material class,
        plus -- for a MINERAL/FEATURE tile -- the decoded mineral name and
        whether it is economic (ore or gem: inorganic:isOre() or
        inorganic.material:isGem(), the calls DFHack's own prospector plugin
        uses; research/2026-09-28-ore-detection.md proved the earlier
        non-empty economic_uses rule answers a different question, and
        df-overseer-building.lua's item-material check was corrected to the
        same rule). vein_status is one of not_mineral /
        ore_or_gem / not_economic / hidden / unreadable / unknown -- unknown
        covers a MINERAL/FEATURE tile whose vein event could not be matched
        or decoded, NEVER a guessed name.
        `exposed` (handoffs/2026-10-05-ore-exposed-signal.md) summarises the
        ore/gem tiles that are still WALL-shaped and player-visible (a vein
        smoothed into a wall counts; one already mined open or hidden does
        not), as materials with tile counts, plus `unclassified_tiles` (the
        unknown count, never folded into ore) and `mine_with`. Reports `ring_position` (a 1-based
        sequence number, never a coordinate) per tile, matching design
        commitment #1. Bounded to the zone's own 900-tile ring cap, same as
        `material` above.
      summary: "Reports whether any of a zone's boundary ring tiles are an exposed ore or gem vein, even one already smoothed into an ordinary-looking wall, with a summary of the materials still exposed."
      guide:
        arguments:
          - name: "ZONE_ID"
            required: true
            default: null
            meaning: >-
              An existing zone's own id, as zone.list gives it in its id field (used by zone.assign-
              owner, zone.clear-owner and zone.contents). Never a coordinate, the zone's id is
