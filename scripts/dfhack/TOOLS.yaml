        `dfhack.designations.markPlant` directly on each of the nearest N
        reachable trees' own plant object (via
        `dfhack.maps.getPlantAtTile`) -- confirmed from source to be the
        EXACT primitive quickfort's own `#dig` `t` (chop) symbol calls,
        not a struct write this project invented, and not routed through a
        dynamically generated quickfort blueprint the way
        df-overseer-zone.lua's place_zone is (scattered single tiles vs.
        one connected shape -- a deliberate difference, not an
        inconsistency, see the .lua file's own header). Coordinates exist
        only inside the marking loop's own local scope.
      summary: "Marks the N nearest reachable trees near a landmark for felling."
      guide:
        arguments:
          - name: "N"
            required: true
            default: null
            meaning: >-
              How many trees to designate for felling, closest first.
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
              The name of an existing landmark to search or act near (see landmarks.list /
              landmarks.get for real names). Never a raw coordinate.
          - name: "RADIUS_TILES"
            required: false
            default: "30"
            meaning: >-
              How far from NEAR_LANDMARK to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
        returns: >-
          A dry run only resolves which trees would be marked.
        before_a_real_run:
          - >-
            An explicit DRY_RUN false marks them for real using the same game primitive the in-game
            chop designation uses.
        traps: []
