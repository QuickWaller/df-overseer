df-overseer-ledger.lua:
  build_order_item: "handoffs/2026-09-23-attention-tiers-ingame.md item 4"
  commands:
    "record RACE TICK DISTANCE_TILES [OUTCOME]":
      lua_function: record
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        Aggregates a sighting/outcome into the per-race observation ledger
        (race, first/last seen tick, closest distance, an outcomes count
        map). Never a per-unit row -- keyed on race, matching
        research/2026-09-23-wildlife-threat-classes.md S:E3(2). Called
        in-process (reqscript) by df-overseer-threat.lua's find_threats
        (present) and df-overseer-diff.lua's onReport (theft, race
        "unknown" -- see that file's own note) -- not granted to any role's
        tools.yaml, since no external caller needs it; the CLI form exists
        for manifest completeness and manual testing only.
        STRUCTURAL GUARANTEE: this function, and everything it calls, never
        references dfhack.world.SetPauseState, clock_pause/clock_resume or
        repeatUtil.* -- the file does not even reqscript df-overseer-clock.
        tests/test_observation_ledger.py greps the source for exactly those
        names as the regression guard.
      summary: "Records one sighting or outcome of a creature race into the observation ledger."
      guide:
        arguments:
          - name: "RACE"
            required: true
            default: null
            meaning: >-
              The creature race involved, or unknown when the report text carries no structured race
              field.
          - name: "TICK"
            required: true
            default: null
            meaning: >-
              The game tick the event happened at.
          - name: "DISTANCE_TILES"
            required: true
            default: null
            meaning: >-
              How far from the nearest landmark the event happened, in tiles.
          - name: "OUTCOME"
            required: false
            default: null
            meaning: >-
              Optional. The event's outcome tag (for example theft), when known.
        returns: >-
          Keyed by race, never by individual creature. In normal use this is called internally by
          threat.scan and diff.since, not by a caller directly; the CLI form exists mainly for
          manual testing. Never pauses or resumes the game.
        before_a_real_run: []
        traps: []
    "read [MAX_AGE_TICKS]":
      lua_function: read_ledger
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-23 (evals/live/2026-09-23-attention-deploy/README.md): called live as the overseer role, {rows: []} -- correct, since the fort has been paused throughout this deploy and no tripwire scan has run to write a row. The non-empty shape is unverified live"
      knowledge_scope: player_derivable
      notes: >
        Every ledger row, decayed at READ time only (never swept on write):
        a row whose only outcome is "present" and whose last_seen_tick is
        older than (now - MAX_AGE_TICKS) is left out; a row with any other
        outcome (theft, kill, ...) always survives. Granted to overseer,
        architect and quartermaster (agents/*/tools.yaml) per
        research/2026-09-23-wildlife-threat-classes.md S:E3(6): a repeated-
        sighting pattern is proposal material for the Architect
        (fence/trap) and Quartermaster (restock), not only the Overseer.
      summary: "Reads the observation ledger: what creature races have been sighted, how recently, how close, and with what outcomes."
      guide:
        arguments:
          - name: "MAX_AGE_TICKS"
            required: false
            default: null
            meaning: >-
              Optional. Only entries within this many ticks of now are returned.
        returns: >-
          A row whose only outcome is a plain sighting and that is older than MAX_AGE_TICKS is left
          out; a row with any other outcome (theft, a kill, and so on) always stays. A repeated
          sighting pattern here is material for a defensive proposal, not just the overseer's
          concern.
        before_a_real_run: []
        traps: []
