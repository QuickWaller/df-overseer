        -- flags.foreign is an origin flag (embark-outfitted OR caravan-brought),
        not a current-ownership one, and live-verified this session to be TRUE
        on the fort's own unclaimed embark barrels/seeds/wood, which would have
        zeroed out the fort's own supply if used naively. flags.trader was
