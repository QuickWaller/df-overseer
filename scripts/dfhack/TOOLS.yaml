df-overseer-threat.lua:
  build_order_item: "not in the 0-9 spatial build order -- a safety gap found 2026-09-12, research/2026-09-12-dfhack-capability-checks.md sec5"
  commands:
    "scan [RADIUS_TILES]":
      lua_function: find_threats
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        UPDATE 2026-09-23 (handoffs/2026-09-23-landmark-reachability.md):
        citizen_groups() and the candidate scan loop now resolve reachability
        via the shared df-overseer-reachability.lua (resolve_group/
        group_matches) instead of a bare getWalkableGroup(x,y,z)~=0 on the
        exact tile. Fixes a real blind spot (research/2026-09-17-
        pool-reachability.md, live-verified against this install): a
        RAMP/RAMP_TOP tile reads walkable group 0 regardless of true
        walkability, so a citizen or candidate standing on ordinary ramp
        terrain could be silently excluded before. This can only ADD matches
        (never remove one), so `scan` becomes MORE, not less, permissive
        about shares_walkable_group_with_citizens -- result entries also gain
        `reachable.shares_walkable_group_via` ("at"/"adjacent") and a
        "(via_adjacent_tile)" suffix in `why` when the match came from the
        neighbour-ring fallback. DEPLOYED 2026-09-23
        (evals/live/2026-09-23-attention-deploy/), live-checked: two candidates
        returned, both correctly `tier: record_only` for a kea 68 tiles away
        and a moose 77 tiles away.
        UPDATE 2026-09-22: the closing sentences below that say NOT DEPLOYED AND
        NOT RUN are stale. The file was on VM 103 and byte-equal to main on
        2026-09-17 (handoffs/2026-09-17-farm-tools-deploy.md), and the
        pre-fix version was live-verified 2026-09-12 (decisions/DECISIONS.md
        2026-09-12, 'Threat detector LIVE-VERIFIED'). `verified` stays
        unverified because the 2026-09-16 knowledge-scope fix has not been run
        live since and a registry test pins it. The 2026-09-21 deploy report
        found this file's bytes differ from main again (cause and direction not
        checked).
        KNOWLEDGE-SCOPE FIX 2026-09-16: was OMNISCIENT before this fix --
        isHidden units were reported as informational, not excluded, and
        this tool's own stated purpose is catching exactly what isHidden says
        a vanilla player cannot see. Now excludes any isHidden unit outright
        (decisions/DECISIONS.md 2026-09-16: sneaking ambushers are not
        allowed). COVERAGE LOST, stated plainly: an ambusher/sneaking
        creature no longer appears in `scan` at all until it stops
        sneaking or the announcement layer names an unspecified event
        (df-overseer-diff.lua's REPORT ambush/night_attack/undead_or_ghost
        categories -- see the .lua file's own header for the live-confirmed
        announcement ids). The reachable-but-unflagged case this tool was
        built for (the kea attack) is unaffected. NOT DEPLOYED AND NOT RUN
        as a live service. API surface verified by source reading only;
        no command has been executed against any DF process. Exists because
        the event layer has no usable hostile signal: INVASION fires only for
        DF-registered invasions, not ambushes, thieves, or wildlife turning
        aggressive, and the pre-existing df-overseer-labor unit-status hostile
        filter is verified wrong in both directions.
        DESIGN: admission is by REACHABILITY, never by a danger flag. A unit
        qualifies if it shares a getWalkableGroup id with a living citizen OR
        sits within a bounded distance of a named landmark; the two are OR'd
        because each covers the other's blind spot (group-sharing models
        ground pathing only, so a flyer reads group 0; landmark distance is
        geometric and does not imply real reachability on a tall fort).
        isDanger/isInvader/isAgitated/isGreatDanger are read, reported, and
        labelled HEURISTIC in the tool's own output, and used only as a
        ranking tiebreak. Consequence accepted deliberately: a harmless
        songbird inside the walkable network WILL appear, ranked low. How much
        wildlife noise that produces on a populated fort is unknown.
        Ranking weights and MAX_RESULTS are untuned guesses.
        UPDATE 2026-09-23 (handoffs/2026-09-23-attention-tiers-ingame.md item
        1; DEPLOYED 2026-09-23): every result now also carries
        `class_flags` (raw creature tags -- LARGE_PREDATOR/BUILDINGDESTROYER/
        CURIOUS_BEAST_ITEM/_EATER/_GUZZLER/BENIGN/MISCHIEVOUS, pcall-guarded,
        read at the caste level, `caste.misc.buildingdestroyer > 0` for the
        destroyer test -- see below), `tier` ("pause"|"slow"|"record_only",
        research/2026-09-23-wildlife-threat-classes.md S:E1's rule) and
        `tier_reasons`. Results are now sorted by tier first, the existing
        score second, so df-overseer-clock.lua's own tripwire can keep
        reading `results[1]` and get the worst TIER present, not merely the
        highest heuristic score. Reads df-overseer-ledger.lua's
        ledger_closest_distance (read-only) per candidate to evaluate the
        "closing in" theft condition -- see classify_tier's own comment.
        UPDATE 2026-09-23 (handoffs/2026-09-23-creature-tag-fields-fix.md):
        the six raw-tag reads were WRONG as first deployed, found live
        against a real kea (evals/live/2026-09-23-attention-deploy/README.md's
        "CRITICAL CHECK" section) -- creature-level instead of caste-level,
        `CURIOUSBEAST_*` instead of `CURIOUS_BEAST_*`, and
        `BUILDINGDESTROYER` tested as a flag bit when it is a plain integer.
        Every one of the six pcall-guarded reads silently returned `false`
        before the fix; the kea still landed in `record_only` by luck (none
        of the six tags gate the pause tier), but the SLOW tier -- built
        specifically for a theft-tagged creature closing in -- could never
        have fired. Corrected in the .lua file; a failed read is no longer
        indistinguishable from a genuine `false` -- `class_flags` now also
        carries a `read_failures` array naming any caste field that could
        not be read this call, and a non-empty one is also logged via
        `dfhack.printerr`. FIXED, REDEPLOYED AND LIVE-VERIFIED 2026-09-23
        (orchestrator, single-file redeploy, committed bytes hash-matched at
        the installed path): `threat.scan` now reads kea unit 513 as
        `is_curiousbeast_item: true` and `is_curiousbeast_eater: true` with
        `read_failures: []`, tier still correctly `record_only` at 68 tiles
        (not closing), and a moose as `is_benign: true`. **Still owed**: a
        live check that a deliberately broken field name actually surfaces
        in `read_failures` -- only a failing read can prove the guard fires,
        and none has failed live yet.
      summary: "Scans for creatures that might be a threat to the fort: reachable from a citizen's own walkable area, or within range of a landmark."
      guide:
        arguments:
          - name: "RADIUS_TILES"
            required: false
            default: null
            meaning: >-
              How far from a landmark to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
        returns: >-
          Each candidate is tiered pause/slow/record_only (used by the conductor's clock to decide
          whether to pause the fort, slow it down, or just log the sighting) and carries game-
          reported danger flags labelled as heuristic, not as a confirmed verdict: treat the danger
          flags as "worth a second look", never as "confirmed safe" or "confirmed hostile" on their
          own. A creature that is actively sneaking/hidden is excluded entirely, by design, until it
          stops sneaking or an announcement names it; this is a known, accepted coverage gap, not a
          bug.
        before_a_real_run: []
        traps:
          - >-
            A danger flag means worth a second look, never confirmed safe or confirmed hostile on
            its own; treat it as a prompt to check further, not a verdict.
df-overseer-breach.lua:
  build_order_item: "not in the 0-9 spatial build order -- a safety gap found 2026-09-12, research/2026-09-12-dfhack-capability-checks.md sec5"
  commands:
    "check [RADIUS_TILES]":
      lua_function: check_breach
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_derivable
      notes: >
        UPDATE 2026-09-22: the sentences below that say NOT DEPLOYED AND NOT RUN
        are stale as to deployment. The file was on VM 103 and byte-equal to main
        on 2026-09-17 (handoffs/2026-09-17-farm-tools-deploy.md and
        handoffs/2026-09-17-water-industry-tools-deploy.md); no live run of it is
        recorded in the deploy reports read for this update, so `verified` stays unverified. The 2026-09-21 deploy report
        found this file's bytes differ from main again (cause and direction not
        checked).
        KNOWLEDGE-SCOPE FIX 2026-09-16: was "player_derivable, leaning
        omniscient on mechanism" -- stage 2 read flow_size/liquid_type on any
        flagged block's tiles with no designation.hidden check, relying only
        on the reachability proxy. Fixed by checking designation.hidden per
        tile inside scan_block_tiles itself before a hidden tile can ever
        become a `hit` -- see the .lua file's own header. NOT DEPLOYED AND
        NOT RUN. Exists because water and magma breach has
        NO DFHack event and NO announcement type at all, a checked negative,
        so flood response was covered by nothing.
        CORRECTS THE RESEARCH BRIEF THAT COMMISSIONED IT: df.global.world.flows
        does not exist under that name, and flow_info/flow_type is an
        airborne-cloud record (miasma, steam, mist, smoke, fire, web), not a
        liquid-volume signal. Independently re-verified on this machine
        2026-09-12: zero hits for world.flows anywhere in the installed
        build's shipped Lua. The real per-tile signal is
        block.designation[x%16][y%16].flow_size (0-7) and .liquid_type, plus
        block.flags.update_liquid, all confirmed in this install's own
        spawn-liquid.lua, deep-embark.lua, extinguish.lua and exterminate.lua.
        DESIGN: two stage, because the Sentry polls this every few seconds.
        Stage 1 reads one bool per map block (flags.update_liquid) across the
        map's fixed block count, so its cost does NOT grow with dig progress.
        Stage 2 scans only flagged blocks' 256 tiles. Severity comes from a
        RISE against a session-scoped _G baseline, so a well's static water
        alarms once on baseline-seed and never again, and escalates on
        adjacency to the citizen walkable network and on magma.
        THE LOAD-BEARING RISK, stated plainly: every observed use of
        flags.update_liquid in the shipped scripts SETS it; nothing reads it.
        Whether DF's own simulation raises it during natural, unassisted
        liquid movement is UNVERIFIED, and if it does not, stage 1 never
        trips and this tool silently detects nothing. That is the first thing
        a live-verification session must settle.
        Known blind spot by design: a breach already rising at the moment of
        the first ever call, or right after a DFHack restart since _G does not
        survive one, is silently baselined and reported as severity none for
        that poll.
      summary: "Checks for a rising water or magma breach near the fort."
      guide:
        arguments:
          - name: "RADIUS_TILES"
            required: false
            default: null
            meaning: >-
              How far from a landmark to search, in tiles. Clamped to a hard cap of 60 tiles
              server-side regardless of the value passed.
        returns: >-
          The game gives no event or announcement for a flood at all, so this is the only signal for
          one; it works by watching for a rise in liquid level against a baseline set the first time
          it runs, so a breach already rising at that first call, or right after a restart, reads as
          no alarm for that one check. Severity increases with proximity to the fort's walkable area
          and for magma.
        before_a_real_run: []
        traps: []
