df-overseer-nobles.lua:
  build_order_item: "the user's minimum bar for openclaw (appoint a Manager and other nobles); handoffs/2026-09-21-nobles-appoint.md"
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name.
  arg_defaults: {DRY_RUN: "true", VERSION: "with_event"}
  commands:
    list:
      lua_function: list
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused: all 12 positions of the fortress entity)"
      knowledge_scope: player_visible
      notes: >
        Every position of the fortress entity: code, name, assignment id and
        index, holder unit id or vacant, whether it is elected, its population
        requirement and whether that is met, and the office it needs. The
        Nobles screen shows all of this to a player. A holder that cannot be
        read is null plus an error, never a default.
      summary: "Lists every noble position of the fortress, its holder (or vacant), and whether its population requirement is met."
      guide:
        arguments: []
        returns: >-
          Everything here is also visible on the game's own Nobles screen.
        before_a_real_run: []
        traps: []
    "verify POSITION_CODE":
      lua_function: verify
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103: vacant, held, and after appoint and unappoint)"
      knowledge_scope: player_visible
      notes: >
        Read-only consistency check for one position, from both sides: the
        assignment's holder, the holder's position link and its vector index,
        and dfhack.units.getNoblePositions. consistent is true only if every
        check passes. Since 2026-10-08 it also requires the game's cached
        indexes (the link's entity_vector_idx equals the entity's index in
        world.entities.all; the assignment's position_vector_idx equals the
        position's index in positions.own): getNoblePositions searches by id
        and cannot see them, which is how an appointment the Work Orders
        screen rejected read as consistent. position_add_event_found is
        informational.
      summary: "Checks that an appointment is internally consistent from both sides (the position's own holder link and the unit's own position link)."
      guide:
        arguments:
          - name: "POSITION_CODE"
            required: true
            default: null
            meaning: >-
              The code of a fortress position exactly as nobles.list shows it, for example MANAGER,
              BOOKKEEPER or BROKER. An unknown code is an error that lists the known ones.
        returns: >-
          This checks the appointment mechanism itself, not whether the position's actual
          requirements (an office, a room) are met; use nobles.requirements for that.
        before_a_real_run: []
        traps: []
    "requirements POSITION_CODE":
      lua_function: requirements
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        Added handoffs/2026-09-23-position-requirements-check.md. Every
        requirement field research/2026-09-23-room-and-zone-requirements.md
        found on df.entity_position, per assignment slot of this code: the
        four room-value fields (required_office, _bedroom, _dining,
        _tomb) each reported met / not_met / cannot_tell (never a number:
        DFHack exposes no numeric room value anywhere, only
        dfhack.buildings.getRoomDescription's quality word), and the four
        furniture-count fields (required_boxes, _cabinets, _racks,
        _stands), each always cannot_tell (nothing in DFHack's API or this
        game's own exposed data says whether they are satisfied). A
        room-value status is met only when at least one zone of the needed
        kind, owned by the holder, reads back a nonempty quality word;
        not_met ONLY with evidence independent of the description (the
        holder owns no such zone at all, or every owned zone contains none
        of the furniture kinds ZONE_POLICY lists for the kind, read by the
        same helper as `zone contents`); cannot_tell when the position is
        vacant, its holder cannot be resolved to a live unit, a read itself
        failed, or the description was EMPTY while the zone does contain
        qualifying furniture (never collapsed into not_met).
        CORRECTED 2026-09-24 (handoffs/2026-09-24-room-proxy-fix.md): an
        earlier version called an empty description not_met, and
        getRoomDescription returned empty on the Manager's owned, furnished
        office that the game's own nobles screen accepted, so empty is no
        evidence of a bad room; the game's nobles screen is the arbiter
        for cannot_tell. Deliberately
        a separate verb from verify, not folded into it: verify checks
        whether an appointment is internally consistent (histfig links,
        getNoblePositions) and never read a single requirement field, which
        is exactly how this fort's Manager read as "set up" with no working
        Office. Offline-built; the deploy and the live check against
        MANAGER on this fort (must now report the Office cannot_tell, never
        not_met, while the chair stands in the owned zone) are both owed.
      summary: "Checks whether a noble position's room requirements (office, bedroom, dining, tomb) are met."
      guide:
        arguments:
          - name: "POSITION_CODE"
            required: true
            default: null
            meaning: >-
              The code of a fortress position exactly as nobles.list shows it, for example MANAGER,
              BOOKKEEPER or BROKER. An unknown code is an error that lists the known ones.
        returns: >-
          Each room requirement is reported as met, not_met or cannot_tell, never a bare number,
          since the game exposes no numeric room value anywhere. not_met is only ever reported with
          independent evidence (no zone of the right kind owned, or an owned zone missing its
          defining furniture); an empty room-quality read on its own is cannot_tell, never assumed
          bad. Furniture-count requirements (boxes, cabinets, racks, stands) are always cannot_tell,
          since nothing in the game's exposed data says whether they are satisfied.
        before_a_real_run: []
        traps:
          - >-
            An empty room description on its own is never, by itself, not_met; it is cannot_tell
            unless the read genuinely failed. Do not treat a quiet or missing field as a failed
            requirement.
    "appoint POSITION_CODE UNIT_ID [DRY_RUN] [VERSION]":
      lua_function: appoint
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, minimal version: unit 345 appointed MANAGER, verified from both sides, unappointed and re-appointed)"
      knowledge_scope: player_visible
      notes: >
        Appoints a living adult citizen to a vacant position, as a player does
        on the Nobles screen. DRY_RUN defaults to true; only the word false
        writes. Refuses, with a named reason, an unknown code, an elected
        position, an unmet population requirement, a position already held,
        and a unit that is missing, dead, not a citizen, not an adult or has
        no historical figure. CORRECTED 2026-10-08: the original recipe
        (DFHack's make-monarch: ids only) made an appointment that
        nobles.verify called consistent and that the Work Orders screen did
        not accept ("must assign a manager"). The game's own Nobles screen
        also sets two cached indexes (the holder link's entity_vector_idx,
        the assignment's position_vector_idx) and writes an
        ADD_HF_ENTITY_LINK history event; appoint now writes all of them
        (VERSION with_event, the default; minimal skips only the event)
        (evals/live/2026-10-08-manager-appointment/README.md). The Manager
        also needs an office (nobles.requirements).
      summary: "Appoints a citizen to a vacant noble position."
      guide:
        arguments:
