df-overseer-workjob.lua:
  build_order_item: "handoffs/2026-09-19-workshop-add-job.md -- the honest alternative to a stalled manager order: a direct workshop job, no Manager needed, per handoffs/2026-09-19-well-and-harvest.md section 6 and handoffs/2026-09-19-well-finish.md sections 2-4. GENERALISED handoffs/2026-09-21-workjob-generalise.md (dispatched 2026-09-23): the job vocabulary is now read live from DFHack's own workshops.getJobs, not a hand-maintained table -- see the .lua file's own header for the full coverage measurement and field-mapping citations."
  # Documented defaults (each the value the Lua script already uses when the
  # argument is omitted), used by dfmcp/tools.py to fill a slot an agent
  # skipped while naming a later optional argument by name.
  arg_defaults: {DRY_RUN: "true", REPEAT: "false", COUNT: "1"}
  commands:
    list:
      lua_function: list_jobs
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-19 (deployed to VM 103, hash-verified, and loads and runs live: handoffs/2026-09-19-deploy-batch.md, decisions/DECISIONS.md 2026-09-19). UNCHANGED by the 2026-09-23 generalisation -- still returns exactly the three legacy tokens (see list-jobs below for the generic, per-workshop listing)."
      knowledge_scope: player_visible
      notes: >
        Deliberately left as-is by handoffs/2026-09-21-workjob-generalise.md:
        the three legacy short tokens only (blocks/mechanisms/brew_drink), so
        an existing no-arg caller keeps working byte-for-byte. For every real
        job a named workshop actually offers, from DFHack's own
        workshops.getJobs, use `list-jobs WORKSHOP_LANDMARK_NAME` below.
      summary: "Lists three legacy job shortcuts (blocks, mechanisms, brew_drink) that can be queued directly at a workshop."
      guide:
        arguments: []
        returns: >-
          Kept unchanged for backward compatibility; use workjob.list-jobs for the full, per-
          workshop job list.
        before_a_real_run: []
        traps: []
    "list-jobs WORKSHOP_LANDMARK_NAME":
      lua_function: list_workshop_jobs
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: "2026-09-23, dry-run/read-only live (handoffs/2026-09-21-workjob-generalise.md report): called against this fort's three real workshops (Still, Stoneworker's Workshop/Masons, Mechanic's Workshop/Mechanics), fort paused throughout, tick unchanged. See the handoff's own report section for exact quoted output. NOT yet deployed to VM 103 as the live tool (this stream is offline-build + read-only-live-verification only, per its own hard lines)."
      knowledge_scope: player_visible
      notes: >
        NEW handoffs/2026-09-21-workjob-generalise.md deliverable 1. Every
        job DFHack's own workshops.getJobs offers at the named workshop or
        furnace (hard-coded job definitions PLUS every reaction the raws
        attach to that specific building), each with a token to pass to
        `queue`, its display name, and an items summary (item type if
        concrete, quantity, mat_type/mat_index, class-filter flags, plus a
        six-deduction availability read for any concrete item, REUSING
        df-overseer-stocks.lua's own get_availability rather than
        re-deriving it). A job whose only reagent is a wildcard/tag match
        (item_type still -1 after defaults merge) is still LISTED here
        (list-jobs never refuses), but `queue` will refuse it -- listing
        and queuing have different honesty contracts by design, matching
        the project's existing stocks/building tools. Coverage measured
        live this stream, not estimated: 28 of 33 workshop_type+furnace_type
        kinds on this install return at least one real job from getJobs;
        5 do not (Bowyers, Clothiers, Kennels, Tool workshop; Custom
        furnace at the wildcard scan) -- see the .lua file's own header for
        the full breakdown and the exact probe used. Any field this tool
        could not read is named in `read_failures`, also relayed via
        `dfhack.printerr`, never silently defaulted (docs/TRAPS.md's
        pcall-degrades-to-false entry).
      summary: "Lists every job a named workshop or furnace can actually be given, read live from the game's own job definitions for that building."
      guide:
        arguments:
          - name: "WORKSHOP_LANDMARK_NAME"
            required: true
            default: null
            meaning: >-
              The workshop's landmark name, as landmarks.list gives it.
        returns: >-
          Each job's listing includes its token (to pass to workjob.queue), a display name, and what
          it needs, including live stock counts.
        before_a_real_run:
          - >-
            Never refuses, even for a job whose reagent is a wildcard the game would need a specific
            item choice for; workjob.queue is the one that enforces that.
        traps: []
    "queue JOB WORKSHOP_LANDMARK_NAME [DRY_RUN] [REPEAT] [COUNT] [REAGENT_CHOICE...]":
      lua_function: queue_job
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-19 (live: blocks and a mechanism were queued for real and the well was built from them; brew_drink refuses on the container reagent by design; handoffs/2026-09-19-stone-blocks-well.md, register 2026-09-19), still true after the 2026-09-23 generalisation -- the generic path was cross-checked to reproduce the old blocks job_item spec field-for-field (see the .lua file's own header) before this rewrite, and the three legacy tokens still resolve through LEGACY_ALIASES. REPEAT param added 2026-09-23 (handoffs/2026-09-23-order-job-attribution-and-checks.md item 6) and COUNT param added by the same-numbered later stream (handoffs/2026-09-21-workjob-generalise.md); both remain UNTESTED live -- see that command's own note."
      knowledge_scope: player_visible
      notes: >
        GENERALISED 2026-09-23 (handoffs/2026-09-21-workjob-generalise.md,
        dispatched that day): JOB is no longer looked up in a hand-maintained
        table. It is resolved against the NAMED workshop's own real
        `workshops.getJobs` output, either as a generic token (a job_type
        name lowercased, e.g. "constructthrone", or "reaction:<code>"
        lowercased for a CustomReaction job, e.g. "reaction:make_mead") or
        as one of the three legacy short aliases kept working unchanged:
        blocks (ConstructBlocks), mechanisms (ConstructMechanisms),
        brew_drink (CustomReaction BREW_DRINK_FROM_PLANT). A job not offered
        at the named workshop is refused by name, listing what that
        workshop DOES offer, rather than a fixed "wrong kind" message.
        DRY_RUN defaults to true. Refuses explicitly on: an unknown JOB
        (not offered at this workshop), an unknown workshop landmark, a
        landmark that is not a workshop or furnace, a workshop still under
        construction (`bld.flags.exists` false), a full job queue
        (`#bld.jobs >= 10`, dfhack.job.assignToWorkshop's own documented
        cap), a COUNT that would push the queue over that cap, and any job
        whose item resolves to a wildcard/tag-matched item_type (refusing
        rather than guessing which concrete item to reserve). Never sets
        `status.validated` and never touches
        `df.global.world.manager_orders.all` -- a wholly separate route
        from df-overseer-orders.lua's queue, not a patch on it. Every
        result carries `read_failures` (also relayed via `dfhack.printerr`
        when non-empty) naming any spec field this tool could not read,
        per docs/TRAPS.md's pcall-degrades-to-false entry -- this file reads
        reagents and job definitions off live raws, exactly that bug's
        surface. The real `dfhack.job.createLinked`/`assignToWorkshop`
        mutation path is UNTESTED live this stream either; only list-jobs
        and queue's dry-run path were exercised against VM 103 (read-only,
        per the handoff's hard lines) -- see the handoff's own report
        section for the exact supervised test this owes, including COUNT
        and REPEAT together. **REAL FINDING, still not fixed here
        (dfmcp/tools.py is not a touched surface this stream either)**: if
        driven through the MCP server rather than the raw CLI,
        `dfmcp/tools.py`'s own `_SHELL_METACHAR_RE` refuses any argument
        containing a literal apostrophe -- and this fort's actual Mason's
        Workshop is named "Stoneworker's Workshop". See
        dfmcp/tests/test_workjob_tool.py's own
        `test_apostrophed_workshop_names_are_refused_by_the_mcp_layer`.
        REAGENT_CHOICE (2026-09-25, handoffs/2026-09-25-tool-gaps-from-first-cycle.md
        item 1) resolves a wildcard reagent, e.g. the empty food storage
        container every brew reaction carries: words `N:ITEM_ID` or `N:auto`,
        N the 1-based reagent number list-jobs shows (with the free candidate
        items it found). Without a choice the call still refuses, now naming
        the argument that would resolve it and the candidates. The candidate
        rules are data in the .lua (per-flag checks); a flag it cannot verify
        is refused, never guessed. OFFLINE-VERIFIED ONLY (fake-world Lua
        tests): the live item flags, the job_item narrowing and the game
        accepting the resulting brew job need a live check after deploy.
        COUNT is appended as a NEW fifth positional argument, after REPEAT,
        so the first four positions (JOB, WORKSHOP_LANDMARK_NAME, DRY_RUN,
        REPEAT) are unchanged for any existing caller; a real queue reports
        both `job_id` (the first job, for back-compat) and `job_ids` (all
        of them).
      summary: "Queues a job directly at a named workshop, bypassing the Manager entirely."
      guide:
        arguments:
          - name: "JOB"
            required: true
            default: null
            meaning: >-
              The job's raw reaction or job-type name, as workjob.list-jobs shows for that workshop.
          - name: "WORKSHOP_LANDMARK_NAME"
            required: true
            default: null
            meaning: >-
              The workshop's landmark name, as landmarks.list gives it.
          - name: "DRY_RUN"
            required: false
            default: "true"
            meaning: >-
              true (the default) only reports what would change; only the exact word false makes the
              change.
          - name: "REPEAT"
            required: false
            default: "false"
            meaning: >-
              Optional. true makes the job repeat until cancelled instead of running once.
          - name: "COUNT"
            required: false
            default: "1"
            meaning: >-
              Optional. How many times to run the job (ignored when REPEAT is true).
          - name: "REAGENT_CHOICE..."
            required: false
            default: null
            meaning: >-
              Optional, repeatable. Resolves a reagent the job matches by tag rather than by item
              type (for example the empty food storage container every brewing job needs). Each word
              is N:ITEM_ID (use that free item) or N:auto (take the lowest-id free candidate), N
              being the 1-based reagent number workjob.list-jobs shows for that job, which also
              lists the free candidates. Nothing is created: it can only pick an existing free item.
              Without a choice such a job is refused, and the refusal names the exact words to pass.
        returns: >-
          This is a separate route from orders.create: it never touches the manager order queue.
        before_a_real_run:
          - >-
            Refuses by name: a job not offered at this workshop, an unfinished workshop, a job queue
            already at the game's 10-job cap, or a reagent that needs a choice none was given for.
          - >-
            A workshop name containing an apostrophe (common for a Stoneworker's Workshop style
            name) is currently refused when called through the MCP layer; use the raw CLI for those.
        traps:
          - >-
            A workshop name containing an apostrophe can be cut short at the MCP transport layer
            before it reaches the tool; if a call using a landmark name with an apostrophe fails to
            match, try the name without it.
    unsupplied:
      lua_function: unsupplied_buildings
      effect: read
      coordinate_bearing: false
      live_deployed: false
      verified: "unverified (offline build, lupa-tested against a fake world only, handoffs/2026-10-07-unsupplied-building-watch.md, 2026-10-07). The product-name rule and buildingplan's isPlannedBuilding/job_items fields are a live check."
      knowledge_scope: player_visible
      notes: >
        Read-only. For every item kind a buildingplan-planned building is
        still waiting on (job_items elements with a concrete item_type and
        quantity left), one row: how many planned buildings and units need it,
        how many are free (`available`, the same six-deduction read as
        stocks.availability; omitted when that read failed), which jobs at
        BUILT workshops and furnaces make it (`producers`: job, reaction code
        if any, workshop kind), and how many live workshop jobs make it right
        now (`jobs_queued_now`). Manager orders are not read here; join
        orders.list (its `job` and `reaction`) against `producers`. The
        conductor's unsupplied-building watch (conductor/unsupplied_watch.py)
        is the caller. A hard-coded job's product is taken from its name (the
        job_type name minus its leading verb, e.g. ConstructBed gives BED,
        plus a short alias list in the .lua file); a reaction job's products
        are read from the reaction itself. A job whose product cannot be named
        is not matched. Wildcard material filters (item_type -1) are skipped,
        they name no kind. No coordinates.
      summary: "Lists item kinds that planned buildings are waiting on, with free stock and the jobs and workshops that could make each."
      guide:
        arguments: []
        returns: >-
          unsupplied: one row per waiting item kind (item, buildings_waiting, units_needed, available,
          producers, jobs_queued_now); read_failures names any read that failed.
        before_a_real_run: []
        traps:
          - >-
            A kind with no row is not necessarily supplied: only kinds a planned building names
            concretely are listed.
    "cancel JOB_ID [DRY_RUN]":
      lua_function: cancel_job
      effect: mutate
      coordinate_bearing: false
      live_deployed: true
      verified: unverified
      knowledge_scope: player_visible
      notes: >
        Added handoffs/2026-09-23-order-job-attribution-and-checks.md item 5.
        Cancels a direct job by id (`dfhack.job.removeJob`), refusing any job
        with no resolvable workshop-building holder or whose holder is not a
