df-overseer-building.lua:
  build_order_item: "the user's minimum bar for openclaw (build workshops, rooms, furniture); docs/BUILDING-TOOL.md, handoffs/2026-09-21-building-tool-lua.md"
  commands:
    "list-kinds [FILTER]":
      lua_function: list_kinds
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a /tmp script path, fort paused; 175 kinds listed, no token collisions. After the deploy the same day, over a real MCP client as the overseer: filter Still returned the one Still row and a filter matching nothing returned [])"
      knowledge_scope: player_visible
      notes: >
        Lists every building kind quickfort can place, read at run time
        from quickfort's own table (reached through Lua upvalues, see the
        .lua header for the choice and what a DFHack update would break).
        Each row: token (the name to pass as KIND), key (quickfort's own
        key, also accepted), label (display only, never pass it), type,
        subtype, min and max footprint, and whether the size is fixed.
        FILTER is an optional case-insensitive substring of token, label or
        type (Workshop, Furnace, Bed, Bridge). An unmatched FILTER gives an
        empty list; a table that cannot be read gives an error object, never
        an empty list.
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_kind
      skippable: ["[W H]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused, read only: workshop, furnace, 1x1 and 5x5 kinds, furniture, variable-size kinds and error cases. After the deploy the same day, over a real MCP client as the overseer: Masons, Still, Smelter, Kiln, Bed, Well and FarmPlot each returned five sites, and the unknown kind, near-miss name, wrong footprint, missing W H and unknown landmark cases each errored with a named reason)"
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one building kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (or
        quickfort's own key such as wl), never a display label. [W H] is an
        optional pair: give both or neither. Leave them out and the tool
        uses the kind's own footprint, read from the game (3x3 for every
        workshop, furnace and siege engine except Kennels, Siege and
        TradeDepot at 5x5 and Quern, Millstone and SCREW_PRESS at 1x1;
        list-kinds shows each), so a caller never needs to know a fixed-size
        kind's size. Pass W and H only for a variable-size kind (farm plots,
        roads, bridges), any size inside min..max; a size that is not the
        kind's own for a fixed-size kind is an error. The pair can be left
        out while LEVEL is given: the Lua CLI reads one leading number as
        LEVEL and two as W H (hence `skippable`). A site
        qualifies when every footprint tile is revealed, building-free and
        passes the kind's own quickfort tile rule (beds indoors, doors beside
        a wall, farm plots on soil), with a walkable tile in or beside it.
        Each result carries `requirements` (what the game says the kind needs
        to be built, from dfhack.buildings.getFiltersByType, with stock
        counts from the six-deduction availability read; counts are by item
        type only, the filter's own flags are not applied), a plain `gaps`
        list of what is short (report only, it never refuses a build), and a
        `search` block of how many tiles were checked. No site gives an
        error object that says how many tiles were checked and eligible, so
        "nothing here" can be told apart from a broken check. Result shape is
        contract C1 of docs/BUILDING-TOOL.md. No labor names and no
        confidence level: the MCP layer adds those.
    "build KIND [W H] [LEVEL] NEAR_LANDMARK [RANK] [RADIUS_TILES] [DRY_RUN]":
      lua_function: build_kind
      skippable: ["[W H]"]
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-21 (DRY_RUN path only, live on VM 103: quickfort's own --dry-run validated the generated blueprint for workshop, furnace, furniture and variable-size kinds, first through a /tmp script path and again after the deploy over a real MCP client as the overseer for Masons, Kiln, Craftsdwarfs, Smelter, Bed and FarmPlot 5x5; the real path is UNTESTED live)"
      knowledge_scope: player_derivable
      notes: >
        Places one building of KIND at the RANK-th site near a landmark.
        DRY_RUN defaults to true; only an explicit "false" builds. A dry run
        resolves the site, generates the blueprint in code (no per-kind
        files), and asks quickfort to validate it with --dry-run under
        `validation` (ok is true only when a building would be designated and
        no problem counter is above zero; quickfort itself reports success
        even when it designated nothing, verified by a negative control).
        Its only side effect is a scratch blueprint file on the guest,
        removed straight after. The real path runs the blueprint, reports
        quickfort_ok/quickfort_error/quickfort_stats, and reads the tile
        back (`read_back`) because quickfort can succeed without a building.
        NEVER RUN LIVE for any kind yet: the first real build of a kind this
        project has not built before needs the user's go-ahead. Same
        requirements, gaps, search and site fields as find. Footprint rules
        as in find.

df-overseer-zone.lua:
  build_order_item: "gap named 2026-09-17 (handoffs/2026-09-17-water-and-industry-tools.md item 1); generalised over every zone kind and given an optional owner by handoffs/2026-09-21-zone-tool-generalise.md"
  commands:
    "list-kinds [FILTER]":
      lua_function: list_kinds
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a scratch script path, fort paused; deployed and called over a real MCP client the same day; 18 kinds listed, no token collisions, FILTER office gave one row, an unmatched FILTER gave [])"
      knowledge_scope: player_visible
      notes: >
        Lists every zone kind quickfort can place, read at run time from
        quickfort's own table (reached through Lua upvalues, see the .lua
        header; a DFHack update that renames a hop gives an error naming it,
        never an empty list). The install has 18 kinds, not the 17 the
        handoff counted. Each row: token (the game's civzone_type name, the
        name to pass as KIND), key (quickfort's own letter, also accepted),
        label (display only), finder (`rectangle`, or `water_body` for
        WaterSource), min and max size (max is the string "unbounded" for
        every zone), default_dims, owner_capable, room_value_field (which
        position field asks this kind for a room value, or null),
        prefer_indoors, caveat and policy_source ("ZONE_POLICY entry" or
        "default (no entry)"). Scope: the zone menu a player already sees.
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_zone_area
      skippable: ["[W H]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (deployed to VM 103 the same day, hash-verified; the checks below ran through a scratch script path before the deploy and were not repeated after it. Live on VM 103, fort paused, read only: Office, Bedroom, DiningHall with and without W H, level -1, and error cases; WaterSource returned the same five bodies as the deployed water-only tool, plus a `token` field)"
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one zone kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (the old
        `water_source` still works). [W H] is an optional pair: give both or
        neither; leave them out and the kind's default size is used
        (list-kinds shows it; the defaults are this project's choice, not game
        data). One bare number is read as LEVEL and two as W H, hence
        `skippable`. Rectangle kinds: every tile of the window must be
        revealed, pass quickfort's own tile rule for the kind, carry no
        building or liquid, be walkable, sit in one walkable group and not
        already be zoned with the same type. Kinds marked prefer_indoors list
        fully indoor windows first (`indoors` on each result; the tile's
        `outside` flag). Each result carries `search` (tiles checked,
        eligible, and why others were rejected, so "nothing here" can be told
        apart from a broken check), and `requirements.room_value` for room
        kinds: the positions whose data asks for a value from this kind
        (`required_office`, `_bedroom`, `_dining`, `_tomb`), whether each is
        held and by whom, and a plain statement that what counts toward the
        value is not exposed by the game (an external, older-version wiki
        account is included and marked unverified). A `caveat` says when a
        kind needs terrain this tool does not check. WaterSource keeps its
        own finder (connected revealed water bodies, W H refused) and its old
        output.
    "check-owner KIND OWNER":
      lua_function: check_owner
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused, read only, before the deploy through a scratch script path and after it over a real MCP client, where Office MANAGER returned the preserve-rooms mechanism and holder unit 345: MANAGER (held by unit 345), SHERIFF (vacant), MAYOR (group with EXPEDITION_LEADER, held by unit 198), a unit id, and refusals for an unknown code, a dead unit, a non-citizen, a missing unit, a kind that cannot have an owner and a malformed token)"
      knowledge_scope: player_visible
      notes: >
        Would OWNER be accepted for this kind, and what would it mean right
        now? Runs the same checks `place` runs before it touches anything.
        OWNER is either a unit id (all digits, `dfhack.buildings.setOwner`,
        the vanilla equivalent of choosing the owner on the room's screen) or
        a position code such as MANAGER (the preserve-rooms plugin's
        `assignToRole`: the room follows whoever holds the role; a vacant role
        leaves it reserved and suspended). Refuses with a named reason: an
        unknown code (lists the known ones), a unit that does not exist, is
        dead or is not a citizen, a kind that cannot have an owner (only
        Bedroom, DiningHall, Office and Tomb), or a malformed token. Reads
        the Nobles screen's data (positions and holders) and nothing hidden.
    "place KIND [W H] [LEVEL] NEAR_LANDMARK [RANK] [RADIUS_TILES] [DRY_RUN] [OWNER]":
      lua_function: place_zone
      skippable: ["[W H]"]
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-21 (deployed to VM 103 the same day, hash-verified, and not called after the deploy. DRY_RUN run live on VM 103 by the orchestrator from a scratch script path, fort paused and unchanged at tick 106974: Office with owner MANAGER gave quickfort validation ok with 1 zone and 9 tiles designated; Bedroom, Dining Hall and Water Source dry runs returned well-formed results, but their validation blocks were not read. The real placement, the read-back and both owner assignments have never been run: see handoffs/2026-09-21-zone-tool-generalise.md)"
      knowledge_scope: player_derivable
      notes: >
        Places one zone of KIND at the RANK-th site near a landmark. DRY_RUN
        defaults to true; only an explicit "false" places. Rectangle kinds: a
        dry run resolves the site, generates a `#zone` blueprint in code (no
        per-kind files), and asks quickfort to validate it with --dry-run
        under `validation` (ok only when a zone would be designated and no
        problem counter is above zero), removing the scratch file after. A
        real run reads the zone back (`read_back`: found, type, id and the
        game's room description) and reports quickfort's own statistics.
        WaterSource keeps its old behaviour exactly (a dry run reports the
        body and `would_zone_tiles`, no quickfort). OWNER (last argument, so
        RANK RADIUS_TILES and DRY_RUN must be given before it) assigns the
        new zone: a unit id or a position code, validated as in check-owner
        before anything is touched. quickfort's own dry run stops before it
        assigns, so a dry run proves the owner checks but not the
        assignment; a real run reads assigned_unit_id and the game's getOwner
        back under `owner_result`. NEVER RUN FOR REAL yet: the first real
        placement needs the user's go-ahead.

