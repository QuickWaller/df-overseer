df-overseer-building.lua:
  build_order_item: "the user's minimum bar for openclaw (build workshops, rooms, furniture); docs/BUILDING-TOOL.md, handoffs/2026-09-21-building-tool-lua.md"
  commands:
    "list-kinds [FILTER]":
      lua_function: list_kinds
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103 through a /tmp script path, fort paused; 175 kinds listed, no token collisions. After the deploy the same day, over a real MCP client as the overseer: filter Still returned the one Still row and a filter matching nothing returned [])"
      knowledge_scope: player_visible
      notes: >
        Lists every building kind quickfort can place, read at run time
        from quickfort's own table (reached through Lua upvalues, see the
        .lua header for the choice and what a DFHack update would break).
        Each row: token (the name to pass as KIND), key (quickfort's own
        key, also accepted), label (display only, never pass it), type,
        subtype, min and max footprint, and whether the size is fixed.
        FILTER is an optional case-insensitive substring of token, label or
        type (Workshop, Furnace, Bed, Bridge). An unmatched FILTER gives an
        empty list; a table that cannot be read gives an error object, never
        an empty list.
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES]":
      lua_function: find_kind
      skippable: ["[W H]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused, read only: workshop, furnace, 1x1 and 5x5 kinds, furniture, variable-size kinds and error cases. After the deploy the same day, over a real MCP client as the overseer: Masons, Still, Smelter, Kiln, Bed, Well and FarmPlot each returned five sites, and the unknown kind, near-miss name, wrong footprint, missing W H and unknown landmark cases each errored with a named reason)"
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one building kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (or
        quickfort's own key such as wl), never a display label. [W H] is an
        optional pair: give both or neither. Leave them out and the tool
        uses the kind's own footprint, read from the game (3x3 for every
        workshop, furnace and siege engine except Kennels, Siege and
        TradeDepot at 5x5 and Quern, Millstone and SCREW_PRESS at 1x1;
        list-kinds shows each), so a caller never needs to know a fixed-size
        kind's size. Pass W and H only for a variable-size kind (farm plots,
        roads, bridges), any size inside min..max; a size that is not the
        kind's own for a fixed-size kind is an error. The pair can be left
        out while LEVEL is given: the Lua CLI reads one leading number as
        LEVEL and two as W H (hence `skippable`). A site
        qualifies when every footprint tile is revealed, building-free and
        passes the kind's own quickfort tile rule (beds indoors, doors beside
        a wall, farm plots on soil), with a walkable tile in or beside it.
        Each result carries `requirements` (what the game says the kind needs
        to be built, from dfhack.buildings.getFiltersByType, with stock
        counts from the six-deduction availability read; counts are by item
        type only, the filter's own flags are not applied), a plain `gaps`
        list of what is short (report only, it never refuses a build), and a
        `search` block of how many tiles were checked. No site gives an
        error object that says how many tiles were checked and eligible, so
        "nothing here" can be told apart from a broken check. Result shape is
        contract C1 of docs/BUILDING-TOOL.md. No labor names and no
        confidence level: the MCP layer adds those.
    "build KIND [W H] [LEVEL] NEAR_LANDMARK [RANK] [RADIUS_TILES] [DRY_RUN]":
      lua_function: build_kind
      skippable: ["[W H]"]
      effect: mutate
      coordinate_bearing: internal-only
      live_deployed: true
      verified: "2026-09-21 (DRY_RUN path only, live on VM 103: quickfort's own --dry-run validated the generated blueprint for workshop, furnace, furniture and variable-size kinds, first through a /tmp script path and again after the deploy over a real MCP client as the overseer for Masons, Kiln, Craftsdwarfs, Smelter, Bed and FarmPlot 5x5). REAL PATH FIRST EXERCISED 2026-09-23 (evals/live/2026-09-23-office-and-first-real-build/README.md): `building.build Chair Well 1 20 false` against the same site the dry run validated -- quickfort_ok:true, quickfort_problems:[], read_back confirmed building_found:true and type_matches:true. This is the first real, non-dry-run build of any kind this tool has ever made. Not yet a complete loop: the Chair sits buildingplan-suspended (stocks CHAIR read 0 before and after; the job is stuckjobs-visible as waiting_on:\"suspended\"), since the fort owns no Chair item yet; a manager order (ConstructThrone) was created to try to supply one and had not gone active after 900 ticks"
      knowledge_scope: player_derivable
      notes: >
        Places one building of KIND at the RANK-th site near a landmark.
        DRY_RUN defaults to true; only an explicit "false" builds. A dry run
        resolves the site, generates the blueprint in code (no per-kind
        files), and asks quickfort to validate it with --dry-run under
        `validation` (ok is true only when a building would be designated and
        no problem counter is above zero; quickfort itself reports success
        even when it designated nothing, verified by a negative control).
        Its only side effect is a scratch blueprint file on the guest,
        removed straight after. The real path runs the blueprint, reports
        quickfort_ok/quickfort_error/quickfort_stats, and reads the tile
        back (`read_back`) because quickfort can succeed without a building.
        NEVER RUN LIVE for any kind yet: the first real build of a kind this
        project has not built before needs the user's go-ahead. Same
        requirements, gaps, search and site fields as find. Footprint rules
        as in find.

