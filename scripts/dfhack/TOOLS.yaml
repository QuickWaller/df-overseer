        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md):
        each row also carries `furniture_kinds` (the building.list-kinds
        tokens `find`'s AROUND_FURNITURE flag will accept for this kind, `[]`
        for a kind with none). Offline addition, not re-deployed or
        re-verified live this stream.
    "find KIND [W H] [LEVEL] NEAR_LANDMARK [RADIUS_TILES] [AROUND_FURNITURE]":
      lua_function: find_zone_area
      skippable: ["[W H]", "[RADIUS_TILES]"]
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (deployed to VM 103 the same day, hash-verified; the checks below ran through a scratch script path before the deploy and were not repeated after it. Live on VM 103, fort paused, read only: Office, Bedroom, DiningHall with and without W H, level -1, and error cases; WaterSource returned the same five bodies as the deployed water-only tool, plus a `token` field). AROUND_FURNITURE offline build only 2026-09-23, not deployed and not live-verified (handoffs/2026-09-23-zone-inventory-and-validity.md)."
      knowledge_scope: player_derivable
      notes: >
        Finds up to five non-overlapping sites for one zone kind near a
        landmark, ranked by distance. KIND is a token from list-kinds (the old
        `water_source` still works). [W H] is an optional pair: give both or
        neither; leave them out and the kind's default size is used
        (list-kinds shows it; the defaults are this project's choice, not game
        data). One bare number is read as LEVEL and two as W H, hence
        `skippable`. Rectangle kinds: every tile of the window must be
        revealed, pass quickfort's own tile rule for the kind, carry no
        building or liquid (unless AROUND_FURNITURE admits it, below), be
        walkable, sit in one walkable group and not already be zoned with the
        same type. Kinds marked prefer_indoors list fully indoor windows first
        (`indoors` on each result; the tile's `outside` flag). Each result
        carries `search` (tiles checked, eligible, and why others were
        rejected, so "nothing here" can be told apart from a broken check),
        and `requirements.room_value` for room kinds: the positions whose data
        asks for a value from this kind (`required_office`, `_bedroom`,
        `_dining`, `_tomb`), whether each is held and by whom, and a plain
        statement that what counts toward the value is not exposed by the
        game (an external, older-version wiki account is included and marked
        unverified). A `caveat` says when a kind needs terrain this tool does
        not check. WaterSource keeps its own finder (connected revealed water
        bodies, W H refused) and its old output.
        ADDED 2026-09-23 (handoffs/2026-09-23-zone-inventory-and-validity.md
        item 3): AROUND_FURNITURE (default false, RADIUS_TILES now
        `skippable` too so it can be given without W H/LEVEL) admits a tile
        occupied by one of the kind's own ZONE_POLICY `furniture_kinds`
        (Office:Chair, Bedroom:Bed, DiningHall:Table, Tomb:Coffin) instead of
        rejecting it as occupied; every other occupied tile is still
        rejected. Each result then carries `contains_qualifying_furniture`
        and `furniture_building_ids` (never a coordinate), and
        `furniture_kinds_checked` names which kinds were looked for. A kind
        with no furniture_kinds entry refuses the flag by name rather than
        silently ignoring it. `place` is unchanged: no new argument, still
        rejects every occupied tile -- this is `find`'s own capability.
        Offline build only, not deployed or live-verified this stream.
        RANKING FIXED 2026-09-24 (handoffs/2026-09-24-furniture-aware-
        ranking.md): a live 3x3 Office search found every returned site
        furniture-free because the old distance-only sort let a merely
        closer, empty window get chosen first, and the overlap filter that
        enforces non-overlapping results then discarded the furniture-
        containing window as it overlapped that pick. A site containing the
        kind's qualifying furniture now sorts above one that does not
        (existing indoor/distance ranking is the tiebreak within each
        group), so it cannot be overlapped away. Only takes effect when
        AROUND_FURNITURE is true; a plain find's ranking is unchanged. When
        AROUND_FURNITURE is true the whole response is also now
        `{results: [...], any_contains_furniture: bool, furniture_note:
        "..." (present only when false)}` instead of a bare array, so a
        caller learns "no candidate has it" without scanning every row. A
        plain find (no AROUND_FURNITURE) still returns the bare array.
        Offline build only, not deployed or live-verified this stream.
    "check-owner KIND OWNER":
      lua_function: check_owner
      effect: read
      coordinate_bearing: false
      live_deployed: true
      verified: "2026-09-21 (live on VM 103, fort paused, read only, before the deploy through a scratch script path and after it over a real MCP client, where Office MANAGER returned the preserve-rooms mechanism and holder unit 345: MANAGER (held by unit 345), SHERIFF (vacant), MAYOR (group with EXPEDITION_LEADER, held by unit 198), a unit id, and refusals for an unknown code, a dead unit, a non-citizen, a missing unit, a kind that cannot have an owner and a malformed token)"
      knowledge_scope: player_visible
      notes: >
        Would OWNER be accepted for this kind, and what would it mean right
        now? Runs the same checks `place` runs before it touches anything.
        OWNER is either a unit id (all digits, `dfhack.buildings.setOwner`,
        the vanilla equivalent of choosing the owner on the room's screen) or
        a position code such as MANAGER (the preserve-rooms plugin's
        `assignToRole`: the room follows whoever holds the role; a vacant role
