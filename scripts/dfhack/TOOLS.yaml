          - name: "H"
            required: false
            default: null
            meaning: >-
              Height in tiles of the zone. Optional; give both W and H or neither. Leave both out
              for the kind's default size (zone.list-kinds shows it). Refused for WaterSource and FishingArea,
              whose shape follows the shore.
          - name: "LEVEL"
            required: false
            default: "0"
            meaning: >-
              An offset relative to NEAR_LANDMARK's own level, NOT an absolute DF map coordinate: 0
              (the default when omitted) is the landmark's own level, -1 is one level below it, 1 is
              one level above it. A level below the dug-out fort returns nothing until something
              walkable exists there, v1 only returns candidates that border the existing walkable
              network.
          - name: "NEAR_LANDMARK"
            required: true
            default: null
            meaning: >-
