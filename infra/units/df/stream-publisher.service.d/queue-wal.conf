[Service]
# The queue DB is SQLite WAL: even a mode=ro reader must create its -shm file
# beside it, so the directory needs write access. The publisher still opens
# the database itself with mode=ro (dfqueue/feed.py load_records_readonly).
ReadOnlyPaths=
ReadOnlyPaths=/opt/df/dfmcp-smoke
ReadWritePaths=/var/lib/dfmcp
