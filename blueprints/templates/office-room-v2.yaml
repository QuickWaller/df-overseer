# Template metadata for blueprints/templates/office-room-v2.csv.
# Format defined in blueprints/README.md, "Template library format" section.

id: office-room
revision: 2
kind: office
status: designed          # designed | applied-live | verified-live (see README)
generic: true              # no fort coordinates, no landmark names, per docs/PURPOSE.md #1

quickfort_file: office-room-v2.csv

dimensions:
  footprint: { width: 5, depth: 5 }   # includes the wall ring
  interior: { width: 3, depth: 3 }    # usable floor, matches the #zone footprint

edges:
  north: { role: own, shared: false }
  east:  { role: own, shared: false }
  west:  { role: own, shared: false }
  south:
    role: entrance
    shared: false
    entrance:
      width: 1
      position: middle       # the single gap tile, column 3 of row 5
      feature: none

walls:
  intent: finished
  material: unspecified
  resolution: >-
    "Finished" is declared once per wall tile, never as a material. This csv
    resolves every ring tile as smooth (#dig, "s"), correct only when the
    tile is standing natural rock. A standing soil wall cannot take a
    constructed wall in one blueprint (research/2026-09-24-quickfort-hands.md);
    the blueprint verb reports such tiles instead of leaving them rough.

floor:
  intent: smoothed
  phase: office_room_v2_floor   # apply after the interior dig, before any furniture
  note: >-
    Added in revision 2. Revision 1 smoothed only the wall ring, so its floor
    stayed rough; furniture blocks smoothing, so this phase must precede the
    build phase.

supersedes: office-room-v1

requires:
  - chair
