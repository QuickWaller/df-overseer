- id: water-source-zone-for-ponds
  scope: universal
  status: refuted
  topics: [water, drink]
  sources:
    - kind: live-read
      ref: >-
        Uniboslan supervised test, 2026-09-17 (correlational, not isolated)
      describes: "53.16"
      read: opened
      accessed: 2026-09-17
    - kind: user
      ref: own play, the same fix used before this fort
      describes: unknown
      read: recalled
      accessed: 2026-09-17
    - kind: live-read
      ref: >-
        Uniboslan, two exact tick/thirst reads (tick 227160 thirst 23,391;
        tick 233463 thirst 29,694), all 15 citizens
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    A fort whose only water is a sunken pond may have dwarves that never
    drink. Marking the water itself as a Water Source zone, on the level the
    water is on, got dwarves down to the water and drinking within about four
    game days. Place the zone on the water, not on the open space above it.
  note: >-
    Refuted 2026-09-19, kept so the mistake is not remade. The 2026-09-17
    read that this entry was built on was itself flagged correlational, not
    isolated, and the correlation did not hold up: measured across two exact
    reads at Uniboslan, delta tick equalled delta thirst exactly (6,303 =
    6,303) across all 15 citizens, meaning zero drinks occurred in that
    window, while the zone still read active
    (`spec_sub_flag.active = true`). The zone being active proves nothing
    about reachability. This install's pond is a sunken basin: at the
    water's own z-level (z168) all 27 wet tiles have zero walkable
    neighbours, so no dwarf can path adjacent to the water to drink from it.
    Whatever produced the three founders' apparent self-serve drinking on
    2026-09-17 was not the zone reliably solving this pond; that reading is
    superseded. The replacement rules are water-source-needs-walkable-
    neighbour, sunken-basin-recognition and do-not-dig-into-full-basin below.
    Risks noted at the time still stand as a caution for a pond that IS
    reachable: dwarves would stand in 6-7/7 water, deep enough to drown a
    poor swimmer, and stagnant water gives a NastyWater thought whose health
    effect is unverified. A well avoids both, and is now the fort's own
    plan (Working.md, "The fort cannot drink, and the pond cannot be dug
    to").

- id: water-source-needs-walkable-neighbour
  scope: universal
  status: prior
  topics: [water, drink]
  sources:
    - kind: live-read
      ref: >-
        Uniboslan tile-shape read, z168 (142 WALL, 26 RAMP, 1 FLOOR, 0
        walkable; 27 wet tiles, 0 with a walkable neighbour) and z169 (134
        walkable, 100 FLOOR, 26 RAMP_TOP, 0 wet)
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
    - kind: live-read
      ref: >-
        Uniboslan, two exact tick/thirst reads (tick 227160 thirst 23,391;
        tick 233463 thirst 29,694), all 15 citizens
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    A `WaterSource` zone reading `spec_sub_flag.active = true` says only that
    the zone exists on water; it says nothing about whether any dwarf can
    reach that water. Reachability needs a walkable tile adjacent to the
    water at the water's own z-level. Check tile shapes at the water's
    z-level before placing a zone, not after: if every wet tile there has
    zero walkable neighbours, no dwarf can path to it regardless of the
    zone.
  note: >-
    What this proves: at Uniboslan, the zone was active, all 27 wet tiles at
    z168 had zero walkable neighbours, and thirst_timer rose in exact
    lockstep with tick across all 15 citizens over a 6,303-tick window, so
    zero drinks happened in that window. That supports the necessary
    direction (no walkable neighbour, no drinking observed) at this one
    site. It does not prove the converse, that a walkable neighbour is
    sufficient for drinking to happen: no reachable-water case was measured
    this way for comparison. It also does not establish this as a general
    DF mechanic beyond this install; the underlying idea (a unit must be
    able to stand adjacent to a tile to interact with it) is ordinary
    pathing logic, not something this project verified from source.

    Status downgraded from `verified` to `prior` by the orchestrator on
    2026-09-19: the measurements cited are real and stand, but the statement
    is `scope: universal` while the evidence is one pond at one site, and
    this entry's own note says it does not establish a general DF mechanic.
    A universal claim marked verified on single-site evidence is the exact
    pattern this project keeps catching itself in. The Uniboslan measurement
    is not in doubt; its generality is.

- id: sunken-basin-recognition
  scope: universal
  status: prior
  topics: [water, drink]
  sources:
    - kind: live-read
      ref: >-
        Uniboslan tile-shape read, z168 (142 WALL, 26 RAMP, 1 FLOOR, 0
        walkable; 27 wet tiles) and z169 (134 walkable, 100 FLOOR, 26
        RAMP_TOP, 0 wet)
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    Recognise a sunken basin before trying to fix it: at the water's own
    z-level, every wet tile's shape is WALL or RAMP (no FLOOR), the walkable
    count at that level is 0, and the z-level directly above has walkable
    floor with zero wet tiles. That shape means the pond is a submerged bowl
    ringed by wall with dry ground only one level up. Treat it as a well
    case from the start, not a digging case: see
    do-not-dig-into-full-basin.
  note: >-
    Measured for Uniboslan's one pond only. The tile-shape signature
    (WALL/RAMP wet tiles, 0 walkable at the water level, walkable dry floor
    one z above) is what was actually read there; this entry does not claim
    every sunken-looking pond elsewhere reproduces this exact signature,
    only that this is what to check for and what it looked like here.

    Status downgraded from `verified` to `prior` by the orchestrator on
    2026-09-19, for the same reason as `water-source-needs-walkable-
    neighbour`: one basin observed, universal claim stated. The tile-shape
    signature is real at Uniboslan and untested anywhere else.

- id: do-not-dig-into-full-basin
  scope: universal
  status: prior
  topics: [water, drink]
  sources:
    - kind: live-read
      ref: >-
        Uniboslan, one supervised unpause: Channel designated at z169 on a
        FLOOR tile with 3 walkable neighbours, above a waterline wall,
        adjacent to 6/7 water. Before: z168 wet 27, walkable 0. After: z168
        wet 28, walkable 0.
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    Opening a tile immediately adjacent to a full body of water at the
    water's own z-level does not create a standing spot there; the newly
    opened tile fills with water and becomes wet, not walkable. Do not dig a
    channel or ramp directly into a full basin to make a place to stand at
    water level. If a basin has no walkable neighbour tile (see
    sunken-basin-recognition), the remedy is a well, which draws water
    upward from a dry tile above, not a dig at the water's own level.
  note: >-
    What this proves: one channel dig, at one site, into one full basin,
    produced more water and no new walkable tile (wet 27 to 28, walkable
    unchanged at 0). It does not prove no dig anywhere could ever reach this
    basin or one like it, for example a stairway or a differently shaped cut
    landing beside the water rather than opening straight into it was not
    tried. It only establishes that this specific approach (open the tile
    that touches the water, at the water's level) fails, and fails by
    becoming more water rather than by simply not completing.

    Status downgraded from `verified` to `prior` by the orchestrator on
    2026-09-19. This one rests on **a single dig of a single shape**, and
    the stream that wrote it said so plainly in its own report: only one dig
    shape was tested, so no conclusion follows about digs in general. The
    observation (channel dug, wet 27 to 28, walkable still 0) is exact and
    stands as evidence; the universal prohibition does not follow from it
    yet.

- id: do-not-overfish
  scope: universal
  status: prior
  topics: [fishing, food]
  sources:
    - kind: devlog
      ref: Bay 12 dev log, 2013-11-09 (Toady One)
      describes: "0.40.01"
      read: opened
      accessed: 2026-09-17
    - kind: bugtracker
      ref: >-
        Bug 2780, "Pond/pool populations (e.g. pond turtles) do not replenish,
        gradually become extinct"; read on the dwarffortressbugtracker.com
        mirror because the Bay 12 tracker returned a database error
      describes: "0.31.08 to 0.40.xx"
      read: opened
      accessed: 2026-09-17
    - kind: wiki
      ref: >-
        Fishing_industry ("now renewable, unlike in the past"), sentence added
        2014-08-22, carried into the v50 namespace unchanged
      describes: "0.40.xx"
      read: opened
      accessed: 2026-09-17
    - kind: wiki
      ref: >-
        Fisherdwarf (Fishing redirects here): permanent-depletion passage
        re-added 2024-03-11 by an anonymous editor, edit summary "still
        applies to current version of DF"
      describes: v50 (asserted, unsourced)
      read: opened
      accessed: 2026-09-17
    - kind: user
      ref: own forts
      describes: 2014 to 2026, versions unrecorded
      read: recalled
      accessed: 2026-09-17
    - kind: forum
      ref: Steam Community discussion threads
      describes: unknown
      read: search-summary
      accessed: 2026-09-17
  statement: >-
    Assume flowing water (rivers, brooks) restocks and still water (ponds,
    pools) may not. Do not plan a fort's food around pond fish; fishing a river
    or brook is not a known risk. Nobody gives a restock rate or a catch
    threshold, so there is no number to police, only a choice of water.
  note: >-
    The case, weakest link first. Toady's dev log for 0.40 made animal
    populations "restore themselves slowly (including the local populations
    in fort mode)", which is the fix. Bug 2780 was then resolved on
    2014-07-24 and reopened on 2014-08-07 after a player fished a pond for
    five in-game years without recovery; that pond held only turtles, and the
    manager's comment was "it could be that only river populations were
    fixed". The bug is still open. The wiki's "now renewable" line is another
    player's claim, added two weeks after the reopening. The 2024 anonymous
    wiki edit and the user's own memory (ponds empty for good, rivers fine)
    both point the same way as the open bug. None of this is game source or
    patch notes, so confidence is moderate.
    History: on 2026-09-17 this entry said overfishing "may not be a real
    risk at all", leaning on the "now renewable" line and on a cavern fish
    record reading quantity 399 over quantity_max 395. Both leaned the wrong
    way: the line is contradicted by the bug it cites, and quantity_max is
    not shown to be a ceiling, so exceeding it is not evidence of
    regeneration. What would settle it: a pond's own population record read
    before and after sustained fishing, which first needs the record found
    (see uniboslan-pool-fish-unknown).

