# Seed doctrine: game knowledge for the agents, not repo decisions.
#
# The doctrine tier from docs/MEMORY-ARCHITECTURE.md, which is designed but not
# built: there is no get_doctrine tool yet and no agent reads this file. It is
# a holding place so game knowledge stops landing in decisions/DECISIONS.md.
#
# Fields
#   id       stable; referenced from the register and other entries
#   scope    universal (Dwarf Fortress itself) | world | site (dies with the fort)
#   status   prior    - received knowledge, not yet confirmed by this project's play
#            verified - confirmed from this install's game data or live state
#            refuted  - kept so the mistake is not remade
#   topics   what get_doctrine will index on: one or more of
#            food, drink, water, farming, seeds, fishing, labor, health,
#            material (added 2026-09-18 for goods-management policy that is
#            not about one specific consumable: band vocabulary, cover-target
#            margins, wear/clothing, durability classification)
#   sources  one item per source, never a single blob:
#     kind      live-read | game-data | devlog | bugtracker | wiki | forum |
#               user | research (a repo research doc, which carries its own
#               citations)
#     ref       what exactly: page, bug number, file, struct, command
#     describes the game version the source is about, as stated or as dated.
#               This install is 53.16 (DFHack 53.16-r1.1). "unknown" is
#               allowed and is a warning, not a pass.
#     read      opened (the text itself was read) | search-summary (only a
#               search engine's summary was seen) | recalled (someone's memory)
#               | unrecorded (the entry predates provenance tracking)
#     accessed  date the source was read, where known
#   statement  the rule itself
#   note       open questions, risks, what would settle it
#
# Rule: `verified` needs at least one live-read or game-data source that
# describes 53.16. Wiki, forum and user sources can make a prior, never a
# verification (MEMORY-ARCHITECTURE, "the wiki produces hypotheses, not
# doctrine"; its version-namespace trap is why `describes` exists).
# Provenance format adopted 2026-09-17 after the fishing entries were built on
# undated, unopened sources (decisions/DECISIONS.md, same date).

- id: plump-helmet-use
  scope: universal
  status: prior
  topics: [food, drink, farming]
  sources:
    - kind: user
      ref: own play
      describes: unknown
      read: recalled
      accessed: 2026-09-17
  statement: >-
    Plump helmets feed and water the fort. Send the harvest to both the still
    (drink) and the kitchen (cooked meals). Never let dwarves eat them raw.

