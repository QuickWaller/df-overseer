    - kind: wiki
      ref: Embark (default supplies)
      describes: v50
      read: opened
      accessed: 2026-09-17
  statement: >-
    Whether Uniboslan's swamp pools hold any fish at all is unknown. The eight
    surface fish populations read at this fort's world region (longnose gar,
    sturgeon, char, perch, brook lamprey, salmon, shad, sailfin molly) all sit
    at quantity equal to quantity_max, but every one has feature_idx 0, and
    by df-structures a population with feature_idx other than -1 belongs to
    one local map feature, not the region. That feature is most plausibly the
    world river that clips this region without reaching the local map, so
    these records likely say nothing about the pools. Their discovered=false
    does not show that nobody fished: region-pops documents the flag as what
    "your civilization knows about".
  note: >-
    Solid, separately: the fort's 10 FISH (flags.foreign) match the default
    embark ration minus one eaten stack, and FISH_RAW is 0, so no catch has
    ever been processed. Open: the one NOTHING_TO_CATCH_IN_WATER ("central
    swamps", year 30 tick 19990, a pool tile at z168) is unexplained; the
    only citizen with Fishing is founder unit 196 (FISHERMAN, skill 5), and
    nothing read says whether that skill came from embark or from fishing.
    Next step: read feature index 0's type in
    world_data.feature_map at this region (attempted 2026-09-17, the
    indexing was wrong), then look for a population record tied to the
    pools. Formerly `uniboslan-fishing-untouched`, which overclaimed.

