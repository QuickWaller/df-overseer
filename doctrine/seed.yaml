# ---- Material policy, from docs/PRODUCTION-MODEL.md (2026-09-18) --------
# The production model moved every target out of code into doctrine so a par
# level or a cover margin can be argued with rather than sitting buried in a
# constant. These six entries are that move's first content. All `prior`:
# policy judgements and community figures, never game facts this project can
# confirm live, so none of them may be `verified` regardless of how solid
# the underlying source is (decisions/handoffs/2026-09-18-doctrine-material-
# policy.md, the stream's own hard rule).

- id: material-policy-bands
  scope: universal
  status: prior
  topics: [material]
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §10, "Material policy: bands, held in
        doctrine"
      describes: unknown
      read: opened
      accessed: 2026-09-18
  statement: >-
    Material policy is bands on one quantity axis, not a weighted objective:
    a weight vector trading dwarf-time against barrels against seeds gives a
    different answer from identical data and is unreviewable, targets are.
    Bands, low to high: below the reserve floor is a hard stop that
    overrides even survival; floor to par is kept on hand and produced
    toward, par may be per-capita; par to the cover target is working stock,
    expressed in days for consumed goods; above the cover target is surplus,
    and doctrine says whether that is discretionary value or a liability to
    dispose of. Class is a property of intended use, not of the item: stone
    below the block reserve is a resource, the same stone above it is
    clutter occupying tiles that drink needs, which is why bands beat fixed
    item categories. Bands are lexicographic, not weighted, so no cost
    vector is needed for a cross-class decision; a seed floor is never
    traded off against a crafts surplus. Derived demand gets no cover target
    of its own: charcoal is needed only if smelting is planned, so it is
    netted from that plan instead. Give a derived good a cover target and
    the fort stockpiles fuel for a furnace nobody built.
  note: >-
    Reference entry: later doctrine entries (buckets, migration headroom,
    the seed/breeding-pair reserve, clothing wear, durability) are instances
    of these band shapes and should cite this entry rather than restate the
    vocabulary. The full shape table (irreplaceable reserve, consumed, keep
    on hand, insurance, capital, discretionary, liability) and the
    reservation rule ("available for discretionary work equals stock minus
    reserve floor, minus par, minus consumption commitment, minus
    job-claimed") live in docs/PRODUCTION-MODEL.md §10 itself and are not
    restated here, to avoid two copies drifting apart. Worth recording that the
    band model was not invented from nothing: seed-stock-never-falls (a hard
    floor, never run out of seed) and dispose-of-surplus-seed (surplus seed is
    not harmless clutter to keep forever) already described a floor and a
    surplus band for the same good, written earlier and without the
    vocabulary. The bands named here generalise what those two were already
    doing.

