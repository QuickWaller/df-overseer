        the orchestrating session, not this offline stream, and relayed
        here: 5 buckets total. Three (item ids 81, 149, 150) are fort-owned,
        empty, not forbidden, not job-claimed, no holder. Two (1680, 1788)
        are trader=true, held by the visiting caravan's own pack yaks, not
        the fort's stock. The "1 of 15 citizens unconscious" figure traced
        to a sleeping miner (unconscious=2, pain=0, wounds=0,
        current_job=Sleep), not an injury
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
    - kind: user
      ref: >-
        recollection of the v50 hospital-zone reserved-item mechanic,
        carried into docs/PRODUCTION-MODEL.md §12 without its own citation
      describes: unknown
      read: recalled
      accessed: 2026-09-18
  statement: >-
    Buckets are an Insurance-band good (a level held against a threat model,
    reviewable only after the threat fires), not a Consumed or Keep-on-hand
    good: hold a par level of at least two, permanently, and never let it
    draw down to zero even when nothing is currently drinking from one.
    Enable the water-carrying labor on more than one dwarf; a single point
    of failure here is worth guarding against regardless of current
    urgency. Placement: near the route, not at the water itself. Uniboslan's
    ponds sit one level below the surface and are likely open to the sky, so
    a bucket left at the waterside is exposed to theft by wildlife; a store
    inside the secured area on the way down gives the same travel saving
    without that exposure. **Existence is not availability**: checking "does
    the fort own a bucket" is not the same question as "can a dwarf get one
    right now", and doctrine should check the second. Three deductions can
    hide stock that raw counts show as present: job-claimed
    (item.flags.in_job, exact and cheap to read), forbidden, and
    caravan-owned (a visiting trader's own animals and goods read as
    present-on-site but are never the fort's). A par-level check that counts
    raw item totals without subtracting all three will read "fine" when a
    dwarf can still fail to get water. The remaining internal-theft risk is
    another fort job claiming the bucket before the water-carrying job
    reaches it; DF's own answer is the hospital zone, which reserves its own
    supplies. Record that as prior and flag it as needing verification,
    since it is recollection of v50 mechanics that nothing in this project
    has tested.
  note: >-
    Corrected 2026-09-18: this entry's first draft, and the handoff that
    requested it, both stated the fort owned no bucket and that a citizen
    was at risk from thirst. Both were wrong. A live re-read after dispatch
    found three fort-owned buckets, empty and unclaimed, and found the
    "unconscious" citizen to be a sleeping miner, not an injury or a medical
    emergency. The honest justification is the more useful one anyway: with
    three buckets sitting available, the fort's own Give Water job still
    cancelled with "Need empty bucket" at tick 214135, which is exactly the
    available-versus-total distinction docs/PRODUCTION-MODEL.md §7 names,
    demonstrated live rather than asserted. Left open: why that job failed
    to find any of the three at that moment (reachability? a race with
    another job that released its claim afterward? a stale read?) is not
    settled by anything read so far, and would need a live trace of that
    specific job to explain rather than this doctrine's par-level guidance,
    which stands regardless of the answer. Whether the hospital-zone
    reservation still behaves as recalled in 53.16 is a separate open
    question; settling either needs a live test this offline stream cannot
    run. Extends bedridden-need-water-brought (pre-dating this
    entry, prior, same topics), which already said a resting dwarf does not
    fetch its own drink and an empty bucket must be kept available. This entry
    adds the par level, the labour redundancy, the placement rule and the
    existence-versus-availability check; it does not replace it. Corrected again 2026-09-18,
    later the same day: the labour clause is already satisfied. The labour is
    FEED_WATER_CIVILIANS (code 23), enabled on all 15 citizens, verified live.
    An earlier reading of zero came from a probe looking up
    FEED_WATER_WOUNDED, which is not a real token on this install and which
    the probe could not distinguish from a genuine zero. So this entry's
    guidance stands as policy but names no current shortfall, and the
    tick-214135 cancellation is unexplained by either buckets or labour:
    reachability at that moment is the remaining candidate. Medical labours
    here are DIAGNOSE 18, SURGERY 19, RECOVER_WOUNDED 24, each on one
    citizen; BIND_WOUND and DRESS_WOUNDS are not real tokens either.

- id: cover-target-migration-headroom
  scope: universal
  status: prior
  topics: [material, food, drink]
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §3 (Q4 table: "migration ... never a
        formula term") and §15 ("Migration headroom | Q4, must not enter a
        formula | never as code; a stated margin in doctrine")
      describes: unknown
      read: opened
      accessed: 2026-09-18
    - kind: wiki
      ref: >-
        Migrant, version banner "v53.16 · v0.47.05" at the page top; wave
        size and wealth/population-cap passages
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
  statement: >-
    Cover targets for consumed goods (food, drink, and any future consumed
    class) carry a stated margin above bare per-dwarf demand, and the reason
    is recorded here so nobody later "corrects" the padding as arbitrary:
    migration waves are exogenous and can be large relative to a small fort,
    and population is Q4 (docs/PRODUCTION-MODEL.md §3), so it must never
    enter a live formula computing the margin. The wiki's current Migrant
    page grounds the margin's size in real numbers rather than an invented
    one: each of the first two migrant waves is capped between 1 and 10
    arrivals; the third wave on scales with the fort's created wealth; wave
    size is then capped down as local population rises (limited to 10 from a
    local population of 1000) until migrants stop entirely at a local
    population of 3000; and wave size also depends on how far the fort sits
    below its population cap. Doctrinal judgement, stated as such: pad every
    consumed-good cover target by at least 50% above bare demand at the
    fort's current population. On a 15-citizen fort such as Uniboslan, a
    single wave capped at 10 is nearly two-thirds of the current census, so
    50% is a floor, not a comfortable margin. Express cover in dwarf-days,
    not days, so a population jump rescales the target automatically without
    the formula itself ever reading population; the 50% margin is a
    doctrine constant to revise by hand whenever the census changes
    materially, never a computed term.
  note: >-
    The 50% figure is this entry's own judgement call, not a cited number;
    flagged here exactly so it reads as a judgement rather than a
    derivation. The wiki page's wave-size numbers describe the general
    mechanic, not this specific fort's wealth level, so they bound the
    problem rather than predict Uniboslan's next wave.

- id: irreplaceable-reserve-inherited-by-future-classes
  scope: universal
  status: prior
  topics: [seeds, material]
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §10 (shape table row "Irreplaceable reserve
        (seeds, breeding pairs) | hard floor | never, the point is that
        nothing happens") and §15 ("Animals | demand is measured anyway, and
        breeding pairs inherit the reserve band automatically | the fort's
        first livestock")
      describes: unknown
      read: opened
      accessed: 2026-09-18
  statement: >-
    The irreplaceable-reserve band that seed-stock-never-falls establishes
    for seeds (a hard floor overriding even survival, because zero is
    unrecoverable without a caravan) is a property of the band shape, not of
    seeds specifically: anything whose loss is similarly unrecoverable
    inherits the same treatment automatically, with no new policy entry
    required to cover it. The design names the first concrete case: a
    future breeding pair. When the fort acquires its first livestock, the
    pair's hard floor exists the moment the shape applies to it, not after
    someone remembers to write a rule for animals.
  note: >-
    Read alongside seed-stock-never-falls, which this entry generalises
    rather than replaces. Nothing yet forces this to be exercised: Uniboslan
    owns no livestock as of the 2026-09-17 handover, so this is a standing
    rule with no live case yet.

- id: clothing-wear-parked-with-trigger
  scope: universal
  status: prior
  topics: [material]
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §15, parked table row "Wear and clothing |
        takes ~2 years to bite; this fort is in year 1 | the first tattered
        item, or year 2"
      describes: unknown
      read: opened
      accessed: 2026-09-18
    - kind: wiki
      ref: >-
        Clothing, version banner "v53.16"; wear-rate and storage passages
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
  statement: >-
    Clothing wear is a Liability-band concern, with a real unhappiness cost
    once a garment reads tattered, but it is genuinely slow and safe to park
    while Uniboslan is in its first year. Parked with the trigger written
    down rather than left as an unstated "later": revisit at the first item
    that reads tattered (X or XX wear; lowercase x does not trigger the
    negative thought), or at the start of year two, whichever comes first.
    Method, so this is not rediscovered from scratch: count the state (the
    item's own wear symbol), do not model the rate, the same approach
    doctrine takes for food and drink durability. This corrects the design
    doc's own stated reason rather than just repeating it: the current wiki
    page says a worn item gains one wear level every ten years, not two
    ("This is a change from previous versions, where worn clothing gained
    one level of wear every two years"), and properly stored clothing
    degrades far slower still, about a century in a stockpile or personal
    quarters, or twenty years under DFHack. Reaching "tattered" needs more
    than one wear level on top of that. So the real time-to-bite is at least
    a decade, not two years; the design's year-2 trigger is still a fine,
    deliberately early conservative check, just not literally when damage
    starts.
  note: >-
    The wiki does not state how many wear levels reach X versus XX, so the
    exact time to the unhappy thought stays unpinned beyond "at least ten
    years while worn, likely more". Not worth chasing further while this
    stays parked; revisit if the trigger ever fires for real. Flagged for
    the orchestrator: docs/PRODUCTION-MODEL.md §15's "~2 years" figure
    should probably be corrected there too, since it is now the stale
    pre-change number rather than this install's behaviour.

- id: durability-splits-cover-target
  scope: universal
  status: prior
  topics: [material, food, drink]
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §11, "Spoilage without a decay constant":
        classify durability (Q1), use the rot flags df-overseer-stocks.lua
        already reports as the live check, cover splits into durable
        (barrelled drink, prepared meals) and perishable (raw edibles,
        especially outside)
      describes: unknown
      read: opened
      accessed: 2026-09-18
    - kind: research
      ref: >-
        research/2026-09-18-schema-extraction-static.md §6: [ROTS]
        raw-confirmed present on STRUCTURAL_PLANT_TEMPLATE (raw harvested
        plant matter) and confirmed absent, full block read, from
        PLANT_ALCOHOL_TEMPLATE (drink) and PLANT_POWDER_TEMPLATE (milled
        powder), against material_template_default.txt on this install
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
  statement: >-
    Days of cover for food and drink should be reported split, not blended:
    durable stock (barrelled drink, prepared meals) versus perishable stock
    (raw edibles, especially anything sitting outside a container).
    "Eleven days of cover, of which three are raw edibles already flagged
    rotten" is honest in a way one blended number cannot be. The split is a
    doctrinal classification, not a derived one, because the raws only
    carry a rot token ([ROTS]) on the material template, never on an item
    or plant definition directly, and the static schema audit raw-confirmed
    it present on raw harvested plant matter (STRUCTURAL_PLANT_TEMPLATE) and
    absent on both the drink template (PLANT_ALCOHOL_TEMPLATE) and the
    milled-powder template (PLANT_POWDER_TEMPLATE) for this install. That
    settles drink and powder as durable by raw definition; everything else
    needs this doctrine's classification plus a live rot-flag read (already
    surfaced by df-overseer-stocks.lua) as the actual per-item check, since
    no single token gives spoilage as a rate.
  note: >-
    Prepared meals are asserted durable by the design doc's own framing
    (barrelled or contained, akin to drink), but this entry has not
    independently traced a rot token for cooked-meal items the way it has
    for drink and powder. Flagged as the one unconfirmed half of the
    statement rather than silently folded in with the confirmed half.

- id: cover-target-not-yet-settable
  scope: universal
  status: prior
  topics:
    - material
    - food
    - drink
  sources:
    - kind: research
      ref: >-
        docs/PRODUCTION-MODEL.md §11: growdur reads 300 for
        MUSHROOM_HELMET_PLUMP while live grow_counter values on real plants
        sit in the tens of thousands (18480, 18481, 18482 on consecutive
        instances, 21036 on another), so the two are not the same unit and
        the candidate conversions give a quarter of a day, two and a half
        days, or 250 days
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
    - kind: research
      ref: >-
        production/cover.py: resupply_lead_time_days returns unavailable
        unconditionally, verified by an independent call handing it the real
        growdur=300 and grow_counter=18480 figures, which still refused
      describes: "53.16"
      read: opened
      accessed: 2026-09-18
  statement: >-
    A cover target is not a number to be picked. It is derived: cover must
    exceed the time to resupply, plus the migration margin from
    cover-target-migration-headroom, or the fort starves before more food can
    arrive. That makes the target a function of resupply lead time, and
    resupply lead time for a crop is currently not computable on this install,
    because the unit relating growdur to grow_counter is unsettled. Therefore
    **no cover target is set here, deliberately, and none should be invented
    elsewhere.** A calculator asked for a verdict without a target must report
    that no target exists rather than defaulting to one, exactly as
    production/cover.py already refuses to convert the lead time itself. The
    rule to apply once the unit is settled: target equals measured resupply
    lead time in dwarf-days, times one plus the migration margin, and a
    reserve floor set below it at the point where acting later would no longer
    leave time to act at all.
  note: >-
    Written because a build stream correctly flagged that the band vocabulary
    exists with no day-count behind it, and asked whether to invent one. The
    answer is no, and the reason is worth keeping: a fabricated target would
    be the same failure the calculator was deliberately built to refuse one
    layer up, and it would be quoted back later as though it had been
    measured. This project has already had an illustrative figure (an
    invented "11 days" in a draft of the spec) come back as apparent data
    within a day. The one observation that unblocks this is cheap: read a
    planted crop's grow_counter at two known ticks and watch when it becomes
    harvestable.

- id: brewing-chain-from-raws
  scope: universal
  status: verified
  topics: [drink, food, material]
  sources:
    - kind: game-data
      ref: >-
        data/vanilla/vanilla_reactions/objects/reaction_other.txt lines
        265-281, REACTION:BREW_DRINK_FROM_PLANT, pulled read-only from VM 103
        on 2026-09-19 and read in full
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    Brewing on this install is one plant plus one container, giving **five
    drinks and one seed**. The reaction is `BREW_DRINK_FROM_PLANT` at the
    STILL, skill BREWING. The plant reagent must carry
    `HAS_MATERIAL_REACTION_PRODUCT:DRINK_MAT` and must be `UNROTTEN`. The
    container reagent is `EMPTY` plus `FOOD_STORAGE_CONTAINER`, described in
    the raws as "barrel or any non-absorbing tool with FOOD_STORAGE", so **it
    need not be a wooden barrel**: a rock pot qualifies. The container carries
    `PRESERVE_REAGENT`, so it is occupied rather than consumed, and is freed
    when the drink is drunk rather than when brewing finishes. Products are
    `5 DRINK` (with `PRODUCT_TO_CONTAINER` and `PRODUCT_DIMENSION:150`) and
    `1 SEEDS`.
  note: >-
    Two consequences worth acting on. **Brewing returns a seed**, so it does
    not draw down seed stock the way cooking does, which makes it strictly
    preferable to cooking under `seed-stock-never-falls` and
    `never-cook-seed-items`. And the **five-to-one yield** means a small plant
    stock goes much further than a raw count suggests: eight plants is up to
    forty drinks, not eight. This entry records the reaction only. Whether a
    brewed drink satisfies thirst is a separate claim and is **not** verified
    here; see `alcohol-is-not-food`, which is still `prior` on an unrecorded
    wiki read.

- id: plump-helmet-is-brewable
  scope: universal
  status: verified
  topics: [drink, food, farming]
  sources:
    - kind: game-data
      ref: >-
        data/vanilla/vanilla_plants/objects/plant_standard.txt, the
        MUSHROOM_HELMET_PLUMP block, line 13:
        [MATERIAL_REACTION_PRODUCT:DRINK_MAT:LOCAL_PLANT_MAT:DRINK], and line
        14 the matching SEED_MAT
      describes: "53.16"
      read: opened
      accessed: 2026-09-19
  statement: >-
    Plump helmet carries `MATERIAL_REACTION_PRODUCT:DRINK_MAT`, so it
    satisfies the one reagent condition `BREW_DRINK_FROM_PLANT` imposes on its
    plant, and is brewable on this install. It also carries `SEED_MAT`, which
    is what the reaction's seed product resolves through.
  note: >-
    Checked because the brew route for Uniboslan's thirst crisis rests
    entirely on it and it was one grep. This is the specific condition that
    could have failed silently: a plant without `DRINK_MAT` is simply not a
    valid reagent, and the failure would have shown up as a job that never
    starts rather than as an error. Recorded so the next reader does not have
    to re-derive it. See `brewing-chain-from-raws`.

- id: brew-before-plants-run-out
  scope: universal
  status: prior
  topics: [drink, food]
  sources:
    - kind: user
      ref: >-
        The user, 2026-09-19, on Uniboslan's drink position: "they need
        drinks ready before the plants go"
      describes: unknown
      read: opened
      accessed: 2026-09-19
  statement: >-
    Keep a drink stock brewed ahead of need, rather than brewing only once
    the fort is already thirsty and the plant stock is nearly spent.
  note: >-
    Recorded as the user stated it, deliberately not sharpened into a
    number: no cover target exists yet (`cover-target-not-yet-settable`),
    because the harvest clock is not computable. What makes the rule bite
    on this install is `brewing-chain-from-raws`: one plant brews to five
    drinks and returns a seed, so a plant lost to rot before brewing costs
    five drinks. What eating a plant raw yields (and whether it returns a
    seed) is **not checked here** and should not be assumed either way; an
    earlier draft of this note asserted "no seed" without evidence and was
    corrected before commit.
