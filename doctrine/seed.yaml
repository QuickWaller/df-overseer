# Seed doctrine: game knowledge for the agents, not repo decisions.
#
# The doctrine tier from docs/MEMORY-ARCHITECTURE.md, which is designed but not
# built: there is no get_doctrine tool yet and no agent reads this file. It is
# a holding place so game knowledge stops landing in decisions/DECISIONS.md.
#
# scope:  universal (Dwarf Fortress itself) | world | site (dies with the fort)
# status: prior     - received knowledge (the user as an experienced player,
#                     or the wiki), not yet confirmed by this project's play
#         verified  - confirmed from this install's game data or live state
#         refuted   - kept so the mistake is not remade
# Wiki claims are hypotheses, never doctrine on their own (MEMORY-ARCHITECTURE,
# "the wiki produces hypotheses, not doctrine").

- id: plump-helmet-use
  scope: universal
  status: prior
  source: user, 2026-09-17
  statement: >-
    Plump helmets feed and water the fort. Send the harvest to both the still
    (drink) and the kitchen (cooked meals). Never let dwarves eat them raw.

- id: never-cook-seed-items
  scope: universal
  status: verified
  source: user, 2026-09-17; plotinfo.kitchen read live on Uniboslan
  statement: >-
    Never cook the seed items themselves. The vanilla kitchen settings already
    exclude every SEEDS item, including all six seed types Uniboslan owns.

- id: seed-stock-never-falls
  scope: universal
  status: prior
  source: user, 2026-09-17
  statement: >-
    Never run out of seed. Across each harvest cycle a crop's seed stock should
    end level with, or slightly above, where it started. Seed return varies by
    processing method and has some randomness, so manage the split between
    methods to hold that line.
  note: >-
    Figures in research/2026-09-17-seed-ratios.md. Recommended floor: 30 seeds
    per crop (the default of DFHack's seedwatch and autofarm). No tool can
    write kitchen restrictions yet; plants are cookable by default.

- id: cooking-plants-costs-seeds
  scope: universal
  status: verified
  source: reaction_other.txt BREW_DRINK_FROM_PLANT on this install (read by the orchestrator); research/2026-09-17-seed-ratios.md
  statement: >-
    Brewing one unrotten plant always gives 5 drinks and exactly 1 seed, and
    needs an empty barrel or pot. Cooking gives no seed, so cooking is the
    lever that draws seed stock down. A rotted plant returns no seed by any
    method. Milling, thread and extract returns are hardcoded and unverified.

- id: seed-break-even
  scope: universal
  status: prior
  source: research/2026-09-17-seed-ratios.md (formula is arithmetic; yield figures are wiki)
  statement: >-
    Each planted tile uses 1 seed. If a tile yields Y plants, at least 1/Y of
    the harvest must go to a seed-returning use (brewing) for stock to hold;
    the rest may be cooked. Unskilled and unfertilized (Y about 1) means
    nothing can be cooked without losing seed.

- id: dispose-of-surplus-seed
  scope: universal
  status: prior
  source: user, 2026-09-17
  statement: >-
    Surplus seed is not harmless clutter to keep forever. Once stock is well
    above what replanting needs, destroy the excess by burning it or with a
    dwarven atom smasher (a drawbridge).
  note: >-
    This install caps seed itself (d_init.txt, verified): 200 per crop and
    3000 in total; the shipped comment says seed over the global cap is
    periodically removed, oldest first. Manual disposal may matter less than
    in older versions. Whether an atom smasher destroys bagged seed is
    unverified.

- id: brew-only-refuted
  scope: universal
  status: refuted
  source: orchestrator error, corrected by the user 2026-09-17
  statement: >-
    "Brew plump helmets, never cook them" is wrong. Alcohol satisfies thirst,
    not hunger, so a brew-only fort has drink and nothing to eat.

- id: alcohol-is-not-food
  scope: universal
  status: prior
  source: DF wiki, Alcohol
  statement: >-
    Drink satisfies thirst only. Without alcohol, dwarves drink water but work
    more slowly.

- id: dwarves-must-drink
  scope: universal
  status: verified
  source: game data on this install
  statement: >-
    Dwarves die of thirst. df.death_type includes THIRST, and neither dwarf
    caste has NO_DRINK. The death threshold (the wiki says 75,000 ticks) is
    unverified.

- id: bedridden-need-water-brought
  scope: universal
  status: prior
  source: DF wiki, Thirst
  statement: >-
    A dwarf resting in bed does not fetch its own drink. Someone must bring
    water in a bucket, so keep an empty bucket available.

- id: water-source-zone-for-ponds
  scope: universal
  status: verified
  source: >-
    Uniboslan, 2026-09-17 supervised test (correlational, not isolated), and
    the user, who had hit the same thing in their own games before this fort
  statement: >-
    A fort whose only water is a sunken pond may have dwarves that never
    drink. Marking the water itself as a Water Source zone, on the level the
    water is on, got dwarves down to the water and drinking within about four
    game days. Place the zone on the water, not on the open space above it.
  note: >-
    Risks seen: dwarves then stand in 6-7/7 water, deep enough to drown a poor
    swimmer, and stagnant water gives a NastyWater thought whose health effect
    is unverified. A well avoids both.

- id: do-not-overfish
  scope: universal
  status: prior
  source: user, 2026-09-17
  statement: >-
    Fish in a given body of water are a finite stock, not a renewing one.
    Fishing a pond or lake hard enough empties it, and "there is nothing to
    catch" can mean depleted rather than never stocked. Treat fishing as a
    limited opening resource, cap how many dwarves hold the labor, and do not
    plan the fort's food around it.
  note: >-
    Unverified here. It bears directly on Uniboslan: its own "nothing to
    catch" popups appeared after a founder held the fishing labor, so this
    fort may already have fished out its nearest pond. The fishing research
    queued in Working.md should settle whether stocks are per body of water or
    per biome, and whether they ever recover.
