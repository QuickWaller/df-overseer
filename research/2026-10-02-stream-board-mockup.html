<title>Ragwind Chat Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --ground: #15171b; --surface: #1d2025; --raised: #252930; --line: #2f333b; --line-strong: #3d424c;
  --text: #ebe7df; --muted: #aaa396; --faint: #7f796e;
  --accent: #e8b454;
  --architect: #86b8ea; --quartermaster: #93d39e; --overseer: #e8b454; --consultant: #c9aaea; --executor: #bdb8ae; --will: #f2915f; --system: #8e887d;
  --ok-bg: #17271c; --ok-line: #3f6c49; --ok: #93d39e;
  --no-bg: #2b231a; --no-line: #6c5636; --no: #e8b454;
  --wait-bg: #1f222a; --wait-line: #3b4252; --wait: #aab5ca;
  --panel: #191b20;
  --g-done-bg: #1a221c; --g-done-line: #33473a; --g-done-fg: #8fa996; --g-done-mini: #4f6a57;
  --g-now-bg: #21354d; --g-now-line: #6fa0d4; --g-now-fg: #eaf2fb; --g-now-barbg: #3a5675; --g-now-bar: #9cc6f0;
  --g-ready-line: #86b8ea; --g-ready-fg: #d8e7f6;
  --g-wait-line: #3d424c; --g-wait-fg: #7f796e;
  --g-hold-bg: #33201a; --g-hold-line: #e07a52; --g-hold-fg: #ffd2bf; --g-hold-icon: #e07a52;
  --chip-ink: #15171b;
  --title-font: var(--sans);
  --radius: 8px;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 15px;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); }
body { color: var(--text); font-family: var(--sans); font-size: var(--fs); line-height: 1.45; padding-inline: 16px; padding-block: 18px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 1.45em; font-weight: 600; text-wrap: balance; }
header.top p { margin: 4px 0 0; color: var(--muted); font-size: 0.9em; max-width: 64ch; }
.sizer { display: flex; gap: 6px; align-items: center; color: var(--faint); font-family: var(--mono); font-size: 12px; }
.sizer button { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; min-width: 40px; min-height: 36px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; text-align: left; min-height: 44px; display: flex; flex-direction: column; gap: 2px; }
.tabs button .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--faint); }
.tabs button[aria-selected="true"] { border-color: var(--accent); background: var(--raised); }
.tabs button[aria-selected="true"] .k { color: var(--accent); }
.blurb { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; font-size: 0.9em; }
.blurb h3 { margin: 0 0 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--faint); font-weight: 500; }
.blurb p { margin: 0; color: var(--muted); }
@media (max-width: 760px) { .blurb { grid-template-columns: minmax(0, 1fr); } }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 620px; }
.who { font-weight: 600; }
.r-architect { color: var(--architect); } .r-quartermaster { color: var(--quartermaster); } .r-overseer { color: var(--overseer); }
.r-consultant { color: var(--consultant); } .r-executor { color: var(--executor); } .r-will { color: var(--will); } .r-system { color: var(--system); }
.date { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.day { display: flex; align-items: center; gap: 10px; color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chip { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; color: var(--chip-ink); white-space: nowrap; }
.chip.ok { background: var(--ok); } .chip.no { background: var(--no); } .chip.wait { background: var(--wait); }
.chip.active { background: var(--architect); } .chip.hold { background: var(--no); } .chip.done { background: var(--ok); }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; min-height: 28px; }
.muted { color: var(--muted); }

/* Decision card, shared by A, C and D */
.card { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.card .title { font-size: 1.07em; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.card .why { color: var(--muted); font-size: 0.88em; }
.verdict { border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; border: 1px solid; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.verdict.no { background: var(--no-bg); border-color: var(--no-line); }
.verdict.wait { background: var(--wait-bg); border-color: var(--wait-line); }
.verdict .vh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.verdict .vr { font-size: 0.93em; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 0.88em; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; }
.qa { border-left: 2px solid var(--line-strong); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 0.93em; }
.event { font-size: 0.88em; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.event .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px); }

/* A: timeline + drawer */
.a-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); min-height: 620px; }
.a-col { display: flex; flex-direction: column; min-width: 0; }
.a-col + .a-col { border-left: 1px solid var(--line); }
.subtabs { display: flex; border-bottom: 1px solid var(--line); }
.subtabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px; min-height: 46px; color: var(--muted); font-weight: 500; }
.subtabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.scroll { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; max-height: 720px; }
.filters { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filters button { background: none; border: 1px solid var(--line-strong); border-radius: 14px; padding: 4px 12px; font-size: 12px; color: var(--muted); min-height: 32px; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--ground); border-color: var(--text); }
.drawer-empty { color: var(--faint); padding: 40px 24px; text-align: center; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.step .m { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
.step .job { font-size: 0.85em; color: var(--muted); }
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
.prow .pt { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 500; }
.sectionlabel { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--faint); text-transform: uppercase; }
@media (max-width: 860px) { .a-grid { grid-template-columns: minmax(0, 1fr); } .a-col + .a-col { border-left: 0; border-top: 1px solid var(--line); } }

/* B: channels */
.b-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 620px; }
.rail { border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
.rail .sectionlabel { padding: 10px 10px 4px; }
.rail button { background: none; border: 0; border-radius: 6px; padding: 8px 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; color: var(--muted); }
.rail button[aria-current="true"] { background: var(--raised); color: var(--text); }
.rail .hash { color: var(--faint); font-family: var(--mono); margin-right: 4px; }
.rail .badge { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.rail .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chan-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.chan-head h2 { margin: 0; font-size: 1.05em; }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 500; color: #15171b; }
.msg .mh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg .mb { font-size: 0.95em; }
@media (max-width: 760px) { .b-grid { grid-template-columns: minmax(0, 1fr); } .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; } .rail .sectionlabel { display: none; } .rail button { flex: none; } }

/* C: board */
.c-wrap { display: flex; flex-direction: column; min-height: 620px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px 12px; padding: 14px 14px 28px; flex: 1; align-items: start; }
.column { display: flex; flex-direction: column; gap: 10px; }
.column h3 { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.column h3 .count { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 7px; color: var(--muted); }
.bcard .bdesc { font-size: 0.86em; color: var(--muted); }
.jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 0.85em; }
.jobs li { display: grid; grid-template-columns: 1.9em 3.2em minmax(0, 1fr); gap: 6px; align-items: baseline; }
.jobs .jp { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.jobs .jm { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; }
.jobs .jd { display: block; color: var(--muted); font-size: 0.95em; }
.jobs .j-done .jm { color: var(--ok); } .jobs .j-done .jn { color: var(--muted); }
.jobs .j-now .jm { color: var(--architect); } .jobs .j-hold .jm { color: var(--no); } .jobs .j-next .jm { color: var(--faint); } .jobs .j-next .jn { color: var(--muted); }
.bcard { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.bcard[aria-pressed="true"] { border-color: var(--accent); }
.bcard .bt { font-weight: 500; line-height: 1.35; }
.c-panel { border-top: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.track { display: flex; gap: 4px; align-items: stretch; }
.track .slot { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 10px; }
.track .seg { display: block; height: 7px; border-radius: 2px; background: var(--line-strong); }
.track .slot:has(.seg + .seg) .seg { height: 4px; }
.track .s-done { background: var(--ok); } .track .s-now { background: var(--architect); } .track .s-hold { background: var(--no); } .track .s-next { background: var(--line-strong); }
.nowline { display: flex; flex-direction: column; gap: 2px; font-size: 0.86em; }
.nowline .jm, .jobs .jm { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; }
.jm.j-now { color: var(--architect); } .jm.j-hold { color: var(--no); }
.bcard .foot { display: flex; gap: 8px; align-items: baseline; font-size: 0.82em; border-top: 1px solid var(--line); padding-top: 6px; }
.bcard .foot .count { margin-left: auto; color: var(--accent); font-size: 0.95em; }
.jgraph-wrap { overflow-x: auto; }
.jgraph { display: block; max-width: 100%; height: auto; }
.glegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78em; color: var(--muted); }
.glegend span { display: inline-flex; align-items: center; gap: 5px; }
.glegend .lg { width: 12px; height: 10px; border-radius: 2px; border: 1px solid; display: inline-block; }
.lg-done { background: var(--ok-bg); border-color: var(--ok-line); } .lg-now { background: #1b2533; border-color: #4d79a6; }
.lg-hold { background: var(--no-bg); border-color: var(--no-line); } .lg-added { background: var(--ground); border-color: var(--accent); border-width: 2px; }
.chip.amend { background: var(--accent); } .lg-next { background: var(--ground); border-color: var(--line-strong); border-style: dashed; }
.c-body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; }
.c-body.with-panel { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
.cpanel { border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.cph { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.cph h2 { margin: 0; font-size: 1.15em; text-wrap: balance; }
.closebtn { background: none; border: 1px solid var(--line-strong); border-radius: 6px; min-width: 36px; min-height: 36px; font-size: 18px; line-height: 1; color: var(--muted); }
@media (max-width: 820px) { .c-body.with-panel { grid-template-columns: minmax(0, 1fr); } .cpanel { border-left: 0; border-top: 1px solid var(--line); } }
.btop { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.urg { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; border: 1px solid; white-space: nowrap; }
.u-critical { color: #ff9d8a; border-color: #8a3b2e; background: #2c1714; }
.u-high { color: #f2b27a; border-color: #7a5130; background: #2a1e14; }
.u-elevated { color: #e8d27a; border-color: #6b6034; background: #25221a; }
.u-normal, .u-low { color: var(--muted); border-color: var(--line-strong); }
.sbar { display: flex; align-items: center; gap: 10px; }
.sbar .segs { flex: 1; display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.sbar .sg { flex: 1; background: var(--line); }
.sbar .g-done { background: var(--ok); }
.sbar .g-now { background: repeating-linear-gradient(135deg, var(--architect) 0 5px, #5f8fbf 5px 10px); }
.sbar .g-hold { background: var(--no); }
.sbar .slabel { font-size: 0.8em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bcard[aria-pressed="true"] { border-color: var(--accent); }
.bcard { gap: 8px; padding: 12px 13px; }
.bcard .bt { font-size: 1.04em; font-weight: 600; }
.bcard .bdesc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.btop { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 20px; }
.u-none { color: var(--faint); border-color: var(--line); }
.bstatus { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
.bstatus .mini { flex: none; }
.bstatus .slabel { margin-left: auto; font-size: 0.78em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cphl { display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meta { font-size: 0.85em; color: var(--muted); line-height: 1.6; }
.pdesc { margin: 0; line-height: 1.5; }
.psec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.liveitem { border-left: 3px solid var(--architect); padding: 2px 0 2px 10px; }
.liveitem.l-hold { border-left-color: var(--no); }
.liveitem .ln { font-weight: 500; font-size: 0.92em; }
.liveitem .ld { color: var(--muted); font-size: 0.86em; }
.tl { list-style: none; margin: 0; padding: 0 0 0 16px; position: relative; display: flex; flex-direction: column; gap: 12px; }
.tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.tl li { position: relative; display: flex; flex-direction: column; gap: 2px; }
.tl .tdot { position: absolute; left: -16px; top: 5px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 3px var(--panel); }
.tday { display: flex; flex-direction: column; gap: 8px; }
.tday + .tday { margin-top: 6px; }
.tdayh { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--faint); }
.tl .tline { font-size: 0.9em; line-height: 1.45; }
.bwrap { position: relative; display: flex; flex-direction: column; }
.bwrap.open .bcard { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.bcard .last { font-size: 0.82em; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-top: 1px solid var(--line); padding-top: 6px; }
.bcard .more-hint { font-size: 12px; color: var(--accent); }
.bexp { background: var(--raised); border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 8px 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.convo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 0.86em; }
.convo li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.peek { display: none; position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); flex-direction: column; gap: 6px; }
@media (hover: hover) and (pointer: fine) { .bwrap:hover .peek { display: flex; } }
@media (prefers-reduced-motion: no-preference) { .peek { animation: peekin 120ms ease-out; } @keyframes peekin { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } } }
.ticker { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 18px; overflow-x: auto; font-size: 0.85em; color: var(--muted); white-space: nowrap; }

/* D: digest */
.e-wrap { display: flex; flex-direction: column; }
.e-head { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.e-name { font-weight: 600; font-size: 1.15em; }
.e-view { position: relative; background: #000; border-right: 1px solid var(--line); }
.fakeview { display: block; width: 100%; height: auto; }
.e-wrap > .e-view { display: flex; justify-content: center; }
.e-wrap > .e-view .fakeview { width: auto; max-width: 100%; max-height: 480px; }
.e-live { position: absolute; top: 10px; left: 10px; background: #b3261e; color: #fff; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 3px; }
.e-vo { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,0.6); color: var(--muted); font-size: 11px; padding: 2px 6px; border-radius: 3px; }
.e-side { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.e-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.e-stat { background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; }
.e-stat .k { font-size: 11px; color: var(--faint); font-family: var(--mono); letter-spacing: 0.05em; text-transform: uppercase; }
.e-stat .v { font-size: 1.15em; font-weight: 500; font-variant-numeric: tabular-nums; }
.e-stat .v.bad { color: #e07a52; }
.e-goal, .e-now { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 860px) { .e-top { grid-template-columns: minmax(0, 1fr); } .e-view { border-right: 0; border-bottom: 1px solid var(--line); } }
.e-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  block(48, 8, "┌─┐│≡│└─┘", "#b07a3a");
  for (let x = 30; x < 37; x++) for (let y = 14; y < 19; y++) map[y][x] = ["≈", "#3d8fd1"];
  map[16][20] = ["O", "#3d8fd1"];
  const dwarves = Array.from({ length: 9 }, (_, i) => ({ x: 42 + (i % 8), y: 7 + (i % 5), c: ["#e8c547", "#e07a52", "#86b8ea", "#c9aaea", "#93d39e"][i % 5] }));
  const walk = (d) => {
    const dx = Math.round(rnd() * 2 - 1), dy = Math.round(rnd() * 2 - 1);
    const t = map[d.y + dy] && map[d.y + dy][d.x + dx];
    if (t && t[0] !== "█" && t[0] !== "▒" && t[0] !== "≈") { d.x += dx; d.y += dy; }

    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const [ch, col] = map[y][x]; ctx.fillStyle = col; ctx.fillText(ch, x * 12, y * 16); }

}
