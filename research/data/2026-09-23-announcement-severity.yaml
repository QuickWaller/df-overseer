# Announcement severity classification, 2026-09-23.
# research/2026-09-23-announcement-severity.md is the prose report this
# supports; read that first for method and caveats.
#
# Source: research/data/2026-09-23-announcement-types.tsv (357 ids/names,
# read live from df.announcement_type on VM 103, 2026-09-23) joined by NAME
# (not id -- verified to match exactly, see the report) against the real
# df.announcement_type enum's own alert_type attribute, read from a fresh
# shallow clone of DFHack/df-structures (df.g_src.basics.xml). All 357 names
# and ids matched exactly between the live install and df-structures master,
# confirming this classification's id numbering is the real installed one.
#
# level: pause | slow | notice | log_only | ignore (docs/AGENT-LOOP.md's own
#   clock levels plus the two below-clock tiers the brief asked for).
# alert_type: DF's own internal announcement-settings-menu category for this
#   id (GENERAL, MONSTER, AMBUSH, CRIME, ...) -- background context, not a
#   substitute for the level, since it answers 'which UI toggle' not 'how
#   urgent'.
# wake: role(s) this should wake when it applies (only set for slow/pause).
# context_dependent: true if this type's real severity depends on something
#   not in the announcement itself (see the report's section B).
# confidence: verified | likely | unverified, per this entry's own reasoning,
#   not a single blanket confidence for the whole file.

schema_version: 1
types:
  NONE:
    id: -1
    level: ignore
    alert_type: GENERAL
    reason: "sentinel value, id -1, no real report ever carries this type"
    confidence: verified
  REACHED_PEAK:
    id: 0
    level: log_only
    alert_type: GENERAL
    reason: "a world-historical or landmark-reached event; harmless background, never decision-relevant to a running fort"
    confidence: likely
  ERA_CHANGE:
