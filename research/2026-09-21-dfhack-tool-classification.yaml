- id: workorder
  description: Creates manager work orders from the command line, as if using the manager screen, with conveniences like counting milkable animals and topping up to a total across existing orders. Also lists valid job and item types.
  use: will
  use_reason: null
  wont_reason: null
  grey_question: null
  armok: false
  unavailable: false
  rw: both
  rw_detail: 'read: `--listtypes`; write: create orders'
  roles:
  - overseer
  - quartermaster
  category_broad: work-orders
  category_fine: work-order-manual
  overlaps_ours: 'orders.create: wraps it'
  notes: Takes a job type, an amount and material filters, so it is already the general form. Our orders tool loads its create_orders function. Manager orders never run on this fort without an appointed Manager (CLAUDE.md status); the workjob tool is the workaround for one-off jobs.
