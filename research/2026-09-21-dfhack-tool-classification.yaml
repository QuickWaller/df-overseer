  use: will
  use_reason: null
  wont_reason: null
  grey_question: null
  armok: false
  unavailable: false
  rw: read
  rw_detail: 'read: `status`; write: `clear` and ignore lists'
  roles:
  - overseer
  - architect
  category_broad: units-and-health
  category_fine: pathing-reachability
  overlaps_ours: 'connectivity.report: wraps it'
  notes: Our connectivity tools load its getStrandedGroups function directly, so it is already in use as a library. The write side is only the ignore list.
- id: weather
  description: Shows the current weather and can change it. DFHack tags it armok (god-like powers or access to information the game hides).
  use: wont
  use_reason: The user's ruling (2026-09-21) bans powers a player lacks and hidden information, not the tag; this tool changes the weather, which a player cannot do.
  wont_reason: armok
  grey_question: null
  armok: true
  unavailable: false
  rw: both
  rw_detail: 'read: report; write: set rain, snow, clear'
  roles: []
  category_broad: map-and-digging
  category_fine: map-editing
  overlaps_ours: null
  notes: 'Stays banned: changes the weather. Reading the weather is a plain view but adds little.'
- id: work-now
  description: Prompts dwarves to pick up a new task soon after finishing one, instead of wandering off for a while. Runs as a background plugin once enabled.
  use: grey
  use_reason: Reduces the idle time dwarves have between jobs, which raises output but is a speed change beyond normal behavior.
  wont_reason: null
  grey_question: Is nudging idle dwarves a legitimate throughput fix or a rule change like fastdwarf?
  armok: false
  unavailable: false
  rw: write
  rw_detail: 'read: status; write: enable'
  roles:
  - overseer
  category_broad: labor-and-jobs
  category_fine: job-priority
  overlaps_ours: null
  notes: null
