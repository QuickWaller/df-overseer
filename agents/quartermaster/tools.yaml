# Quartermaster tool allowlist. Deliberately minimal.
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py: see dfmcp/README.md for the scheme (strip df-overseer-/.lua,
# take the command's leading verb, join with a dot).
#
# NOTE (handoffs/2026-09-18-lever-gap-tools.md): this file did not exist
# before that stream. role.md used to say "No tools.yaml... yet,
# deliberately: writing an allowlist of tools that do not exist would imply
# a capability this project does not have." That reasoning held, since
# stockpile.list/stockpile.links are real, deployed tools, not aspirational
# ones. role.md's own opening was corrected afterwards and now says a
# tools.yaml exists (checked 2026-09-22).
#
# This role stays `enabled: false` in agents/ROSTER.yaml (unchanged by this
# stream -- that is a bigger decision than one tool grant). Everything else
# this role would need (work-order priority, stock thresholds, the
# autolabor race) is still unbuilt, per role.md's own "Would own"/"Traps"
# sections -- this file grants only what now genuinely exists.

schema_version: 1
role: quartermaster
write_authority: none

read:
  - id: "stockpile.list"
    status: exists
    note: >-
      Added handoffs/2026-09-18-lever-gap-tools.md. Every stockpile:
      landmark-relative name, occupied/total tiles (a leading indicator --
      docs/PRODUCTION-MODEL.md sec8), coarse accept categories. The first
      real tool surface this role has ever had.
  - id: "stockpile.links"
    status: exists
    note: >-
      Same handoff. Give/take links for one stockpile or workshop id.
  - id: "series.timelines"
    status: exists
    note: >-
      Added handoffs/2026-09-19-series-mcp-tools.md. The fort's own recorded
      history (dfseries/), read-only. docs/TIMESERIES.md's design names this
      role as owning inventory and production trends by agreed design (the
      Overseer arbitrates, the Consultant fact-checks); granted here even
      while this role stays disabled (see role.md, "not enabled... blocked
      on tools, not on a decision"), so enabling it later is a config
      change, not a fresh allowlist decision.
  - id: "series.get"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.latest"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.rate"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.resets"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.dwarf_day_events"
    status: exists
    note: >-
      Same handoff and reasoning as series.timelines above. The demand-side
      figure (drinking events per dwarf-day) this role's own "food and
      drink security" ownership needs, though it currently rests on 1
      event over 207 dwarf-days -- not yet a rate to plan against.

deny:
  - id: "orders.create"
    reason: >-
      This role is not enabled and holds no write authority regardless
      (see ROSTER.yaml). Listed explicitly, not left implicit, since
      work orders are squarely this role's future domain per role.md.
  - id: "orders.cancel"
    reason: Same as orders.create above.
  - id: "workjob.queue"
    reason: >-
      Added handoffs/2026-09-19-workshop-add-job.md. Same as orders.create
      above (this role is not enabled and holds no write authority
      regardless): the direct-workshop-job route is, if anything, more
      squarely this role's future domain than manager orders are (brewing
      is literally "food and drink security"), so it is listed explicitly
      rather than left an implicit gap.
