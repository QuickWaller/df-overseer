# Conductor tool allowlist. CODE, NEVER AN AGENT -- this role's token
# (MCP_ROLE_TOKEN_CONDUCTOR) is held only by the conductor SERVICE
# (docs/AGENT-LOOP.md item 3, a later stream), never by a model. No model
# ever sees this file or calls these tools directly.
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py: see dfmcp/README.md for the scheme (strip df-overseer-/
# .lua, take the command's leading verb, join with a dot).
#
# `status: exists` -> the underlying Lua command exists in this repo, but
# `live_deployed: false` in TOOLS.yaml for every one of them as of this
# stream (offline build, no VM). See this stream's handoff Result section
# for the exact live checks the deploy stream must run before treating any
# of these as verified.

schema_version: 1
role: conductor

# Every write below mutates DFHack's OWN runtime state (frame cap, pause
# flag, the tripwire watcher, a quicksave), never a fort decision -- the
# fort's designations, builds and orders stay the Overseer's alone
# (agents/ROSTER.yaml: sole_writer: overseer). dfmcp/roles.py's
# SYSTEM_CLASS_TOOL_IDS is the one, narrow, load-time-checked exception that
# lets a non-sole-writer role hold these seven ids, and only a role of
# kind: system (this one) may hold them -- see agents/ROSTER.yaml's
# conductor entry and dfmcp/roles.py's own header comment on the constant.
write_authority: system-class only (game clock and quicksave; never fort state)

read:
  - id: "announcement-levels.slow-ids"
    status: exists
    note: >-
      Added handoffs/2026-09-23-attention-tiers-ingame.md item 2. The 23
      `slow`-level announcement ids (research/data/2026-09-23-announcement-
      severity.yaml, generated by scripts/gen_announcement_pause_slow.py) --
      NOT acted on by df-overseer-clock.lua's own tripwire (its fifth check
      only ever pauses on the 25 `pause` ids). RECONCILED 2026-09-23 with
      the already-merged sibling stream (handoffs/2026-09-23-stalled-order-
      poller.md): conductor/cycle.py's `_classify_slow_announcements` was
      built against an assumed diff.since event `{"type":
      "announcement_slow", "announcement_type", "tick", "wake", "detail"}`,
      and df-overseer-diff.lua's onReport now actually emits exactly that
      event for a newly-arrived slow-level report (this stream's Result has
      the detail) -- so the conductor's PRIMARY route to the slow ids is
      the ordinary `diff.since` cursor it already reads every cycle, no new
      call needed. This tool stays granted as a secondary, static
      introspection route (the full id/name/wake/detail table on demand,
      independent of any report having actually fired yet).
  - id: "clock.status"
    status: exists
    note: Paused/fps/tick and the latched tripwire, if any.
  - id: "vitals.summary"
    status: exists
    note: >-
      Tier 0 figures for the per-cycle briefing (docs/AGENT-LOOP.md item 6):
      alive, dead_total, worst hunger/thirst status category, warning_count.
  - id: "overview.get"
    status: exists
    note: The same fort-overview read every other role's briefing draws on.
  - id: "queue.overview"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-conductor-fixes.md (fix 1). Native tool
      (dfmcp/queue_tools.py), not a DFHack command. Read-only, not
      sole_writer_only (roles.py rule 6 does not apply). Replaces
      queue.pending for this role: queue.pending's role branch is keyed to
      the CALLER's own authenticated identity, so the conductor (which
      authenticates as "conductor", never "consultant") could never see an
      open ask through it -- queue.overview is role-independent and always
      returns both pending proposals and open asks, letting the conductor's
      own triage (docs/AGENT-LOOP.md step 3) see what the queue holds for
      BOTH the Overseer and the Consultant before deciding who to wake.
      Granted only here: no other role's tools.yaml references this id.
  - id: "queue.pending_brief"
    status: exists
    note: >-
      Added handoffs/2026-10-05-execution-stage-1.md (docs/CONDUCTOR-EXECUTION.md
      3.3). Native tool (dfmcp/queue_tools.py). The Overseer's ruling briefing
      block: pending proposals (at most 8, true count given), each with its
      cited facts re-read by the server ("now V" only if changed), overlap
      flags, plus open projects and the last five rulings. The handler refuses
      any role but the conductor. Read-only.
  - id: "queue.filings_brief"
    status: exists
    note: >-
      Added handoffs/2026-10-07-own-filings.md. Native tool. For each named
      proposing role, the lines of its YOUR RECENT FILINGS briefing block (its
      newest few plus anything still pending, accepted, deferred or in a
      project), so a role sees what it already filed without asking. Refused
      for any role but the conductor. Read-only.
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Re-granted handoffs/2026-10-05-execution-stage-1.md, for threshold alerts
      only (conductor/policy.yaml threshold_alerts): one read per cycle, a line
      in a briefing only while a threshold is crossed. Not a fixed stock list.
      Read-only.
  - id: "diff.since"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-mvp-deploy.md: a real, load-bearing gap
      found on the conductor's first live contact with dfmcp (its own
      pinned config until this point granted no diff.since at all, only
      agents/overseer/tools.yaml did). conductor/cycle.py's Tier 0 read
      calls "diff.since" once per role in ALL_ROLES, each with that role's
      own persisted cursor (conductor/cursors.py) as the `cursor` argument
      -- it is a plain DFHack-backed command (scripts/dfhack/df-overseer-
      diff.lua), gated only by this allowlist, with no role-specific
      branching server-side (unlike queue.pending's old role-keyed
      behaviour above): the `cursor` is caller-supplied, not derived from
      the authenticated identity, so the conductor reading on another
      role's behalf with that role's own stored cursor is exactly what the
      tool already supports. Read-only. Granted only here: every other
      role reads its OWN diff.since only for itself (agents/overseer/
      tools.yaml is still the only OTHER grant, for the Overseer's own use
      inside a real run).
  - id: "blueprint.sites"
    status: exists
    note: >-
      Added handoffs/2026-10-05-ore-exposed-signal.md. Polled once per cycle by
      conductor/ore_watch.py: each site carries ore_exposed, the ore or gem
      still walled in on its room's faces (player-visible tiles only). The
      edge-triggered wake for the Architect is built from this. Read-only.
  - id: "stuckjobs.find"
    status: exists
    note: >-
      Added handoffs/2026-10-05-stuck-job-watch.md. Polled once per cycle by
      conductor/job_watch.py (nothing emits a stalled-job event, so polling is
      the only route), the same pattern as orders.list below. Read-only.
  - id: "orders.list"
    status: exists
    note: >-
      Added handoffs/2026-09-23-stalled-order-poller.md. Already granted
      read-only to overseer/architect/quartermaster
      (evals/live/2026-09-23-order-job-attribution/README.md); granted here
      too so conductor/cycle.py can poll validated/active/amount_left/
      amount_total/finished_year once per cycle (conductor/order_watch.py)
      -- the only route this project has to see a manager order that never
      dispatches a job, since DF's own announcement channel has no event
      for that failure at all (research/2026-09-23-announcement-
      severity.md §C). Read-only, same DFHack-backed command every other
      role already calls, no new surface. This edit falls slightly outside
      this stream's own listed "touched surfaces" (conductor/,
      conductor/tests/), flagged plainly in this stream's Result section
      rather than silently added: it is necessary plumbing for the read
      this handoff explicitly asks for, and does not touch anything the
      sibling in-game stream owns.
  - id: "queue.project_status"
    status: exists
    note: >-
      Added handoffs/2026-09-30-project-mcp-tools.md. Granted here because
      this role already holds a queue read (queue.overview above) that is
      role-independent by the same pattern; the reconciler that would
      actually READ this each cycle (research/2026-09-28-job-dependency-
      graph.md §6, "re-asserts holds... adds triage wake reasons") is out of
      scope for this stream and not built -- this grant makes the read
      reachable ahead of that, the same order queue.grade/queue.overview
      were granted in. One line per project (status, target counts, the top
      blocker's reason), never the whole graph.
  - id: "pause.why"
    status: exists
    note: >-
      Added handoffs/2026-10-05-pause-safety.md. Why the fort is paused or
      not advancing: latch, pending popups with their text, the screen, and
      recent DO_MEGA/PAUSE announcements by type name. Read by the pause
      watchdog (conductor/pause_watch.py) in a cycle where the fort is paused
      with no tripwire, or the tick has stopped. Read-only, player-visible
      facts only. Granted only here.
  - id: "pause.verdict_read"
    status: exists
    note: >-
      Added handoffs/2026-10-05-safe-to-resume.md. Reads the Overseer's
      pause.verdict records written after a given id, so the watchdog resumes
      only on an explicit resume=true from the run it just woke. Read-only.
      Granted only here (the handler also refuses any other role).
  - id: "queue.execution_state"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3).
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule
      8: only a role of kind system may hold it). Read-only: open projects,
      steps ready to run, unresolved runs, abandoned projects awaiting cleanup,
      steps observed done after a cursor. Granted only here.

  - id: "zone.list"
    status: exists
    note: >-
      Added handoffs/2026-10-07-p0-bedroom-alert.md. Read-only zone inventory;
      the conductor reads it unfiltered for `counts_by_kind` (the
      `bedrooms_per_citizen` threshold alert, research/2026-10-07-planner-design.md
      section 7). Same read the Architect holds.

  - id: "workjob.unsupplied"
    status: exists
    note: >-
      Added handoffs/2026-10-07-unsupplied-building-watch.md. Read-only: item
      kinds that buildingplan-planned buildings wait on, free stock, and the
      jobs and workshops that make each. The unsupplied-building watch polls it
      (conductor/unsupplied_watch.py).

write:
  - id: "clock.set-speed"
    status: exists
    note: base_fps / think_fps switching, per the wake-reason policy table (docs/AGENT-LOOP.md ss2).
  - id: "clock.pause"
    status: exists
    note: Always allowed; pausing is the safe direction.
  - id: "clock.resume"
    status: exists
    note: >-
      Refused by the tool itself while a tripwire is latched. Granted ONLY
      here, never to agents/overseer/tools.yaml: the Overseer's charter says
      never unpause without being asked to, and dfmcp/roles.py's
      SYSTEM_CLASS_TOOL_IDS check has no sole_writer carve-out, so granting
      this to overseer's own tools.yaml (kind: actor) would fail to load,
      not just be a bad idea.
  - id: "clock.arm"
    status: exists
    note: Arms the in-game tripwire watcher at cycle start (or fort start-up).
  - id: "clock.disarm"
    status: exists
    note: Stops the watcher (does not touch a latch already set).
  - id: "clock.clear"
    status: exists
    note: Clears a latched tripwire once the Overseer has handled it (docs/AGENT-LOOP.md ss1 step 6-adjacent).
  - id: "fort.quicksave"
    status: exists
    note: >-
      Fires quicksave; does not block waiting for it to land (see the .lua
      file's own header -- a deliberate deviation from the handoff's literal
      phrasing, flagged in this stream's report). The cycle's "save before
      any action" step (docs/AGENT-LOOP.md ss1).
  - id: "queue.grade"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-conductor-service.md (docs/AGENT-LOOP.md
      item 2). Native tool (dfmcp/queue_tools.py), not a DFHack command --
      runs dfqueue.grade.run_grading_cycle over MCP since the queue database
      lives on VM 103 and this service runs on VM 106. Idempotent. Granted
      only here: no other role's tools.yaml references this id.
  - id: "conductor.report"
    status: exists
    note: >-
      Added handoffs/2026-10-05-conductor-report.md. Native tool
      (dfmcp/conductor_tools.py), not a DFHack command. Carries each role
      run's wake reason at launch and its end-of-run summary, duration, cost
      and the queue records it wrote to VM 103 (dfqueue/runs.py), over the
      MCP connection the conductor already holds, so the stream page can show
      why a role woke. Writes only to its own run store, never the fort.
      Granted only here (the handler also refuses any other role). The
      conductor treats a failed report as a log line, never a cycle failure.
  - id: "pause.dismiss"
    status: exists
    note: >-
      Added handoffs/2026-10-05-pause-safety.md. Closes the popup boxes a
      player could close (Okay, More, a help box) and reports what each said.
      Never resumes and never touches a latch. In dfmcp/roles.py's
      SYSTEM_CLASS_TOOL_IDS, so only a role of kind system may hold it.
  - id: "queue.close_legacy"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (deploy 2a). Closes one old ruling,
      project or pending step-less proposal at or below its cutover under the
      executor's name. Writes a `close` record only: touches no game state and
      never calls DFHack. Executor-only.
  - id: "queue.cutover"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (deploy 2a, `python -m
      conductor.cutover`). Checks (apply false) or records (apply true) a
      group's cutover and closes everything at or below it through the same
      store call as queue.close_legacy. Never calls DFHack. Executor-only.
  - id: "queue.open_project"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Opens the project for an accepted routed proposal's ruling (one step, the proposal's exact tool and arguments). Writes a `project` record only.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.apply_followup"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Applies an accepted or covered follow-up as one amend adding its step. Writes an `amend` record only.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.run_step"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Runs one step as code: runnable check, dry run judged by the tool's declared verdict, landed baseline, step-run marker, the real call, the executed record. Reaches DFHack through the server's internal route (never Roster.check), only for the tools in a routed group of dfqueue/action_tools.yaml. Nothing is routed until the cutover deploy, so until then it can only report not_runnable.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.resolve_uncertain"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Settles a step run left issuing by a landed read against its baseline. Read-only against the game; writes the step's executed record when the call is found to have landed.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.observe"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Reads an issued step's progress through its tool's declared progress read and records one observation; only `done` completes a step.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.cleanup_project"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Abandon cleanup: releases what the abandoned project reserved and designated (never dug tiles) through each handle's declared cleanup tool, then closes it with the results.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
  - id: "queue.close"
    status: exists
    note: >-
      Added handoffs/2026-10-06-stage-2c.md (docs/CONDUCTOR-EXECUTION.md 6.3). Closes a project (idle or passed) with a reason. Writes a `close` record only; touches no game state.
      Native tool (dfmcp/executor_tools.py), executor-only (dfmcp/roles.py rule 8: only a
      role of kind system may hold it). Granted only here.
