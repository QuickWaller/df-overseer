      zone.find above. Offline build, not deployed.

  - id: "surface.enclosure"
    status: planned
    note: >-
      Added handoffs/2026-09-24-surface-perception.md. Whether a zone's
      footprint is enclosed and, if not, a typed count of boundary-ring
      gaps (doorway / open_floor_edge / missing_wall). A ruling on a room
