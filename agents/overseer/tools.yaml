      cycle. Full series.* set granted together, matching the breadth of
      this role's other reads (stocks.*, farm.*, well.find, zone.find):
      arbitration needs the whole picture, not one metric.
  - id: "series.get"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.latest"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.rate"
    status: exists
    note: >-
      Same handoff and reasoning as series.timelines above. Refuses to
