# Overseer tool allowlist.
#
# A role IS its allowlist (principle 8). This file, not the charter, is the
# enforced boundary. Ids reference scripts/dfhack/TOOLS.yaml verbatim.
#
# `status: exists`  -> deployed and live-verified on VM 103 today.
# `status: planned` -> referenced by the design, not built. Must not be assumed.

schema_version: 1
role: overseer

# The Overseer is the sole writer, so it is the only role with any write entry.
read:
  - id: "df-overseer-overview: get (or no args)"
    status: exists
  - id: "df-overseer-landmarks: list"
    status: exists
  - id: "df-overseer-landmarks: get NAME"
    status: exists
  - id: "df-overseer-connectivity: report"
    status: exists
  - id: "df-overseer-connectivity: check FROM TO"
    status: exists
    note: TOOLS.yaml tags this one unverified. Treat its output accordingly.
  - id: "df-overseer-diff: since CURSOR"
    status: exists
    note: Primary input to Triage. Keep a per-role cursor, do not re-read history.
  - id: "df-overseer-stuckjobs: find [MIN_IDLE_TICKS]"
    status: exists
  - id: "df-overseer-labor: unit-status [idle|injured|military|hostile]"
    status: exists
    reliability: HEURISTIC
    note: >-
      The `hostile` filter is verified wrong in both directions. Never treat it
      as confirmation in either direction.

write:
  - id: "df-overseer-openarea: build W H [Z] NEAR_LANDMARK BLUEPRINT_FILE [RANK] [RADIUS_TILES]"
    status: exists
    note: Resolves its own coordinate internally. Never pass one in.
  - id: "df-overseer-diggable: dig W H [Z] NEAR_LANDMARK BLUEPRINT_FILE [RANK] [RADIUS_TILES]"
    status: exists
  - id: "df-overseer-landmarks: build NAME BLUEPRINT_FILE"
    status: exists
  - id: "df-overseer-labor: set-labor UNIT_ID LABOR_NAME on|off"
    status: exists
    hazard: Races autolabor on ordinary citizens. See role.md.

planned:
  - id: "queue: propose"
    status: planned
    note: Advisors write, the Overseer reads. Part of the unbuilt MCP seam.
  - id: "queue: plan"
    status: planned
    note: Write-ahead log for the ordered plan, then per-step completion marks.
  - id: "playbook: write"
    status: planned
  - id: "sentry: status"
    status: planned

# Explicitly denied, not merely absent. Denial is the point.
deny:
  - id: "df-overseer-ui: *"
    reason: >-
      Embark-time bootstrap only. Depends on global focus and cursor state, is
      the least sliceable write path in the repo, and collides with any human on
      the admin VNC channel.
  - id: "df-overseer-ui: embark-mode"
    reason: Would leave the live fort in a different game mode.
