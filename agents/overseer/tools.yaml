    status: exists
    note: >-
      Added handoffs/2026-09-23-attention-tiers-ingame.md. Per-race
      observation ledger (sightings/outcomes, never per-unit): what the
      record_only/slow tiers accumulated between tripwires, decayed at
      read time (a pure "present" row older than the caller's window is
      left out; a theft/kill row never decays).
  - id: "overview.get"
    status: exists
  - id: "landmarks.list"
    status: exists
  - id: "landmarks.get"
    status: exists
  - id: "connectivity.report"
    status: exists
  - id: "connectivity.check"
    status: exists
    note: TOOLS.yaml tags this one unverified. Treat its output accordingly.
  - id: "diff.since"
    status: exists
    note: Primary input to Triage. Keep a per-role cursor, do not re-read history.
  - id: "stuckjobs.find"
    status: exists
  - id: "stocks.food-drink"
