write:
  - id: "openarea.build"
    status: exists
    note: Resolves its own coordinate internally. Never pass one in.
  - id: "diggable.dig"
    status: exists
  - id: "diggable.dig-stair"
    status: exists
    note: >-
      Added handoffs/2026-09-17-dig-down-to-stone.md. Designates a
      downstair/upstair pair to extend the walkable network down one level,
      never one half without the other. No paired diggable.find-stair read here,
      matching diggable.find/diggable.dig's own established pairing (the
      Overseer acts on the Architect's discovery, it does not discover for
      itself; dfmcp/tests/test_roles.py
      test_the_overseer_can_act_but_cannot_discover), not the newer
      farm/zone/trees/well read-before-write pattern. DRY_RUN defaults to true.
      The dry-run path was live-verified 2026-09-17 and the real designation ran
      2026-09-18, both halves read back (handoffs/2026-09-18-well-unblock.md);
      the rollback-on-partial-failure branch is untested.
  - id: "landmarks.build"
    status: exists
  - id: "farm.build"
    status: exists
    note: >-
      Added handoffs/2026-09-16-farm-and-still-tools.md. DRY_RUN defaults to
      true, so an explicit false is required to actually mutate. Deployed
      2026-09-17, and the real path was run that day: it placed a 5x5 farm plot
      at z168, verified by a direct struct read (decisions/DECISIONS.md
      2026-09-17). The blueprint is deployed to the guest's dfhack-
      config/blueprints/.
  - id: "farm.set-crop"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. Writes
      building_farmplotst.plant_id[season] directly, by the same pattern as
      set_labor below. The real write was live-verified 2026-09-17 (plump helmet
      in all four seasons, read back); a crop written before the plot's
      construction completes does not survive it, so set the crop after
      flags.exists (docs/TRAPS.md).
  - id: "workshop.build"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. Deployed 2026-09-17 with its
      blueprints. The real path for a still ran 2026-09-17 (the still was
      designated; decisions/DECISIONS.md 2026-09-17); the real path for
      mason/mechanic/carpenter (handoffs/2026-09-17-water-and-industry-tools.md
      item 3) is untested live. It covers five kinds only; building.build is the
      generic one.
  - id: "zone.place"
    status: exists
    note: >-
      Added handoffs/2026-09-17-water-and-industry-tools.md item 1, generalised
      by handoffs/2026-09-21-zone-tool-generalise.md to any of the install's 18
      zone kinds with an optional OWNER. DRY_RUN defaults to true. Deployed
      2026-09-21. Only dry runs have been run through this tool (an Office dry
      run validated in quickfort); the real placement, the read-back and both
      owner assignments have never been run.
  - id: "trees.fell"
    status: exists
    note: >-
      Same handoff, item 2. DRY_RUN defaults to true. Real path calls
      dfhack.designations.markPlant directly (the same primitive
      quickfort's own chop symbol uses) -- UNTESTED live.
  - id: "well.build"
    status: exists
    note: >-
      Same handoff, item 5. DRY_RUN defaults to true. Needs a matching
      BLUEPRINT_FILE (a 1x1 #build `l` Well cell) in dfhack-config/blueprints/,
      deployed 2026-09-17. The real path was run 2026-09-19: it placed and
      completed the fort's well (decisions/DECISIONS.md 2026-09-19).
  - id: "orders.create"
    status: exists
    note: >-
      Same handoff, item 4; job vocabulary extended handoffs/2026-09-18-lever-
      gap-tools.md. DRY_RUN defaults to true. JOB is one of blocks/mechanisms/ba
      rrels/brew_drink/bucket/bed/door/table/chair/splint/crutch/soap; see the
      .lua file's own header for each job's live-verified df.job_type id and
      workshop_subtype confidence. No citizen held the MANAGER position when
      this was written; unit 345 has held it since 2026-09-21, but the fort has
      no Office and queued manager orders still do not run
      (handoffs/2026-09-21-nobles-appoint.md). manager_appointed is reported on
      every call, not enforced as a refusal. Deployed 2026-09-17; the real
      create_orders call is untested live.
  - id: "orders.cancel"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. erase(idx)+delete() on the
      matching df.manager_order, inferred by convention (workorder.lua's
      own rollback pattern) and not independently proven by a real
      removal.
  - id: "workjob.queue"
    status: exists
    note: >-
      Added handoffs/2026-09-19-workshop-add-job.md, the direct-workshop-job
      route: this fort had no appointed Manager and manager orders
      (orders.create above) ran 15,000-50,000+ ticks each without ever
      converting into a real job (handoffs/2026-09-19-well-and-harvest.md
      section 5, handoffs/2026-09-19-well-finish.md sections 2-4). A Manager was
      appointed 2026-09-21 but orders still do not run, and this is the other
      legitimate vanilla route (the 'q -> add job' menu). Granted to the
      Overseer only, as the sole writer. DRY_RUN defaults to true. Never sets
      status.validated and never touches world.manager_orders.all. Deployed
      2026-09-19 and run for real: a blocks job and a mechanisms job made the
      parts for the well (decisions/DECISIONS.md 2026-09-19). TOOLS.yaml still
      tags the command unverified (a registry test pins that).
  - id: "workjob.cancel"
    status: planned
    note: >-
      Added handoffs/2026-09-23-order-job-attribution-and-checks.md item 5.
      Cancels a direct job by id, refusing any job that is not a workshop-
      held production job (the boundary queue_job's own job_items already
      draw). Granted to the Overseer only, as the sole writer, same as
      workjob.queue above. Offline build, not deployed, DRY_RUN defaults to
      true.
  - id: "labor.set-labor"
    status: exists
    hazard: >-
      FIXED 2026-09-16 (handoffs/2026-09-16-stocks-read-and-labor-race.md item
      3) and deployed to VM 103 with the 2026-09-21 deploy (TOOLS.yaml no longer
      marks it STALE); no set-labor call has been made since. No longer races
      autolabor by default: it now disables autolabor's management of that ONE
      LABOR, fort-wide, before writing, or refuses outright if it cannot tell
      whether autolabor is even enabled. The fort-wide (not per-unit) side
      effect is real and is named in the tool's own return message every time it
      fires. Treat any set-labor call as 'this labor is now hand-managed for
      everyone, not just this citizen', not as a narrow, single-unit action.
  - id: "queue.rule"
    status: exists
    note: >-
      Accept/reject/defer one proposal. Restricted to the roster's sole_writer
      as a hard load-time rule (dfmcp/roles.py rule 6), on top of dfqueue.schema's
      own sole-writer check at write time -- two independent layers. The
      Overseer never holds queue.propose: its type vocabulary is empty by
      design (it rules on proposals, it never writes one -- §3, "Specialists
      propose, the Overseer decides"). Refused (dfqueue.store) while an open
      fact-check (see queue.ask below) is on the proposal you name.
  - id: "queue.ask"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-queue-quartermaster.md (docs/
      AGENT-LOOP.md item 7). Two distinct uses of the one tool: a plain
      lookup question (no proposal_id), same as any advisor's own ask; or a
      FACT-CHECK (proposal_id set to an existing proposal) that blocks
      queue.rule on that proposal until queue.answer closes it -- the
      2026-09-17 exception, distinct from the 2026-09-15 one. Route a
      proposal for fact-checking only when you would otherwise rule on a
      claim you cannot verify from your own read tools; it costs a full
      cycle (this ask must be answered before the ruling can land).
  - id: "queue.executed"
    status: exists
    note: >-
      Added same handoff (docs/AGENT-LOOP.md item 4). Records that an
      accepted ruling was carried out: the tool ids called and each one's
      outcome (a failed execution is a valid, required record), plus
      free-text notes. Restricted to the roster's sole_writer the same way
      queue.rule is (dfmcp/roles.py rule 6, reusing sole_writer_only).
      **This is what starts the proposal's prediction grading window** --
      it now runs from THIS call's own stamped game tick, never from the
      proposal's original write time (the gap that let proposal-0001's
      window elapse before anything could act on it). Call it once you
      have actually attempted the accepted proposal's action, whether or
      not every individual tool call inside it succeeded; an accepted
      proposal with no queue.executed record yet is reported as
      unexecuted, never silently graded as a miss.

  - id: "building.build"
    status: exists
    note: >-
      Same handoff. Places any kind at a ranked site; dry run by default.
      Deployed 2026-09-21 and dry-run only so far: the first real build of a
      never-built kind needs the user's go-ahead.

  - id: "queue.escalate"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-conductor-fixes.md (fix 3). The only
      way to escalate to the human, per this role's own Escalation section
      below: a queue record via a real tool call, never free text in a
      final answer. conductor/cycle.py detects this mechanically (against
      openclaw's own toolSummary.tools, never by parsing prose) and leaves
      the fort paused, whether the tripwire is already latched or not.
      Restricted to the roster's sole_writer the same way queue.rule/
      queue.executed are (dfmcp/roles.py rule 6, reusing sole_writer_only).

  - id: "nobles.appoint"
    status: exists
    note: >-
      Same handoff. Appoints a citizen to a vacant position; dry run by default.
  - id: "nobles.unappoint"
    status: exists
    note: >-
      Same handoff. Removes a position's holder; dry run by default.

planned:
  - id: "queue.plan"
    status: planned
    note: Write-ahead log for the ordered plan, then per-step completion marks.
  - id: "playbook.write"
    status: planned
  - id: "sentry.status"
    status: planned

# Explicitly denied, not merely absent. Denial is the point.
deny:
  - id: "ui.*"
    reason: >-
      Embark-time bootstrap only. Depends on global focus and cursor state, is
      the least sliceable write path in the repo, and collides with any human on
      the admin VNC channel.
  - id: "ui.embark-mode"
    reason: Would leave the live fort in a different game mode.
  - id: "doctrine.get"
    reason: >-
      Withheld handoffs/2026-09-19-get-doctrine-tool.md. The already-agreed
      design (Working.md 2026-09-17, "In discussion: designing the learning
      loop") routes the Overseer's doctrine fact-checking through the
      consultant before ruling, rather than the Overseer reading doctrine
      directly -- "The Overseer hands proposals to the consultant for
      fact-checking... before ruling." Granting this here would duplicate
      that agreed path. Revisit only if that design changes.
