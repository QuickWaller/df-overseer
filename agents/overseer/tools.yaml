  - id: "surface.finish"
    status: planned
    note: >-
      Same handoff. Smooth / engraved / rough_natural / constructed counts
      for a zone's floor and boundary wall tiles -- the user's "every room
      at least smoothed" standard, made checkable. Offline build, not
      deployed.
  - id: "surface.material"
    status: planned
    note: >-
      Same handoff. What a zone's boundary is made of, which decides
      whether it can be smoothed or must be built; soil cannot be smoothed
