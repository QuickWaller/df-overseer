  - id: "stockpile.links"
    status: exists
    note: >-
      Same handoff. Give/take links for one stockpile or workshop id.
      Both of Uniboslan's stockpiles are unlinked today, live-verified.
  - id: "labor.unit-status"
    status: exists
    reliability: HEURISTIC
    note: >-
      The `hostile` filter is verified wrong in both directions. Never treat it
      as confirmation in either direction.
  - id: "threat.scan"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. The purpose-built replacement for `labor.unit-status
      hostile`: admits units by reachability rather than by a danger flag. Its
      own output labels flag-derived fields HEURISTIC. **Live-verified
      2026-09-12** against both failures that motivated it: correctly
      admitted a fox and a weasel by shared walkable group with no danger
      flag, correctly excluded two demons that do carry danger flags
      (decisions/DECISIONS.md 2026-09-12, "Threat detector LIVE-VERIFIED").
      Remaining unknowns: wildlife-noise volume on a larger fort, no ambush
      or sneaking-creature case tested.
  - id: "breach.check"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. Water and magma detection, which has no DFHack event at
      all. **May be inert**: its cheap first stage triggers off a map-block flag
      that nothing in the shipped scripts ever reads, only sets, so whether DF
      itself raises it during natural liquid movement is unverified. Until that
      is settled, a `severity=none` result means nothing.
  - id: "queue.pending"
    status: exists
    note: >-
      Every proposal with no ruling yet, rendered as XML. Read-only; no
      cross-advisor visibility is granted here, only the Overseer's own view
      of what is waiting on it.
  - id: "series.timelines"
    status: exists
    note: >-
      Added handoffs/2026-09-19-series-mcp-tools.md. The fort's own recorded
      history (dfseries/), read-only. Granted to the Overseer because
      priority-setting and the WIP limit ("does the well fix actually mean
      the fort is drinking now, or is that still a guess") need grounding in
