# Overseer tool allowlist.
#
# A role IS its allowlist (principle 8). This file, not the charter, is the
# enforced boundary. Ids are the canonical scheme resolved against
# scripts/dfhack/TOOLS.yaml by dfmcp/registry.py: see dfmcp/README.md for the
# scheme itself: strip the df-overseer- prefix and .lua suffix, take the
# command's leading verb, join with a dot, e.g. "df-overseer-openarea.lua"
# plus "build W H ..." becomes "openarea.build". dfmcp/roles.py resolves this
# file against the registry and refuses to load if an id here does not
# exist there. Package renamed mcp/ -> dfmcp/ 2026-09-12
# (decisions/DECISIONS.md); this comment predated the rename and was
# corrected 2026-09-16.
#
# `status: exists`  -> deployed and live-verified on VM 103 today.
# `status: planned` -> referenced by the design, not built. Must not be assumed.

schema_version: 1
role: overseer

# The Overseer is the sole writer, so it is the only role with any write entry.
read:
  - id: "overview.get"
    status: exists
  - id: "landmarks.list"
    status: exists
  - id: "landmarks.get"
    status: exists
  - id: "connectivity.report"
    status: exists
  - id: "connectivity.check"
    status: exists
    note: TOOLS.yaml tags this one unverified. Treat its output accordingly.
  - id: "diff.since"
    status: exists
    note: Primary input to Triage. Keep a per-role cursor, do not re-read history.
  - id: "stuckjobs.find"
    status: exists
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Added handoffs/2026-09-16-stocks-read-and-labor-race.md. Fort-owned
      (never caravan-owned) drink/prepared-meal/raw-edible counts plus
      rotten/unreachable flags per bucket. Not yet deployed to VM 103 -- see
      TOOLS.yaml's own notes.
  - id: "stocks.seeds"
    status: exists
    note: Same file, same deploy caveat as stocks.food-drink above.
  - id: "labor.unit-status"
    status: exists
    reliability: HEURISTIC
    note: >-
      The `hostile` filter is verified wrong in both directions. Never treat it
      as confirmation in either direction.
  - id: "threat.scan"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. The purpose-built replacement for `labor.unit-status
      hostile`: admits units by reachability rather than by a danger flag. Its
      own output labels flag-derived fields HEURISTIC. **Live-verified
      2026-09-12** against both failures that motivated it: correctly
      admitted a fox and a weasel by shared walkable group with no danger
      flag, correctly excluded two demons that do carry danger flags
      (decisions/DECISIONS.md 2026-09-12, "Threat detector LIVE-VERIFIED").
      Remaining unknowns: wildlife-noise volume on a larger fort, no ambush
      or sneaking-creature case tested.
  - id: "breach.check"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. Water and magma detection, which has no DFHack event at
      all. **May be inert**: its cheap first stage triggers off a map-block flag
      that nothing in the shipped scripts ever reads, only sets, so whether DF
      itself raises it during natural liquid movement is unverified. Until that
      is settled, a `severity=none` result means nothing.
  - id: "queue.pending"
    status: exists
    note: >-
      Every proposal with no ruling yet, rendered as XML. Read-only; no
      cross-advisor visibility is granted here, only the Overseer's own view
      of what is waiting on it.

write:
  - id: "openarea.build"
    status: exists
    note: Resolves its own coordinate internally. Never pass one in.
  - id: "diggable.dig"
    status: exists
  - id: "landmarks.build"
    status: exists
  - id: "labor.set-labor"
    status: exists
    hazard: >-
      FIXED 2026-09-16 (handoffs/2026-09-16-stocks-read-and-labor-race.md
      item 3), not yet redeployed to VM 103 (TOOLS.yaml marks this command
      STALE). No longer races autolabor by default: it now disables
      autolabor's management of that ONE LABOR, fort-wide, before writing,
      or refuses outright if it cannot tell whether autolabor is even
      enabled. The fort-wide (not per-unit) side effect is real and is
      named in the tool's own return message every time it fires -- treat
      any set-labor call as "this labor is now hand-managed for everyone,
      not just this citizen," not as a narrow, single-unit action.
  - id: "queue.rule"
    status: exists
    note: >-
      Accept/reject/defer one proposal. Restricted to the roster's sole_writer
      as a hard load-time rule (dfmcp/roles.py rule 6), on top of dfqueue.schema's
      own sole-writer check at write time -- two independent layers. The
      Overseer never holds queue.propose: its type vocabulary is empty by
      design (it rules on proposals, it never writes one -- §3, "Specialists
      propose, the Overseer decides").

planned:
  - id: "queue.plan"
    status: planned
    note: Write-ahead log for the ordered plan, then per-step completion marks.
  - id: "playbook.write"
    status: planned
  - id: "sentry.status"
    status: planned

# Explicitly denied, not merely absent. Denial is the point.
deny:
  - id: "ui.*"
    reason: >-
      Embark-time bootstrap only. Depends on global focus and cursor state, is
      the least sliceable write path in the repo, and collides with any human on
      the admin VNC channel.
  - id: "ui.embark-mode"
    reason: Would leave the live fort in a different game mode.
