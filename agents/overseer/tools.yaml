  - id: "trees.find"
    status: exists
    note: >-
      Same handoff, item 2. Distance-banded counts/reachability, CUTWOOD labor
      and axe counts; read before trees.fell. Deployed to VM 103 2026-09-17.
  - id: "well.find"
    status: exists
    note: >-
