# Overseer tool allowlist.
#
# A role IS its allowlist (principle 8). This file, not the charter, is the
# enforced boundary. Ids are the canonical scheme resolved against
# scripts/dfhack/TOOLS.yaml by dfmcp/registry.py: see dfmcp/README.md for the
# scheme itself: strip the df-overseer- prefix and .lua suffix, take the
# command's leading verb, join with a dot, e.g. "df-overseer-openarea.lua"
# plus "build W H ..." becomes "openarea.build". dfmcp/roles.py resolves this
# file against the registry and refuses to load if an id here does not
# exist there. Package renamed mcp/ -> dfmcp/ 2026-09-12
# (decisions/DECISIONS.md); this comment predated the rename and was
# corrected 2026-09-16.
#
# `status: exists`  -> deployed and live-verified on VM 103 today.
# `status: planned` -> referenced by the design, not built. Must not be assumed.

schema_version: 1
role: overseer

# The Overseer is the sole writer, so it is the only role with any write entry.
read:
  - id: "overview.get"
    status: exists
  - id: "landmarks.list"
    status: exists
  - id: "landmarks.get"
    status: exists
  - id: "connectivity.report"
    status: exists
  - id: "connectivity.check"
    status: exists
    note: TOOLS.yaml tags this one unverified. Treat its output accordingly.
  - id: "diff.since"
    status: exists
    note: Primary input to Triage. Keep a per-role cursor, do not re-read history.
  - id: "stuckjobs.find"
    status: exists
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Added handoffs/2026-09-16-stocks-read-and-labor-race.md. Fort-owned
      (never caravan-owned) drink/prepared-meal/raw-edible counts plus
      rotten/unreachable flags per bucket. Not yet deployed to VM 103 -- see
      TOOLS.yaml's own notes.
  - id: "stocks.seeds"
    status: exists
    note: Same file, same deploy caveat as stocks.food-drink above.
  - id: "stocks.availability"
    status: exists
    note: >-
      Added handoffs/2026-09-19-per-item-flags-tool.md, offline build --
      never run against a live DFHack process. Per-item-type netting
      (in_job/owned+UNIT_HOLDER/forbid/trader), so 3 empty buckets that are
      all job-claimed reads differently from all forbidden or all
      dwarf-owned -- three different actions, not one "need bucket" alarm.
      owned_ref_check.verified_offline is always false until a live run;
      TOOLS.yaml carries the full reasoning.
  - id: "farm.find"
    status: exists
    note: >-
      Added handoffs/2026-09-16-farm-and-still-tools.md. Candidate farm-plot
      floor, tagged outside/inside and the fort-owned seeds actually valid
      there. Not yet deployed to VM 103.
  - id: "farm.list"
    status: exists
    note: >-
      Added handoffs/2026-09-17-farm-tool-fixes.md. Every built farm plot
      with its id and per-season crop; farm.set-crop needs the id. Not yet
      deployed to VM 103.
  - id: "workshop.find"
    status: exists
    note: >-
      Same handoff, extended handoffs/2026-09-17-water-and-industry-tools.md
      item 3 with mason/mechanic/carpenter and a building_material report
      shared by all five kinds. Not yet deployed.
  - id: "zone.find"
    status: exists
    note: >-
      Added handoffs/2026-09-17-water-and-industry-tools.md item 1. Ranked
      revealed water bodies (bounding box, tile count, depth, stagnant/
      salt) -- read this before zone.place, same pairing as farm.find/
      workshop.find above. Not yet deployed.
  - id: "trees.find"
    status: exists
    note: >-
      Same handoff, item 2. Distance-banded counts/reachability, CUTWOOD
      labor and axe counts -- read before trees.fell. Not yet deployed.
  - id: "well.find"
    status: exists
    note: >-
      Same handoff, item 5. Ranked pond-edge well sites with
      BLOCKS/BUCKET/CHAIN/TRAPPARTS fort-owned counts -- read before
      well.build. Not yet deployed.
  - id: "orders.list"
    status: exists
    note: >-
      Same handoff, item 4. Pending manager orders and whether a Manager
      is appointed. Not yet deployed.
  - id: "stockpile.list"
    status: exists
    note: >-
      Added handoffs/2026-09-18-lever-gap-tools.md. Every stockpile:
      landmark-relative name, occupied/total tiles (a leading indicator --
      docs/PRODUCTION-MODEL.md sec8), coarse accept categories.
  - id: "stockpile.links"
    status: exists
    note: >-
      Same handoff. Give/take links for one stockpile or workshop id.
      Both of Uniboslan's stockpiles are unlinked today, live-verified.
  - id: "labor.unit-status"
    status: exists
    reliability: HEURISTIC
    note: >-
      The `hostile` filter is verified wrong in both directions. Never treat it
      as confirmation in either direction.
  - id: "threat.scan"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. The purpose-built replacement for `labor.unit-status
      hostile`: admits units by reachability rather than by a danger flag. Its
      own output labels flag-derived fields HEURISTIC. **Live-verified
      2026-09-12** against both failures that motivated it: correctly
      admitted a fox and a weasel by shared walkable group with no danger
      flag, correctly excluded two demons that do carry danger flags
      (decisions/DECISIONS.md 2026-09-12, "Threat detector LIVE-VERIFIED").
      Remaining unknowns: wildlife-noise volume on a larger fort, no ambush
      or sneaking-creature case tested.
  - id: "breach.check"
    status: exists
    reliability: HEURISTIC
    note: >-
      Added 2026-09-12. Water and magma detection, which has no DFHack event at
      all. **May be inert**: its cheap first stage triggers off a map-block flag
      that nothing in the shipped scripts ever reads, only sets, so whether DF
      itself raises it during natural liquid movement is unverified. Until that
      is settled, a `severity=none` result means nothing.
  - id: "queue.pending"
    status: exists
    note: >-
      Every proposal with no ruling yet, rendered as XML. Read-only; no
      cross-advisor visibility is granted here, only the Overseer's own view
      of what is waiting on it.

write:
  - id: "openarea.build"
    status: exists
    note: Resolves its own coordinate internally. Never pass one in.
  - id: "diggable.dig"
    status: exists
  - id: "diggable.dig-stair"
    status: exists
    note: >-
      Added handoffs/2026-09-17-dig-down-to-stone.md. Designates a
      downstair/upstair pair to extend the walkable network down one level
      -- never one half without the other. No paired diggable.find-stair
      read here, matching diggable.find/diggable.dig's own established
      pairing (the Overseer acts on the Architect's discovery, it does not
      discover for itself -- dfmcp/tests/test_roles.py
      test_the_overseer_can_act_but_cannot_discover), not the newer farm/
      zone/trees/well read-before-write pattern. DRY_RUN defaults to true;
      only the dry-run path is live-verified this session (real mutation
      was forbidden).
  - id: "landmarks.build"
    status: exists
  - id: "farm.build"
    status: exists
    note: >-
      Added handoffs/2026-09-16-farm-and-still-tools.md. DRY_RUN defaults
      to true -- an explicit false is required to actually mutate. Only the
      dry-run path is live-verified; the real quickfort/setName path is
      UNTESTED live. Blueprint not yet deployed to VM 103's
      dfhack-config/blueprints/ -- see blueprints/README.md.
  - id: "farm.set-crop"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. Writes
      building_farmplotst.plant_id[season] directly, by the same pattern
      as set_labor below. UNTESTED live for the real write (this fort has
      no farm plot to test against yet); only the plot-not-found refusal
      path was exercised.
  - id: "workshop.build"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. Only the dry-run path is
      live-verified. Blueprints not yet deployed. KIND now also accepts
      mason/mechanic/carpenter (handoffs/2026-09-17-water-and-industry-
      tools.md item 3) -- the real quickfort path for these three is
      UNTESTED live, same as still/kitchen already were.
  - id: "zone.place"
    status: exists
    note: >-
      Added handoffs/2026-09-17-water-and-industry-tools.md item 1.
      DRY_RUN defaults to true. The real path writes a throwaway #zone
      blueprint shaped to the chosen water body and deletes it after --
      UNTESTED live (mutation forbidden that stream); io availability and
      dfhack-config/blueprints/ resolution were confirmed live with a
      read-only open, the write itself was not exercised.
  - id: "trees.fell"
    status: exists
    note: >-
      Same handoff, item 2. DRY_RUN defaults to true. Real path calls
      dfhack.designations.markPlant directly (the same primitive
      quickfort's own chop symbol uses) -- UNTESTED live.
  - id: "well.build"
    status: exists
    note: >-
      Same handoff, item 5. DRY_RUN defaults to true. Needs a matching
      BLUEPRINT_FILE (a 1x1 #build `l` Well cell) deployed to
      dfhack-config/blueprints/ -- see blueprints/README.md. UNTESTED live.
  - id: "orders.create"
    status: exists
    note: >-
      Same handoff, item 4; job vocabulary extended
      handoffs/2026-09-18-lever-gap-tools.md. DRY_RUN defaults to true.
      JOB is one of blocks/mechanisms/barrels/brew_drink/bucket/bed/door/
      table/chair/splint/crutch/soap -- see the .lua file's own header for
      each job's live-verified df.job_type id and workshop_subtype
      confidence. No citizen currently holds the MANAGER noble position on
      this fort (live-verified) -- whether an order queues into a real job
      without one is unverified; reported as `manager_appointed` on every
      call, not enforced as a refusal. UNTESTED live for the real
      create_orders call.
  - id: "orders.cancel"
    status: exists
    note: >-
      Same handoff. DRY_RUN defaults to true. erase(idx)+delete() on the
      matching df.manager_order, inferred by convention (workorder.lua's
      own rollback pattern) and not independently proven by a real
      removal.
  - id: "labor.set-labor"
    status: exists
    hazard: >-
      FIXED 2026-09-16 (handoffs/2026-09-16-stocks-read-and-labor-race.md
      item 3), not yet redeployed to VM 103 (TOOLS.yaml marks this command
      STALE). No longer races autolabor by default: it now disables
      autolabor's management of that ONE LABOR, fort-wide, before writing,
      or refuses outright if it cannot tell whether autolabor is even
      enabled. The fort-wide (not per-unit) side effect is real and is
      named in the tool's own return message every time it fires -- treat
      any set-labor call as "this labor is now hand-managed for everyone,
      not just this citizen," not as a narrow, single-unit action.
  - id: "queue.rule"
    status: exists
    note: >-
      Accept/reject/defer one proposal. Restricted to the roster's sole_writer
      as a hard load-time rule (dfmcp/roles.py rule 6), on top of dfqueue.schema's
      own sole-writer check at write time -- two independent layers. The
      Overseer never holds queue.propose: its type vocabulary is empty by
      design (it rules on proposals, it never writes one -- §3, "Specialists
      propose, the Overseer decides").

planned:
  - id: "queue.plan"
    status: planned
    note: Write-ahead log for the ordered plan, then per-step completion marks.
  - id: "playbook.write"
    status: planned
  - id: "sentry.status"
    status: planned

# Explicitly denied, not merely absent. Denial is the point.
deny:
  - id: "ui.*"
    reason: >-
      Embark-time bootstrap only. Depends on global focus and cursor state, is
      the least sliceable write path in the repo, and collides with any human on
      the admin VNC channel.
  - id: "ui.embark-mode"
    reason: Would leave the live fort in a different game mode.
  - id: "doctrine.get"
    reason: >-
      Withheld handoffs/2026-09-19-get-doctrine-tool.md. The already-agreed
      design (Working.md 2026-09-17, "In discussion: designing the learning
      loop") routes the Overseer's doctrine fact-checking through the
      consultant before ruling, rather than the Overseer reading doctrine
      directly -- "The Overseer hands proposals to the consultant for
      fact-checking... before ruling." Granting this here would duplicate
      that agreed path. Revisit only if that design changes.
