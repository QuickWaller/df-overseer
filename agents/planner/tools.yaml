# Planner tool allowlist: 12 tools at stage P1 (research/2026-10-07-planner-design.md
# section 8: 12 at P1, 14 at P2, 17 at P3; revision 1 had 22).
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py (native ids from dfmcp/plan_tools.py and dfmcp/queue_tools.py
# are merged in): see dfmcp/README.md.
#
# **The role is `enabled: false` in agents/ROSTER.yaml until stage P1b**, so
# dfmcp/roles.py does not load this file yet; dfmcp/tests/test_planner_role.py
# loads it against a roster copy with the role enabled and pins the count.
#
# The Planner holds no mutating tool (dfmcp/roles.py rule 2): its one write
# that matters is `plan.write`, a write to dfqueue's own ledger, never to the
# fort. It decides what the fort needs; every physical change is somebody
# else's proposal, ruled by the Overseer and run by the conductor.
#
# Why this short: the more, narrower agents principle (design section 7). The
# digest and the plan slice are in its briefing, so a review is a few reads to
# check a doubt, an optional ask, a plan.write dry run and the real write, or a
# pass with a reason. Dropped from revision 1: blueprint.plan (no `provides`
# there), landmarks.get, stockpile.* (Logistics'), orders.list and
# workjob.list-jobs (the Quartermaster's).

schema_version: 1
role: planner
write_authority: none  # no fort-mutating tool; plan.write and queue.* write only to dfqueue's own ledger

read:
  - id: "overview.get"
    status: exists
    note: Situational context (population, alerts, in-game date).
  - id: "vitals.summary"
    status: exists
    note: >-
      Alive and dead counts. A per-citizen target divides by alive, so this is
      the number every such target is measured against.
  - id: "zone.list"
    status: exists
    note: >-
      Every zone the fort has, summarised by kind (counts_by_kind). The
      zones."KIND" signals a target names read this tool; read it yourself to
      check a doubt about a count.
  - id: "zone.list-kinds"
    status: exists
    note: >-
      Every zone kind the game can place, by token. A target's signal must name
      one of these tokens exactly; plan.write flags a typo and names the
      nearest token, but this is where to look first.
  - id: "nobles.requirements"
    status: exists
    note: >-
      Per position, which room-value and furniture requirements are met, not
      met, or cannot be told. A noble's room is a capacity the plan may need to
      name.
  - id: "blueprint.sites"
    status: exists
    note: >-
      The sites already reserved or built (handle, purpose, footprint, nearest
      landmark). What the fort already has, before the plan asks for more.
  - id: "circulation.graph"
    status: exists
    note: >-
      Read-only circulation graph of the rooms we have made: rooms, landmarks,
      stairs and ramps, dead ends and junctions as nodes, the walkable links
      between them as edges. Added 2026-10-09 (circulation stage C2, register
      2026-10-08): read it before proposing or planning a room, to see how
      people actually move through the block. Never a coordinate.
  - id: "circulation.walk"
    status: exists
    note: >-
      Read-only: the route between two named places from the same bounded
      window as circulation.graph, and what it passes through. Added
      2026-10-09 (C2). Use it to check that a room is not a corridor to
      another room before filing.
  - id: "queue.project_status"
    status: exists
    note: >-
      One line per project: what is already in flight toward a target, so a
      plan does not ask for what is being built.
  - id: "plan.read"
    status: exists
    note: >-
      The active plan (or a named version), one section, the last 8 version
      lines, and with status=true each target's computed position. The whole
      plan, not a slice.

  - id: "queue.my_filings"
    status: exists
    note: >-
      Added handoffs/2026-10-07-own-filings.md (research/2026-10-07-notebook-
      red-team.md finding 6). Your own proposals, newest first, with each one's
      status (pending, accepted, rejected, deferred, closed, completed, in a
      project), the latest ruling's reason and the project's step state. Your
      role comes from your credential; you cannot read anyone else's. Check it
      before filing: do not re-file what is accepted or in a project. The
      server refuses a repeat of an open action ("already proposed as
      proposal-N"). With asks=true it lists your own asks to the
      Consultant instead, each with its status and the answer's full text.

write:
  - id: "plan.write"
    status: exists
    note: >-
      File a new plan version: base_version plus only the sections you change.
      Mistakes are accepted and flagged, not refused; use dry_run first.
  - id: "queue.propose"
    status: exists
    note: >-
      Only a `plan_change` (dfqueue.schema.TYPE_VOCAB_BY_ROLE["planner"]): a
      request to revise the plan inside a season, ruled by the Overseer. The
      server rate-limits these.
  - id: "queue.pass"
    status: exists
    note: >-
      A review with nothing to change, recorded with a reason. The server notes
      the review tick beside the active version.
  - id: "queue.ask"
    status: exists
    note: >-
      A lookup question to the Consultant when a fact about game mechanics,
      not this fort's state, would change a target; or to the Quartermaster
      (`to: quartermaster`) for stock and consumption facts behind a crop level.

deny:
  - id: "doctrine.get"
    reason: >-
      Withheld for every proposer until a citation field exists
      (agents/architect/tools.yaml deny note).
  - id: "ui.*"
    reason: Embark bootstrap only. No role should use this in steady-state play.
