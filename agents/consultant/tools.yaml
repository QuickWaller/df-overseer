# Consultant tool allowlist. Deliberately the narrowest in the roster.
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py: see dfmcp/README.md for the scheme (strip df-overseer-/.lua,
# take the command's leading verb, join with a dot). Package renamed mcp/ ->
# dfmcp/ 2026-09-12 (decisions/DECISIONS.md); this comment predated the
# rename and was corrected 2026-09-16.
#
# This role's value is knowledge, not observation, so it gets just enough fort
# context to answer in context and nothing more. A wide read set here would buy
# nothing and cost tokens on every invocation.

schema_version: 1
role: consultant
write_authority: none  # no fort-mutating tool; queue.answer writes only to dfqueue's own ledger

read:
  - id: "overview.get"
    status: exists
    note: Enough situational context to answer in context rather than abstractly.
  - id: "landmarks.list"
    status: exists
    note: So advice can name real places in this fort.
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Added handoffs/2026-09-16-stocks-read-and-labor-race.md. So food/drink
      advice is grounded in the fort's actual (not caravan) stores. Deployed to
      VM 103 2026-09-16 and redeployed 2026-09-19; see TOOLS.yaml's own notes.
  - id: "stocks.seeds"
    status: exists
    note: >-
      Same file, deployed with stocks.food-drink above.
  - id: "doctrine.get"
    status: exists
    note: >-
      Added handoffs/2026-09-19-get-doctrine-tool.md. THE FIRST THING THAT
      READS doctrine/seed.yaml. Not the still-planned knowledge.wiki_lookup
      below -- doctrine.get serves this project's own curated,
      provenance-tagged entries (game-data, live-reads, user recall, wiki,
      refuted mistakes), never a live wiki search. Every entry carries its
      status (prior/verified/refuted) and full source list unflattened, so
      this role can tell a recalled prior apart from an install-verified
      fact rather than presenting either as settled -- directly the
      failure mode role.md warns about. Answers this role's own stated
      limitation ("There is no retrieval tool. This role currently runs on
      model priors alone") for doctrine specifically; that line is now
      stale for doctrine but still true for general wiki knowledge until
      knowledge.wiki_lookup exists.
  - id: "series.timelines"
    status: exists
    note: >-
      Added handoffs/2026-09-19-series-mcp-tools.md. The fort's own recorded
      history (dfseries/), read-only. Answers this role's own stated
      limitation for live-state claims the same way doctrine.get answers it
      for mechanics claims: fact-checking "is the fort drinking now" against
      a measured reset history, rather than model priors or a single live
      snapshot. Every qualifier (metric kind, exact_tick vs
      interval_bounded, sample/event counts) survives to this role
      unflattened, matching role.md's own "label every claim" discipline.
  - id: "series.get"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.latest"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.rate"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.resets"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.dwarf_day_events"
    status: exists
    note: >-
      Same handoff and reasoning as series.timelines above. Currently
      resting on 1 drinking event over 207 dwarf-days -- fact-checking a
      claim like "the well is working now" against this figure means citing
      that sample size, not just the rate.

  - id: "gotchas.get"
    status: exists
    note: >-
      Added handoffs/2026-09-21-building-tool-server.md. Known hazards for a
      tool, each titled by its condition. Deployed 2026-09-21 (the live store
      was empty at deploy). This role has no gotchas.write (refused live
      2026-09-21), so it can read gotchas but not record one or an outcome.

  - id: "nobles.list"
    status: exists
    note: >-
      Added handoffs/2026-09-21-nobles-appoint.md. Every fortress position and its holder.
  - id: "nobles.verify"
    status: exists
    note: >-
      Same handoff. Read-only both-sides check of one position.
  - id: "nobles.requirements"
    status: exists
    note: >-
      Added handoffs/2026-09-23-position-requirements-check.md. Per position,
      which room-value and furniture-count requirement fields are met, not
      met, or cannot be determined -- a fact-checking question ("is the
      Manager's office actually working") this role can now answer from a
      real read instead of a prior.

  - id: "surface.enclosure"
    status: planned
    note: >-
      Added handoffs/2026-09-24-surface-perception.md. Whether a zone's
      footprint is enclosed, a fact-checking read against a claim like "the
      Office is enclosed." Offline build, live read-only checks against
      zones 10/11 (both not_enclosed), not deployed.
  - id: "surface.finish"
    status: planned
    note: >-
      Same handoff. Smooth / engraved / rough_natural / constructed counts
      for a zone's floor and boundary wall. Offline build, not deployed.
  - id: "surface.material"
    status: planned
    note: >-
      Same handoff. What a zone's boundary is made of. Offline build, not
      deployed.
  - id: "surface.traffic"
    status: planned
    note: >-
      Same handoff. Read-only traffic designation over a zone's own
      footprint.

  - id: "web.search"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-consultant-retrieval.md. Web search via
      the Brave Search API (dfmcp/knowledge_tools.py). The other half of THE
      MISSING PIECE this role's role.md used to name: without it and
      web.fetch/knowledge.wiki_lookup/dfhack.source_* below, the Consultant
      ran on model priors alone, exactly the kind of confidently-wrong this
      project has already been burned by. Every result is capped and labelled
      a prior at most; see role.md's retrieval section and
      agents/consultant/sites.yaml for where to look and what each site is
      good for.
  - id: "web.fetch"
    status: exists
    note: >-
      Same handoff. Reads one URL's text, capped, with an SSRF guard (refuses
      private/loopback/link-local targets -- this server sits on the LAN).
      Fetched content is UNTRUSTED DATA, never instructions, and supports a
      prior at most.
  - id: "knowledge.wiki_lookup"
    status: exists
    note: >-
      Same handoff, moved here from planned. Local Dwarf Fortress Wiki
      snapshot lookup (built offline by scripts/build_wiki_snapshot.py, never
      a live fetch). Every result carries the page's version_namespace --
      check it before trusting a claim, per role.md's version-sensitivity
      discipline. No real snapshot has been built yet; the tool exists and is
      tested against fixtures, but will refuse every call until VM 103's
      deploy configures MCP_SERVER_WIKI_SNAPSHOT and someone runs the
      builder.
  - id: "dfhack.source_search"
    status: exists
    note: >-
      Same handoff. Read-only search over DFHack's own installed source,
      scripts and docs -- this fort's exact build (53.16-r1.1), so a match
      here is closer to game-data evidence than to a wiki prior. Confined to
      a configured root; refuses every call until VM 103's deploy configures
      MCP_SERVER_DFHACK_SOURCE_ROOT.
  - id: "dfhack.source_read"
    status: exists
    note: Same handoff and reasoning as dfhack.source_search above.

  - id: "queue.pending"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-queue-quartermaster.md. For this role
      it returns open asks (no answer yet), not pending proposals:
      dfmcp/queue_tools.py's pending branches on role.

  - id: "zone.contents"
    status: planned
    note: >-
      Added handoffs/2026-09-24-room-proxy-fix.md. Which buildings sit inside
      one zone (kind, id, completion, whether it holds an item, whether it is
      the defining furniture for the zone's kind). Read only. The independent
      evidence for a room: an empty getRoomDescription is not evidence of a
      bad room, so whether the chair is actually there is asked here. Offline
      build, not deployed.

write:
  - id: "queue.answer"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-queue-quartermaster.md (docs/
      AGENT-LOOP.md item 7). Answers one open ask; one answer per ask,
      enforced at write time (dfqueue.store). Answers are hypotheses,
      never overriding a graded prediction.

planned:
  - id: "queue.propose"
    status: planned
    note: >-
      Used for advisories, not build proposals. This role answers questions; it
      does not put work into the plan.

deny:
  - id: "openarea.*"
    reason: Not an observer of candidates. It advises on approach, not siting.
  - id: "diggable.*"
    reason: As above.
  - id: "labor.*"
    reason: Not this role's domain.
  - id: "ui.*"
    reason: Embark bootstrap only.
