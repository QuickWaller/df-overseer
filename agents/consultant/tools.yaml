# Consultant tool allowlist. Deliberately the narrowest in the roster.
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py: see dfmcp/README.md for the scheme (strip df-overseer-/.lua,
# take the command's leading verb, join with a dot). Package renamed mcp/ ->
# dfmcp/ 2026-09-12 (decisions/DECISIONS.md); this comment predated the
# rename and was corrected 2026-09-16.
#
# This role's value is knowledge, not observation, so it gets just enough fort
# context to answer in context and nothing more. A wide read set here would buy
# nothing and cost tokens on every invocation.

schema_version: 1
role: consultant
write_authority: none

read:
  - id: "overview.get"
    status: exists
    note: Enough situational context to answer in context rather than abstractly.
  - id: "landmarks.list"
    status: exists
    note: So advice can name real places in this fort.
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Added handoffs/2026-09-16-stocks-read-and-labor-race.md. So food/drink
      advice is grounded in the fort's actual (not caravan) stores. Deployed to
      VM 103 2026-09-16 and redeployed 2026-09-19; see TOOLS.yaml's own notes.
  - id: "stocks.seeds"
    status: exists
    note: >-
      Same file, deployed with stocks.food-drink above.
  - id: "doctrine.get"
    status: exists
    note: >-
      Added handoffs/2026-09-19-get-doctrine-tool.md. THE FIRST THING THAT
      READS doctrine/seed.yaml. Not the still-planned knowledge.wiki_lookup
      below -- doctrine.get serves this project's own curated,
      provenance-tagged entries (game-data, live-reads, user recall, wiki,
      refuted mistakes), never a live wiki search. Every entry carries its
      status (prior/verified/refuted) and full source list unflattened, so
      this role can tell a recalled prior apart from an install-verified
      fact rather than presenting either as settled -- directly the
      failure mode role.md warns about. Answers this role's own stated
      limitation ("There is no retrieval tool. This role currently runs on
      model priors alone") for doctrine specifically; that line is now
      stale for doctrine but still true for general wiki knowledge until
      knowledge.wiki_lookup exists.
  - id: "series.timelines"
    status: exists
    note: >-
      Added handoffs/2026-09-19-series-mcp-tools.md. The fort's own recorded
      history (dfseries/), read-only. Answers this role's own stated
      limitation for live-state claims the same way doctrine.get answers it
      for mechanics claims: fact-checking "is the fort drinking now" against
      a measured reset history, rather than model priors or a single live
      snapshot. Every qualifier (metric kind, exact_tick vs
      interval_bounded, sample/event counts) survives to this role
      unflattened, matching role.md's own "label every claim" discipline.
  - id: "series.get"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.latest"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.rate"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.resets"
    status: exists
    note: Same handoff and reasoning as series.timelines above.
  - id: "series.dwarf_day_events"
    status: exists
    note: >-
      Same handoff and reasoning as series.timelines above. Currently
      resting on 1 drinking event over 207 dwarf-days -- fact-checking a
      claim like "the well is working now" against this figure means citing
      that sample size, not just the rate.

  - id: "gotchas.get"
    status: exists
    note: >-
      Added handoffs/2026-09-21-building-tool-server.md. Known hazards for a
      tool, each titled by its condition. Deployed 2026-09-21 (the live store
      was empty at deploy). This role has no gotchas.write (refused live
      2026-09-21), so it can read gotchas but not record one or an outcome.

  - id: "nobles.list"
    status: exists
    note: >-
      Added handoffs/2026-09-21-nobles-appoint.md. Every fortress position and its holder.
  - id: "nobles.verify"
    status: exists
    note: >-
      Same handoff. Read-only both-sides check of one position.

planned:
  - id: "queue.propose"
    status: planned
    note: >-
      Used for advisories, not build proposals. This role answers questions; it
      does not put work into the plan.
  - id: "knowledge.wiki_lookup"
    status: planned
    note: >-
      THE MISSING PIECE OF THIS ROLE. Without it the Consultant runs on model
      priors alone, which for v50-specific mechanics is exactly the kind of
      confidently-wrong this project has already been burned by. See role.md.

deny:
  - id: "openarea.*"
    reason: Not an observer of candidates. It advises on approach, not siting.
  - id: "diggable.*"
    reason: As above.
  - id: "labor.*"
    reason: Not this role's domain.
  - id: "ui.*"
    reason: Embark bootstrap only.
