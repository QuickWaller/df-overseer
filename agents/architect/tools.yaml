# Architect tool allowlist. READ-ONLY plus one write: propose.
#
# Ids are the canonical scheme resolved against scripts/dfhack/TOOLS.yaml by
# dfmcp/registry.py: see dfmcp/README.md for the scheme (strip df-overseer-/.lua,
# take the command's leading verb, join with a dot). Package renamed mcp/ ->
# dfmcp/ 2026-09-12 (decisions/DECISIONS.md); this comment predated the
# rename and was corrected 2026-09-16.
# Scoping here is not only a permission boundary: a narrow read set keeps the
# prompt small, which is cheaper AND keeps this role further under the
# compliance cliff (§10).

schema_version: 1
role: architect
write_authority: none      # enforced: this role has no FORT-mutating action tool
                            # at all (Tool.mutates stays strictly "mutates fort
                            # state" -- roles.py rule 2). queue.propose/queue.pass
                            # below ARE writes, but to dfqueue's own ledger, never
                            # to the fort, so they do not contradict this line
                            # (handoffs/2026-09-15-queue-into-dfmcp.md).

read:
  - id: "ledger.read"
    status: exists
    note: >-
      Added handoffs/2026-09-23-attention-tiers-ingame.md. Per-race
      observation ledger (sightings/outcomes, never per-unit). Research
      doc S:E3(6): a repeated wildlife pattern ("kea sighted 14 times, 2
      confirmed thefts") is fence/trap proposal material for this role.
  - id: "openarea.find"
    status: exists
    note: Ranked candidates in already-open, walkable space.
  - id: "diggable.find"
    status: exists
    note: >-
      Ranked candidates in solid rock or soil. v1 returns adjacent-only
      candidates; connector-tunnel cost scoring is not implemented, so
      non-adjacent options are simply absent rather than ranked low.
  - id: "diggable.find-stair"
    status: exists
    note: >-
      Added handoffs/2026-09-17-dig-down-to-stone.md. Single-tile
      stair-anchor candidates (a walkable column with diggable rock/soil
      directly below it), for extending the walkable network down one
      level where `diggable.find`'s box scan can never return anything
      (no walkable tile exists yet at that level for it to border).
      Deployed to VM 103 2026-09-18 and run live there
      (handoffs/2026-09-18-well-unblock.md).
  - id: "chokepoints.find"
    status: exists
    note: >-
      Only the first half of build item 7 is built. `rank_candidate_sites` is
      genuinely blocked on resource and threat data that do not exist.
  - id: "landmarks.list"
    status: exists
  - id: "landmarks.get"
    status: exists
  - id: "connectivity.report"
    status: exists
  - id: "connectivity.check"
    status: exists
    note: TOOLS.yaml tags this unverified. Do not rest a proposal on it alone.
  - id: "overview.get"
    status: exists
  - id: "stuckjobs.find"
    status: exists
    note: A stalled dig is often a siting mistake, so this is your feedback loop.
  - id: "stocks.food-drink"
    status: exists
    note: >-
      Added handoffs/2026-09-16-stocks-read-and-labor-race.md. Fort-owned (never
      caravan-owned) drink/prepared-meal/raw-edible counts plus
      rotten/unreachable flags per bucket. Deployed to VM 103 2026-09-16 and
      redeployed 2026-09-19; see TOOLS.yaml's own notes.
  - id: "stocks.seeds"
    status: exists
    note: >-
      Fort-owned seed counts by plant. Same file, deployed with stocks.food-
      drink above.
  - id: "stocks.availability"
    status: exists
    note: >-
      Added handoffs/2026-09-19-per-item-flags-tool.md as an offline build;
      deployed and run live 2026-09-19 (handoffs/2026-09-19-deploy-and-live-
      verify.md), and the six-deduction form (in_job, owned+UNIT_HOLDER, forbid,
      trader, in_building, construction) deployed 2026-09-20
      (handoffs/2026-09-19-deploy-batch.md). Per-item-type netting, not just a
      total, so a proposal can tell '0 buckets exist' apart from '3 exist but
      all job-claimed/forbidden/dwarf-owned', which are different fixes.
      owned_ref_check.verified_offline is true since both UNIT_HOLDER branches
      were exercised live 2026-09-19. TOOLS.yaml still tags the command
      unverified (a registry test pins that), so read it as run live once, not
      as settled.
  - id: "farm.find"
    status: exists
    note: >-
      Added handoffs/2026-09-16-farm-and-still-tools.md. Candidate farm-plot
      floor near a landmark, tagged outside/inside and the fort-owned seeds
      actually valid there. Deployed to VM 103 2026-09-17.
  - id: "farm.list"
    status: exists
    note: >-
      Added handoffs/2026-09-17-farm-tool-fixes.md. Every built farm plot with
      its id and per-season crop. Deployed to VM 103 2026-09-17.
  - id: "workshop.find"
    status: exists
    note: >-
      Same handoff, extended handoffs/2026-09-17-water-and-industry-tools.md
      item 3 with mason/mechanic/carpenter KIND values and a building_material
      report shared by all five kinds. Deployed to VM 103 2026-09-17. It covers
      five kinds only; building.find is the generic one.
  - id: "zone.find"
    status: exists
    note: >-
      Added handoffs/2026-09-17-water-and-industry-tools.md item 1 as a water-
      body finder, deployed 2026-09-17. Generalised by handoffs/2026-09-21-zone-
      tool-generalise.md to any of the install's 18 zone kinds (WaterSource
      keeps its own finder), deployed with the new script 2026-09-21; not called
      after that deploy, only zone.list-kinds and zone.check-owner were. It is
      the discovery half of placing a zone.
  - id: "trees.find"
    status: exists
    note: >-
      Same handoff, item 2. Distance-banded tree counts/reachability near a
      landmark, plus CUTWOOD labor and fort-owned axe counts, never a per-tree
      list (design commitment #1, and ~1,593 visible trees on this map).
      Deployed to VM 103 2026-09-17.
  - id: "well.find"
    status: exists
    note: >-
      Same handoff, item 5. Ranked pond-edge well sites (quickfort's own
      empty/ramp-top + floor-adjacent rule, plus this project's own >=3/7-deep-
      revealed-water rule), with BLOCKS/BUCKET/CHAIN/TRAPPARTS fort-owned
      counts. Deployed to VM 103 2026-09-17.
  - id: "orders.list"
    status: exists
    note: >-
      Same handoff, item 4. Pending manager orders plus whether a Manager is
      currently appointed. Deployed to VM 103 2026-09-17. It read
      manager_appointed false when first live-verified; since 2026-09-21 unit
      345 holds MANAGER (handoffs/2026-09-21-nobles-appoint.md), but the fort
      has no Office and queued manager orders still do not run.
  - id: "workjob.list"
    status: exists
    note: >-
      Added handoffs/2026-09-19-workshop-add-job.md. Read-only job vocabulary
      (blocks/mechanisms/brew_drink), harmless, and useful when a proposal needs
      to name the direct-workshop-job route as an alternative to a manager order
      that has stalled (orders.list above showed manager_appointed false when
      this was written; a Manager has since been appointed but manager orders
      still do not run). Deployed 2026-09-19. Does not grant the ability to act;
      see the workjob.queue deny below.
  - id: "workjob.list-jobs"
    status: planned
    note: >-
      Added handoffs/2026-09-21-workjob-generalise.md (dispatched 2026-09-23).
      Read-only: every job a named workshop actually offers, taken from
      DFHack's own workshops.getJobs rather than a hand-maintained list, each
      with its token, what it needs and a six-deduction availability read.
      This is what makes workjob.queue's generalisation reachable: without it
      a role can only guess job tokens. Measured coverage 28 of 33 workshop
      and furnace kinds; the five without jobs are named in TOOLS.yaml.
      Offline build plus read-only live verification, not deployed.
  - id: "orders.check-duplicate"
    status: planned
    note: >-
      Added handoffs/2026-09-23-order-job-attribution-and-checks.md item 4.
      Read-only: what is already in flight for a JOB across both routes,
      useful before proposing more of it. Offline build, not deployed.
  - id: "stockpile.list"
    status: exists
    note: >-
      Added handoffs/2026-09-18-lever-gap-tools.md. Every stockpile:
      landmark-relative name, occupied/total tiles (a leading indicator --
      docs/PRODUCTION-MODEL.md sec8), coarse accept categories. Read this
      before proposing a new stockpile or a site change.
  - id: "stockpile.links"
    status: exists
    note: >-
      Same handoff. Give/take links for one stockpile or workshop id.
      Both of Uniboslan's stockpiles are unlinked today, live-verified --
      a misconfigured/absent link is one of the six diagnoses
      docs/PRODUCTION-MODEL.md sec13 names with no prior tool to see it.

  - id: "gotchas.get"
    status: exists
    note: >-
      Added handoffs/2026-09-21-building-tool-server.md. Known hazards for a
      tool, each titled by its condition. Try a listed one only if its title
      applies and the tool fails without it. Deployed 2026-09-21 (the live store
      was empty at deploy).
  - id: "gotchas.write"
    status: exists
    note: >-
      Same handoff. Records a proposed gotcha, or an outcome on an existing one.
      It changes no fort state, only the gotcha store. Deployed 2026-09-21; the
      write path was tested only against a temporary store, never the live one.
  - id: "building.list-kinds"
    status: exists
    note: >-
      Added handoffs/2026-09-21-building-tool-lua.md. Every building kind the
      game can place, from quickfort's own table. Deployed 2026-09-21.
  - id: "building.find"
    status: exists
    note: >-
      Same handoff. Ranked sites and what the kind needs, for any kind. Read-
      only. Deployed 2026-09-21.
  - id: "labor.enabled-counts"
    status: exists
    note: >-
      Same handoff. How many citizens have a labor enabled; null plus an error
      when unknown, never 0. Deployed 2026-09-21.

  - id: "nobles.list"
    status: exists
    note: >-
      Added handoffs/2026-09-21-nobles-appoint.md. Every fortress position and its holder.
  - id: "nobles.verify"
    status: exists
    note: >-
      Same handoff. Read-only both-sides check of one position.
  - id: "nobles.requirements"
    status: exists
    note: >-
      Added handoffs/2026-09-23-position-requirements-check.md. Per position,
      which of its own room-value and furniture-count requirement fields are
      met, not met, or cannot be determined -- the question this fort's
      Office siting needs an Architect to weigh before proposing a room.

  - id: "zone.list-kinds"
    status: exists
    note: >-
      Added handoffs/2026-09-21-zone-tool-generalise.md. Every zone kind the game can place.
  - id: "zone.check-owner"
    status: exists
    note: >-
      Same handoff. Read-only: whether a zone kind can be given this owner (a unit or a position).
  - id: "zone.list"
    status: planned
    note: >-
      Added handoffs/2026-09-23-zone-inventory-and-validity.md, the fix for
      the exact gap that produced "there is no Office zone anywhere" (there
      were two). Every zone this fort has, filterable by kind, owner,
      validity and landmark; an unfiltered call summarises rather than
      flooding the caller. Read this before proposing a new room, so a
      fiftieth bedroom is checked against what already exists rather than
      guessed at. Offline build, not deployed.

  - id: "surface.enclosure"
    status: planned
    note: >-
      Added handoffs/2026-09-24-surface-perception.md, closing the exact gap
      this role's own audit found: it could not see a wall as a wall, so
      enclosure was unanswerable. A count of the zone's boundary-ring gaps,
      each typed doorway / open_floor_edge / missing_wall, three-state
      (enclosed / not_enclosed / cannot_tell). Offline build, live read-only
      checks against zones 10/11 (both not_enclosed), not deployed.
  - id: "surface.finish"
    status: planned
    note: >-
      Same handoff. How many of a zone's own floor tiles, and its boundary
      ring's WALL-shaped tiles, are smooth / engraved / rough_natural /
      constructed -- what makes the user's "every room at least smoothed,
      or walls built" standard checkable at all. Offline build, live
      read-only checks against zones 10/11 (both entirely rough_natural, as
      expected for two never-dug outdoor zones), not deployed.
  - id: "surface.material"
    status: planned
    note: >-
      Same handoff. What every boundary-ring tile is made of (SOIL, STONE,
      CONSTRUCTION, ...), which decides whether a wall there can be
      smoothed or must be built -- soil cannot be smoothed on this install,
      settled from the install's own tiletype data this same stream (see
      the .lua file's own header). Offline build, not deployed.
  - id: "surface.traffic"
    status: planned
    note: >-
      Same handoff. Read-only: the traffic designation set over a zone's
      own footprint tiles. This fort has never set one anywhere, so a
      uniform Normal reading is the expected answer, not an error.
      Designating traffic is a write and stays out of this role's reach
      (write_authority: none, above). Offline build, not deployed.

write:
  - id: "queue.propose"
    status: exists
    note: >-
      The only route into the queue: a specialist cannot emit prose into it
      (docs/AGENT-ARCHITECTURE.md §4). Writes to dfqueue's own SQLite ledger,
      never to the fort; role/id/ts/cycle/snapshot are stamped server-side.
  - id: "queue.pass"
    status: exists
    note: >-
      An explicit decline, recorded rather than silently doing nothing --
      role.md: "a cycle with no proposal is a valid cycle."
  - id: "queue.ask"
    status: exists
    note: >-
      Added handoffs/2026-09-22-loop-queue-quartermaster.md (docs/
      AGENT-LOOP.md item 7, the 2026-09-15 ask exception: "any advisor may
      ask the Consultant"). A lookup question, never a fact-check routing
      (that is the Overseer's own move, naming a proposal_id, before
      ruling) -- this role may set proposal_id on its own ask too, but
      doing so never blocks anything; only an Overseer-authored ask with
      proposal_id set blocks a ruling.

deny:
  - id: "openarea.build"
    reason: Advisors do not act. Propose it.
  - id: "diggable.dig"
    reason: Advisors do not act. Propose it.
  - id: "diggable.dig-stair"
    reason: Advisors do not act. Propose it.
  - id: "landmarks.build"
    reason: Advisors do not act. Propose it.
  - id: "farm.build"
    reason: Advisors do not act. Propose it.
  - id: "farm.set-crop"
    reason: Advisors do not act. Propose it.
  - id: "workshop.build"
    reason: Advisors do not act. Propose it.
  - id: "zone.place"
    reason: Advisors do not act. Propose it.
  - id: "trees.fell"
    reason: Advisors do not act. Propose it.
  - id: "well.build"
    reason: Advisors do not act. Propose it.
  - id: "orders.create"
    reason: Advisors do not act. Propose it.
  - id: "orders.cancel"
    reason: Advisors do not act. Propose it.
  - id: "workjob.queue"
    reason: Advisors do not act. Propose it.
  - id: "workjob.cancel"
    reason: Advisors do not act. Propose it.
  - id: "labor.set-labor"
    reason: Not this role's domain, and it races autolabor regardless.
  - id: "ui.*"
    reason: Embark bootstrap only. No role should use this in steady-state play.
  - id: "doctrine.get"
    reason: >-
      Withheld handoffs/2026-09-19-get-doctrine-tool.md, not for lack of
      use -- several existing entries (water-source-needs-walkable-
      neighbour, sunken-basin-recognition, do-not-dig-into-full-basin,
      seed-stock-never-falls) bear directly on the siting and dig-order
      proposals this role writes. Withheld because the agreed design for
      how a proposal cites doctrine ("every proposal must list the
      doctrine entries it relied on", Working.md 2026-09-17) has no field
      in dfqueue.schema yet, so granting read access now would be an
      unenforced convention, not a wired requirement. Revisit when that
      field exists.
  - id: "series.*"
    reason: >-
      Withheld handoffs/2026-09-19-series-mcp-tools.md. The fort's own
      recorded history (dfseries/) bears on siting less directly than on
      arbitration or fact-checking: docs/TIMESERIES.md's design explicitly
      names quartermaster (inventory/production trends), the overseer
      (arbitration) and the consultant (fact-checking) as the three roles
      concerned with this data; the Architect is not one of them. This
      role's proposals are spatial (where things go), not about whether the
      fort is drinking or producing enough -- that judgment belongs to
      whichever role actually decides what to do about it. Revisit if a
      proposal type ever needs to cite a measured trend directly rather
      than a Quartermaster/Overseer assessment of one.
