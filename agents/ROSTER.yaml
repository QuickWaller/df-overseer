# df-overseer agent roster
#
# THE ONLY FILE YOU EDIT TO ADD, REMOVE OR SWAP A ROLE.
# Flip `enabled`, and that role joins or leaves the roster. No code change.
#
# Design: docs/AGENT-ARCHITECTURE.md (§3 roster, §11 modularity).
# Decisions: decisions/DECISIONS.md 2026-09-12 rows.
#
# STATUS 2026-09-16 (original note, kept for the record): the MCP server
# these allowlists reference is live on VM 103 (dfmcp-server.service), and
# two of the three then-enabled roles have actually run against it:
# architect and overseer, each as a one-shot openclaw `agent exec` on VM
# 106, not as a resident service. architect wrote the first real queue
# proposal (proposal-0001, 2026-09-15) and overseer ruled on it
# (ruling-0001, accepted, 2026-09-16). consultant has not yet made a real
# call. No role runs continuously; this file still describes a roster, not
# a running loop. → decisions/DECISIONS.md 2026-09-14 to 2026-09-16 rows.
#
# UPDATED 2026-09-23: quartermaster and conductor are both now enabled too
# (see their own entries below). The conductor service exists on VM 106,
# installed and Docker-capable, but has never run as a live systemd
# service -- only a manual, foreground `--dry-run --once`. Whether
# quartermaster or consultant has ever run a real `agent exec` call (as
# opposed to being pinned, validated and probed live against the MCP
# server) is UNKNOWN as of this pass -- no run record for either was found.
# So "no role runs continuously; this file still describes a roster, not a
# running loop" is still true today, unchanged since 2026-09-16.

schema_version: 1
fort: Uniboslan            # "Ragwind", VM 103. One roster per fort.

# Exactly one role may hold write authority. See §7: DF has no transaction
# boundary, and DFHack serialises every write through one tick-gated mutex, so
# extra writers buy no throughput. This is settled, not a v1 simplification.
sole_writer: overseer

roles:

  overseer:
    enabled: true
    dir: overseer
    kind: actor
    summary: Arbitrates proposals, sets priorities, owns the plan and the WIP limit, writes playbooks, and is the only component that mutates the fort.

  architect:
    enabled: true
    dir: architect
    kind: advisor
    summary: Rooms, workshops, stockpile siting, smoothing, dig order. Proposes, never acts.

  consultant:
    enabled: true
    dir: consultant
    kind: advisor
    summary: Dwarf Fortress domain knowledge on demand. Answers questions, never decides.

  # `kind: system`, added handoffs/2026-09-22-loop-clock-conductor-role.md:
  # code, never an agent (docs/AGENT-LOOP.md). Its token
  # (MCP_ROLE_TOKEN_CONDUCTOR) is held only by the conductor service (a
  # later stream), never by a model. dfmcp/roles.py's SYSTEM_CLASS_TOOL_IDS
  # is the narrow, load-time-checked exception that lets this role hold
  # tools that mutate DFHack's own runtime state (frame cap, pause,
  # the tripwire watcher, quicksave) despite not being the sole_writer --
  # and, unlike the ordinary sole_writer carve-out, that exception has no
  # sole_writer exception either, so the Overseer cannot be granted
  # clock.resume by editing its own tools.yaml.
  conductor:
    enabled: true
    dir: conductor
    kind: system
    summary: Runs the game clock, the in-game tripwire watcher and quicksave. Code, never an agent; wakes the other roles per cycle.

  # ---- Defined but NOT enabled. Charters exist so enabling one later is a
  # ---- config change, per §11. Each is blocked on tools, not on a decision.

  quartermaster:
    enabled: true             # enabled 2026-09-22 for the agent loop MVP (user's call, docs/AGENT-LOOP.md)
    dir: quartermaster
    kind: advisor
    summary: Food, drink, seeds, work orders, stock thresholds.

  marshal:
    enabled: false
    dir: marshal
    kind: advisor
    blocked_on: >-
      No write tools. `unit-status hostile` is still verified unreliable in
      both directions and the event layer has the same blind spot by
      construction (`INVASION` fires only for registered invasions, not
      ambushes, thieves or aggressive wildlife) -- but the purpose-built
      detector this used to say was required work first now exists and is
      live-verified (`threat.scan`, 2026-09-12, admits by reachability not by
      danger flag; currently granted to the Overseer only). What still blocks
      this role is the write-tool half: no military posture/squad/burrow
      action tools exist yet.
    summary: Military posture, burrows, squads, equipment, training, post-fight triage. Deliverable is playbooks, not live orders.

  chronicler:
    enabled: false
    dir: chronicler
    kind: advisor
    blocked_on: >-
      No tool in this repo writes a chronicle entry. The nearest analogue,
      `df-overseer-diff`'s event log, is deliberately ephemeral, which is the
      opposite of what a chronicle needs.
    summary: The history, written for humans. The project's public-facing output.

# Roles rejected as agents and implemented as code instead, recorded here so
# they are not re-proposed (§3, §12):
#   efficiency_analysis -> a tool returning ranked findings. Deterministic.
#   safety_veto         -> refusals in the tool layer. A guardrail that can be
#                          forgotten is not a guardrail.
