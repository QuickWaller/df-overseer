# The conductor's triage rules and clock policy, held as DATA
# (docs/AGENT-LOOP.md item 1: "Triage rules and the clock policy as data").
#
# Nothing in conductor/cycle.py branches on a literal wake-reason string;
# every reason named here is looked up through conductor/policy.py's
# Policy.reason(name), so adding, retuning or retiring a reason is an edit
# to this file, never to the cycle loop's own code.
#
# Checked into the repo (not a secret, not runtime-written state) -- unlike
# infra/local.example.env's placeholders, real starting values belong here
# directly, the same way scripts/dfhack/df-overseer-clock.lua's own tripwire
# defaults are real numbers, not placeholders.

schema_version: 1

# docs/AGENT-LOOP.md §2's three levels. base_fps is a SETTING, not a
# constant ("the user may lower full speed later... every rule below is
# written in ticks, so it holds whatever base_fps is set to").
base_fps: 100
think_fps: 10

# §2's "closing in" rule: slow only when ticks to a computable consequence
# fall under this many multiples of expected thinking time (in ticks at the
# current base_fps).
closing_in_multiple: 3

# Starting value, in real seconds. conductor/policy.py's
# update_expected_thinking_seconds is how this becomes a measured, moving
# figure from each run's own wall-clock rather than staying this guess
# forever -- see that function's own docstring for the update rule.
expected_thinking_seconds: 90

# §4 triage rules v1: "at least every 7 game days" if nothing else has woken
# the advisors. DF's fixed calendar is 1200 ticks/day (dfqueue/grade.py's
# own GAME_TICKS_PER_YEAR comment cites the same wiki source).
routine_review_interval_game_days: 7

# handoffs/2026-09-23-stalled-order-poller.md: research/2026-09-23-
# announcement-severity.md §C found that a manager order which never
# dispatches produces no announcement of any kind -- the only way to see it
# is to poll orders.list and diff validated/active across cycles
# (conductor/order_watch.py). Both values are in raw game ticks (not game
# days), matching this file's own "every rule below is written in ticks"
# convention for the closing-in rule above.
#
# stalled_order_threshold_ticks: how long an order must sit validated=true,
# active=false (or validated=false, "blocked" -- see order_watch.py) before
# it counts as a genuine stall rather than an ordinary between-cycles wait.
# 1200 ticks = 1 game day: this fort's own real incident sat stalled for
# WEEKS (CLAUDE.md's status line), so a one-day gate is conservative in the
# direction of catching a real stall fast without firing off a single
# cycle's normal dispatch lag. Not measured against a real run (no VM this
# stream) -- worth retuning once a real cycle cadence is observed.
#
# stalled_order_renotify_ticks: once an order has fired once, how long
# before the SAME order id is allowed to fire again while it stays
# stalled/blocked. Set equal to the threshold (also 1 game day): a stalled
# order is worth a daily reminder while unresolved, not a one-time-only
# notice that could be silently forgotten, but never every single cycle
# (handoffs/2026-09-23-stalled-order-poller.md item 1: "how not to wake
# every cycle for the same order stalled for a known reason").
stalled_order_threshold_ticks: 1200
stalled_order_renotify_ticks: 1200

# handoffs/2026-10-05-stuck-job-watch.md (conductor/job_watch.py): the
# stuck_job wake below fires from polling stuckjobs.find, not from a diff
# event (nothing emits one). A job with no worker counts as stuck once it
# has sat that way for the threshold, in raw game ticks; 2400 = 2 game days,
# since a fresh job is routinely unclaimed for hours. Suspended jobs have
# their own key because a suspended job is often a deliberate wait
# (buildingplan holds one until an item attaches), so it is tunable alone.
# Renotify: a still-stuck job wakes again only after this many ticks (10
# game days), never every cycle. Not tuned against a real run.
stuck_job_unclaimed_threshold_ticks: 2400
stuck_job_suspended_threshold_ticks: 2400
stuck_job_renotify_ticks: 12000

# handoffs/2026-10-05-ore-exposed-signal.md (conductor/ore_watch.py,
# conductor/lanes.py): the conductor polls blueprint.sites, whose rows carry
# `ore_exposed` (ore or gem still walled in on a dug room's faces). A
# (site, material) wakes the Architect once when first seen, re-arms when it
# leaves the read (mined), and otherwise wakes again only after this many
# game ticks still exposed (12000 = 10 game days), so a vein never wakes it
# every cycle. Not tuned against a real run.
ore_renotify_ticks: 12000

# Every wake reason this conductor build knows about. `clock` is the
# fallback table entry (§2); `computable: true` means conductor/cycle.py
# will prefer the ticks-to-consequence rule over this fallback whenever it
# can actually compute a ticks-to-consequence value for that reason, per
# policy.clock_for_reason. `wakes` names which role(s) this reason wakes;
# an empty list means the reason affects the clock but wakes nobody by
# itself (docs/AGENT-LOOP.md §2's hostile-seen-but-unreachable row).
#
# handoffs/2026-10-05-stricter-wakes.md: a role wakes only on a change in its
# own lane. `routine_review` still wakes both advisors every interval, so
# nothing goes unchecked long. `prediction_graded` is raised by the cycle only
# for a MISS (a hit is recorded, nobody wakes); its `wakes` lists both advisors
# because queue.grade does not say who proposed the prediction, so a miss
# cannot yet be narrowed to its proposer. `lane_event`, `alert_crossed` and
# `ruling_on_own` carry no fixed role list: the roles come from `lane_triggers`
# below, per event.
wake_reasons:
  routine_review:
    clock: full_speed
    wakes: [architect, quartermaster]
  prediction_due:
    clock: full_speed
    wakes: [architect, quartermaster]
  prediction_graded:
    clock: full_speed
    wakes: [architect, quartermaster]
  # Planting and the season's food plan are the Quartermaster's; the
  # Architect's lane has its own triggers (dig and construction completions).
  season_change:
    clock: full_speed
    wakes: [quartermaster]
  # New citizens need beds (Architect) and food (Quartermaster).
  migrant_wave:
    clock: full_speed
    wakes: [architect, quartermaster]
  lane_event:
    clock: full_speed
    wakes: []
  # Roles come from `lane_triggers.<role>.ore`, like the three below.
  ore_exposed:
    clock: full_speed
    wakes: []
  alert_crossed:
    clock: full_speed
    wakes: []
  ruling_on_own:
    clock: full_speed
    wakes: []
  # Which role wakes is read per stuck job from `lane_triggers.<role>.
  # stuck_jobs` below; this list is only the fallback when no lane is defined.
  stuck_job:
    clock: full_speed
    wakes: [quartermaster]
    computable: true
  stock_below_target:
    clock: full_speed
    wakes: [quartermaster]
    computable: true
  vital_nearing_threshold:
    clock: slowed
    wakes: [quartermaster]
    computable: true
  caravan_present:
    clock: slowed
    wakes: [quartermaster]
  hostile_seen_unreachable:
    clock: slowed
    wakes: []
  # handoffs/2026-09-23-stalled-order-poller.md item 1: same production
  # domain as stuck_job/stock_below_target above (both wake only the
  # quartermaster), so this reuses that same precedent rather than
  # inventing a new role assignment -- the Quartermaster proposes orders,
  # the Overseer (the queue's sole writer) already wakes separately,
  # through queue_holds_for_overseer, once the Quartermaster has actually
  # written a proposal addressing it.
  stalled_order:
    clock: slowed
    wakes: [quartermaster]
  # A validated:false order (the Manager could not validate it at all) is a
  # more fundamental failure than an ordinary stall, but this build has no
  # live evidence yet that it needs a different role or clock level, so it
  # is deliberately given the same table entry as stalled_order rather than
  # a guessed escalation -- see conductor/order_watch.py's own docstring.
  blocked_order:
    clock: slowed
    wakes: [quartermaster]
  # handoffs/2026-09-23-attention-tiers-ingame.md item 2 / this stream's
  # item 4: the sibling in-game stream's fifth tripwire exposes the 23
  # `slow`-level announcement ids (research/2026-09-23-announcement-
  # severity.md) rather than pausing on them. `wakes` here is deliberately
  # empty and UNUSED for role selection -- which role(s) wake is read per
  # event from that event's own `wake` field (copied from the severity
  # YAML's own per-type `wake` list, which can differ by announcement type),
  # not a single fixed role list the way every other reason above works.
  # Only `clock` is read from this entry. See conductor/cycle.py's
  # `_classify_slow_announcements` for the assumed event shape -- not yet
  # confirmed against a real payload from that stream, recorded as an
  # assumed interface in this stream's Result section.
  slow_announcement:
    clock: slowed
    wakes: []
  # Stage 2D (docs/CONDUCTOR-EXECUTION.md 5): the execute phase tells a routed
  # project's proposer how its work went. The role comes from the project, not
  # from this list (lanes.py, `lane_triggers.<role>.execution` is the fallback).
  step_done:
    clock: full_speed
    wakes: []
  step_attention:
    clock: full_speed
    wakes: []
  project_idle:
    clock: full_speed
    wakes: []
  tripwire:
    clock: paused
    wakes: [overseer]
  # handoffs/2026-10-05-pause-safety.md: the pause watchdog
  # (conductor/pause_watch.py) wakes the Overseer for a pause no tripwire
  # explains whose cause is a threat, an unknown announcement type, or a
  # plain pause past its grace period. The fort stays paused through the run.
  unexplained_pause:
    clock: paused
    wakes: [overseer]

# Stage T (handoffs/2026-10-06-stage-t-tripwire.md): who runs after a tripwire
# latches, before the Overseer. Keyed by the latch's own `reason`. A reason
# with no entry, an unknown cause included, wakes the Overseer alone. The
# Overseer always runs last and is the only role whose explicit `pause.verdict`
# (resume true) lets the conductor resume; hostiles name the Overseer here
# until a military role exists.
tripwire_owners:
  thirst_critical: [quartermaster]
  hunger_critical: [quartermaster]
  hostile_reachable: [overseer]

# The same cause latching more than `limit` times within `window_ticks` game
# ticks (4800 = 4 game days) goes to the human instead of re-running the
# sequence. The in-game watcher has no hysteresis (a resumed fort whose
# dwarves are still past the threshold re-latches on the next check), so this
# is the only brake. Starting values.
tripwire_repeat:
  limit: 3
  window_ticks: 4800

# Stage 2D (docs/CONDUCTOR-EXECUTION.md 4.5, 5): the execute phase, after the
# Overseer. Ticks are raw game ticks (8400 = 7 game days). Starting values.
# ore_hold_phase: a phase whose label matches waits while ore or an unclassified
# tile shows on its site's room walls (handoffs/2026-10-05-ore-exposed-signal.md).
execution:
  max_steps_per_cycle: 4
  idle_wake_ticks: 8400
  idle_close_ticks: 8400
  uncertain_hold_after: 3
  transient_attention_after: 3
  unknown_attention_after: 3
  refusal_limit: 3
  urgency_order: [high, normal, low]
  ore_hold_phase: '(_finish|_zone|_build)$'

# Per-role cap (real seconds) on one `agent exec` run; roles not listed use
# CONDUCTOR_ROLE_TIMEOUT_SECONDS (default 600). First real cycle 2026-09-25
# (evals/live/2026-09-25-first-real-conductor-cycle): the Architect took 158 s
# and the Quartermaster 93 s for one proposal each; the Overseer, ruling on
# four proposals with six failed tool calls on top, hit 600 s after its work
# had landed. MEASURED afterwards from the dfmcp journal (per-call timestamps):
# the Overseer's calls ran 02:36:48 to 02:46:20 with 1 to 3 minute gaps of model
# thinking between them, its last write (queue.executed) came at about 583 s and
# the kill 17 s later. So it was working the whole time, not lingering: the cap
# was too tight, and 1200 gives headroom. Retune from the next run's cost and
# wall clock.
role_timeout_seconds:
  overseer: 1200

# After the advisors run, re-read the queue and wake the Consultant for an ask
# they filed this cycle (otherwise it waits a whole cycle; ask-0001 did).
consultant_rewake_after_advisors: true

# docs/CONDUCTOR-EXECUTION.md 3.3: threshold alerts replace fixed stock lists.
# A line appears in every role's briefing only while the read value (divided by
# `per`, "alive" for the live citizen count, or omitted) is BELOW `below`; a
# failed read drops its line. Generic: `read` is any read tool on the
# conductor's own allowlist (agents/conductor/tools.yaml), `field` a dotted
# path to one number in its result. `text` may use {value}, {per_value} and
# {threshold}. Starting values, not tuned against a real run: retune from the
# journal. Adding an alert is a data entry here plus, for a new tool, one
# allowlist line.
threshold_alerts:
  - name: drink_per_citizen
    read: {tool: stocks.food-drink, args: {}, field: drink.units}
    per: alive
    below: 2
    text: "Drink is low: {value} units, {per_value} per citizen (alert below {threshold})."
  - name: raw_food_per_citizen
    read: {tool: stocks.food-drink, args: {}, field: raw_edibles.units}
    per: alive
    below: 1
    text: "Raw food is low: {value} units, {per_value} per citizen (alert below {threshold})."

# The old `unexecuted_wake_ignore` list is gone (stage 2D). Deploy 2a closes
# every accepted pre-cutover ruling (`python -m conductor.cutover legacy
# --apply`), after which they no longer count as unexecuted; until it has run
# the cycle sends no unexecuted wake at all (conductor/cycle.py
# `_carry_out_wake_ids`), and it never sends one under an operator hold.

# handoffs/2026-10-05-stricter-wakes.md: what counts as a change in a role's
# own lane. Read generically by conductor/lanes.py; adding a trigger is an
# edit here. The Consultant (open asks) and the Overseer (pending proposals,
# accepted-not-carried-out, tripwire, pause paths) keep their existing wakes
# and have no lane here.
#
# events: drained diff.since events in the role's OWN drain, so "since its last
#   completed run" is the cursor. Matched on the event `type`, optionally on a
#   regex over its `detail` (the job name, for JOB_COMPLETED).
# stuck_jobs: regexes over a due stuck job's type and description.
# alerts: threshold_alerts names ("*" = any); wakes once when newly crossed,
#   again only after the alert clears and re-crosses.
# rulings: a ruling on a proposal this role filed (the conductor learns the
#   proposer by watching which advisor's run added a pending proposal).
# ore: an ore or gem newly exposed on a dug room's walls (edge triggered, see
#   ore_renotify_ticks above).
#
# Not observable by the conductor today: a new landmark. Dig and construction
# completions stand in for it. Starting patterns, not tuned against a run.
lane_triggers:
  architect:
    events:
      - type: JOB_COMPLETED
        detail_matches: ['\b(dig|channel|carve|smooth|engrave|construct|build|detail)\b']
    stuck_jobs: ['dig|channel|carve|smooth|engrave|construct|build|detail']
    rulings: true
    # Ore exposed by a dig is the Architect's to propose mining
    # (handoffs/2026-10-05-ore-exposed-signal.md).
    ore: true
    # The Architect proposes rooms, so it is the fallback recipient of the
    # execute phase's step_done / step_attention / project_idle.
    execution: true
  quartermaster:
    events:
      - type: stock_below_threshold
    stuck_jobs: ['brew|cook|prepare|make|craft|forge|weave|mill|process|butcher|tan|smelt|sew|clothes|plant|harvest|kiln|still|farm|collect']
    alerts: ["*"]
    rulings: true

# Caps on the full per-run transcript the conductor archives and reports
# (conductor/runner.py build_transcript; handoffs/2026-10-07-transcripts-and-
# full-proposals.md). Read by the runner directly, not by conductor/policy.py.
# Characters, applied per round except max_total_chars (the whole transcript
# as JSON; later rounds are dropped and counted when it is exceeded).
transcript:
  max_rounds: 60
  max_call_args_chars: 600
  max_result_chars: 800
  max_round_text_chars: 2000
  max_total_chars: 60000
