# The conductor's triage rules and clock policy, held as DATA
# (docs/AGENT-LOOP.md item 1: "Triage rules and the clock policy as data").
#
# Nothing in conductor/cycle.py branches on a literal wake-reason string;
# every reason named here is looked up through conductor/policy.py's
# Policy.reason(name), so adding, retuning or retiring a reason is an edit
# to this file, never to the cycle loop's own code.
#
# Checked into the repo (not a secret, not runtime-written state) -- unlike
# infra/local.example.env's placeholders, real starting values belong here
# directly, the same way scripts/dfhack/df-overseer-clock.lua's own tripwire
# defaults are real numbers, not placeholders.

schema_version: 1

# docs/AGENT-LOOP.md §2's three levels. base_fps is a SETTING, not a
# constant ("the user may lower full speed later... every rule below is
# written in ticks, so it holds whatever base_fps is set to").
base_fps: 100
think_fps: 10

# §2's "closing in" rule: slow only when ticks to a computable consequence
# fall under this many multiples of expected thinking time (in ticks at the
# current base_fps).
closing_in_multiple: 3

# Starting value, in real seconds. conductor/policy.py's
# update_expected_thinking_seconds is how this becomes a measured, moving
# figure from each run's own wall-clock rather than staying this guess
# forever -- see that function's own docstring for the update rule.
expected_thinking_seconds: 90

# §4 triage rules v1: "at least every 7 game days" if nothing else has woken
# the advisors. DF's fixed calendar is 1200 ticks/day (dfqueue/grade.py's
# own GAME_TICKS_PER_YEAR comment cites the same wiki source).
routine_review_interval_game_days: 7

# handoffs/2026-09-23-stalled-order-poller.md: research/2026-09-23-
# announcement-severity.md §C found that a manager order which never
# dispatches produces no announcement of any kind -- the only way to see it
# is to poll orders.list and diff validated/active across cycles
# (conductor/order_watch.py). Both values are in raw game ticks (not game
# days), matching this file's own "every rule below is written in ticks"
# convention for the closing-in rule above.
#
# stalled_order_threshold_ticks: how long an order must sit validated=true,
# active=false (or validated=false, "blocked" -- see order_watch.py) before
# it counts as a genuine stall rather than an ordinary between-cycles wait.
# 1200 ticks = 1 game day: this fort's own real incident sat stalled for
# WEEKS (CLAUDE.md's status line), so a one-day gate is conservative in the
# direction of catching a real stall fast without firing off a single
# cycle's normal dispatch lag. Not measured against a real run (no VM this
# stream) -- worth retuning once a real cycle cadence is observed.
#
# stalled_order_renotify_ticks: once an order has fired once, how long
# before the SAME order id is allowed to fire again while it stays
# stalled/blocked. Set equal to the threshold (also 1 game day): a stalled
# order is worth a daily reminder while unresolved, not a one-time-only
# notice that could be silently forgotten, but never every single cycle
# (handoffs/2026-09-23-stalled-order-poller.md item 1: "how not to wake
# every cycle for the same order stalled for a known reason").
stalled_order_threshold_ticks: 1200
stalled_order_renotify_ticks: 1200

# Every wake reason this conductor build knows about. `clock` is the
# fallback table entry (§2); `computable: true` means conductor/cycle.py
# will prefer the ticks-to-consequence rule over this fallback whenever it
# can actually compute a ticks-to-consequence value for that reason, per
# policy.clock_for_reason. `wakes` names which role(s) this reason wakes;
# an empty list means the reason affects the clock but wakes nobody by
# itself (docs/AGENT-LOOP.md §2's hostile-seen-but-unreachable row).
wake_reasons:
  routine_review:
    clock: full_speed
    wakes: [architect, quartermaster]
  prediction_due:
    clock: full_speed
    wakes: [architect, quartermaster]
  prediction_graded:
    clock: full_speed
    wakes: [architect, quartermaster]
  season_change:
    clock: full_speed
    wakes: [architect, quartermaster]
  migrant_wave:
    clock: full_speed
    wakes: [architect, quartermaster]
  stuck_job:
    clock: full_speed
    wakes: [quartermaster]
    computable: true
  stock_below_target:
    clock: full_speed
    wakes: [quartermaster]
    computable: true
  vital_nearing_threshold:
    clock: slowed
    wakes: [quartermaster]
    computable: true
  caravan_present:
    clock: slowed
    wakes: [quartermaster]
  hostile_seen_unreachable:
    clock: slowed
    wakes: []
  # handoffs/2026-09-23-stalled-order-poller.md item 1: same production
  # domain as stuck_job/stock_below_target above (both wake only the
  # quartermaster), so this reuses that same precedent rather than
  # inventing a new role assignment -- the Quartermaster proposes orders,
  # the Overseer (the queue's sole writer) already wakes separately,
  # through queue_holds_for_overseer, once the Quartermaster has actually
  # written a proposal addressing it.
  stalled_order:
    clock: slowed
    wakes: [quartermaster]
  # A validated:false order (the Manager could not validate it at all) is a
  # more fundamental failure than an ordinary stall, but this build has no
  # live evidence yet that it needs a different role or clock level, so it
  # is deliberately given the same table entry as stalled_order rather than
  # a guessed escalation -- see conductor/order_watch.py's own docstring.
  blocked_order:
    clock: slowed
    wakes: [quartermaster]
  # handoffs/2026-09-23-attention-tiers-ingame.md item 2 / this stream's
  # item 4: the sibling in-game stream's fifth tripwire exposes the 23
  # `slow`-level announcement ids (research/2026-09-23-announcement-
  # severity.md) rather than pausing on them. `wakes` here is deliberately
  # empty and UNUSED for role selection -- which role(s) wake is read per
  # event from that event's own `wake` field (copied from the severity
  # YAML's own per-type `wake` list, which can differ by announcement type),
  # not a single fixed role list the way every other reason above works.
  # Only `clock` is read from this entry. See conductor/cycle.py's
  # `_classify_slow_announcements` for the assumed event shape -- not yet
  # confirmed against a real payload from that stream, recorded as an
  # assumed interface in this stream's Result section.
  slow_announcement:
    clock: slowed
    wakes: []
  tripwire:
    clock: paused
    wakes: [overseer]
