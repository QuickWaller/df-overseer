<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragwind: the fortress stream</title>
<meta name="description" content="A Dwarf Fortress colony run by AI agents, live conversation and decisions.">
<link rel="stylesheet" href="style.css?v=41">
<link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
<!--
  The PUBLIC page. Per research/2026-10-01-stream-page-design.md section 5
  (departure from the mockup, agreed by the user 2026-10-01): there is no
  Public/Operator switch here at all. Operator data lives only behind the
  admin hostname's Access gate (operator.html, deployed separately in a
  later slice); a switch on this page could only ever be decoration or a
  leak, so it does not exist, by construction, not by convention.

  This is slice S0: `dataRoot` points at a local folder built by
  scripts/export_stream_feed.py (see README.md in this directory). No live
  VM access, no relay, no polling of anything outside this folder.

  Site navigation, Agents, Tools, Forts and the Chronicle stub
  (handoffs/2026-10-02-site-agents-tools.md): `app.js` now exports a
  `SitePage` that owns the top navigation and mounts the ORIGINAL
  `StreamPage` unchanged for the Board view. `marked` (pinned, from cdnjs,
  CLAUDE.md's "external scripts only from cdnjs or jsdelivr, pinned") is
  used only to render a role's own committed `role.md` on its Charter tab
  -- repo-authored prose, never live or operator-tainted text; see app.js's
  `_charterEl` for the safety handling (links stripped, no `<script>`
  survives either way) and the page's own fallback (plain preformatted
  text) when this script fails to load.
-->
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="app.js?v=41"></script>
<script>
  const page = new SitePage({ dataRoot: "data/public", mode: "public", liveViewSrc: "vnc.html?autoconnect=true&resize=scale&view_only=true", root: document.getElementById("app") });
  page.start();
</script>
</body>
</html>
